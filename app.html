/* ── Centro de avisos (campana) ──────────────────────────────── */
.campana .cnt.salta { animation: pop .42s var(--resorte); }
.campana[aria-expanded="true"] { --bg: var(--fondo-3); }
.ap-pan { position: fixed; z-index: 95; background: #fff; border: 1px solid var(--borde); border-radius: 18px; box-shadow: var(--sombra-3);
  display: flex; flex-direction: column; max-height: min(620px, calc(100vh - 90px)); overflow: hidden;
  transform-origin: calc(var(--flecha, 90%)) top; animation: apIn .26s var(--resorte); }
.ap-pan.sale { animation: apOut .2s var(--ease-in) forwards; }
@keyframes apIn { from { opacity: 0; transform: translateY(-6px) scale(.96); } }
@keyframes apOut { to { opacity: 0; transform: translateY(-4px) scale(.97); } }
.ap-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 16px 10px; }
.ap-h { font-size: 17px; font-weight: 760; letter-spacing: -.01em; }
#ap-n b { color: var(--marca); font-weight: 700; }
.ap-pan > .seg { margin: 0 16px 8px; }
.ap-pan .seg .cuenta { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: rgba(28, 25, 23, .07); font-size: 10.5px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.ap-pan .seg button[data-v="nuevos"] .cuenta:not(:empty):not([data-cero]) { background: var(--marca); color: #fff; }
.ap-lista { overflow-y: auto; overscroll-behavior: contain; padding: 4px 8px 8px; flex: 1; min-height: 120px; }
.ap-it { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 11px 10px 11px 12px; border-radius: 12px; cursor: pointer; overflow: hidden;
  transition: background var(--t-r), opacity var(--t), height .32s var(--ease), padding .32s var(--ease), margin .32s var(--ease);
  animation: entra .34s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms); }
.ap-lista.sin-anim .ap-it { animation: none; }
.ap-it:hover { background: var(--fondo-2); }
.ap-it:focus-visible { outline: none; box-shadow: inset var(--foco); }
.ap-it + .ap-it { margin-top: 2px; }
.ap-it .a-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; transition: filter var(--t), opacity var(--t); }
.ap-txt { flex: 1; min-width: 0; }
.ap-tit { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
.ap-det { font-size: 13px; color: var(--texto-2); line-height: 1.35; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ap-meta { display: flex; gap: 5px; align-items: center; font-size: 11.5px; color: var(--texto-3); margin-top: 4px; min-width: 0; }
.ap-meta > span:first-child { flex: none; } .ap-sep { opacity: .6; }
.ap-it.nuevo { background: linear-gradient(90deg, rgba(191, 17, 0, .045), rgba(191, 17, 0, 0) 70%); }
.ap-it.nuevo::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--marca); transition: transform var(--t) var(--ease); }
.ap-it.nuevo:hover { background: linear-gradient(90deg, rgba(191, 17, 0, .07), var(--fondo-2) 70%); }
.ap-it.leido .ap-tit { font-weight: 560; color: var(--texto-2); }
.ap-it.leido .ap-det { color: var(--texto-3); }
.ap-it.leido .a-ico { filter: saturate(.25); opacity: .7; }
.ap-it.leido::before { transform: scaleY(0); }
/* Botón leído / no leído: punto rojo que se convierte en tilde */
.ap-marca { position: relative; flex: none; width: 30px; height: 30px; margin: 2px -2px 0 0; border-radius: 50%; display: grid; place-items: center; color: var(--texto-3); transition: background var(--t-r), color var(--t-r); }
.ap-marca .ico { position: absolute; opacity: 0; transform: scale(.5); transition: opacity var(--t), transform var(--t) var(--resorte); }
.ap-marca .ap-pt { width: 9px; height: 9px; border-radius: 50%; background: var(--marca); box-shadow: 0 0 0 3px rgba(191, 17, 0, .12); transition: transform var(--t) var(--resorte), opacity var(--t); }
.ap-it.leido .ap-pt { transform: scale(0); opacity: 0; }
.ap-it.nuevo .ap-marca:hover { background: var(--ok-suave); color: var(--ok); }
.ap-it.nuevo .ap-marca:hover .ap-pt { transform: scale(0); opacity: 0; }
.ap-it.nuevo .ap-marca:hover .ico { opacity: 1; transform: scale(1); }
.ap-it.leido .ap-marca .ico { opacity: .55; transform: scale(.9); color: var(--ok); }
.ap-it.leido .ap-marca:hover { background: var(--fondo-3); }
.ap-it.leido .ap-marca:hover .ico { opacity: 0; transform: scale(.5); }
.ap-it.leido .ap-marca:hover .ap-pt { transform: scale(.8); opacity: .5; }
.ap-it.saliendo { opacity: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; transform: translateX(16px); transition: opacity .2s, transform .3s var(--ease), height .32s var(--ease), padding .32s var(--ease), margin .32s var(--ease); }
.ap-vacio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 34px 20px 30px; animation: aparecer .3s var(--ease); }
.ap-vacio b { font-size: 15px; margin-top: 6px; }
.ap-vacio .btn { margin-top: 8px; }
.ap-ok { width: 54px; height: 54px; border-radius: 50%; background: var(--ok-suave); color: var(--ok); display: grid; place-items: center; animation: pop .5s var(--resorte); }
.ap-ok .ico { width: 26px; height: 26px; stroke-width: 2.6; stroke-dasharray: 30; stroke-dashoffset: 30; animation: trazo .5s .18s var(--ease) forwards; }
.ap-pie { border-top: 1px solid var(--borde); padding: 8px; display: flex; justify-content: center; }
/* En el celular: hoja que sube desde abajo */
.ap-fondo { position: fixed; inset: 0; z-index: 94; background: rgba(28, 25, 23, .32); animation: aparecer .2s; }
.ap-fondo.sale { animation: apFondoOut .2s forwards; }
@keyframes apFondoOut { to { opacity: 0; } }
.ap-pan.hoja { left: 0; right: 0; bottom: 0; top: auto; width: auto; border-radius: 22px 22px 0 0; max-height: 82vh; padding-bottom: env(safe-area-inset-bottom);
  animation: hojaIn .34s var(--ease); transition: transform .25s var(--ease); }
.ap-pan.hoja.sale { animation: hojaOut .22s var(--ease-in) forwards; }
@keyframes hojaIn { from { transform: translateY(100%); } }
@keyframes hojaOut { to { transform: translateY(100%); } }
.ap-asa { width: 40px; height: 4px; border-radius: 2px; background: var(--borde-2); margin: 8px auto 0; }
.ap-pan.hoja .ap-cab { padding-top: 10px; }
.ap-pan.hoja .ap-marca { width: 36px; height: 36px; }
@media (hover: none) { .ap-it.nuevo .ap-marca { background: var(--fondo-3); } .ap-it.nuevo .ap-marca .ap-pt { transform: scale(.9); } }

/* ── Catálogo con fotos (Stock › Productos) ──────────────────── */
.catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.cat-it { position: relative; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--borde); border-radius: 18px; overflow: hidden; cursor: pointer;
  box-shadow: var(--sombra-1); transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease), border-color var(--t-r); }
.cat-it:hover { transform: translateY(-3px); box-shadow: var(--sombra-3); border-color: var(--borde-2); }
.cat-it:active { transform: translateY(-1px) scale(.995); }
.cat-it:focus-visible { outline: none; box-shadow: var(--foco), var(--sombra-2); }
.cat-foto { position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; }
.cat-foto svg { width: 62%; height: 62%; opacity: .75; transition: transform .6s var(--ease); }
.cat-foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.04); transition: opacity .55s var(--ease), transform .9s var(--ease); }
.cat-foto img.ok { opacity: 1; transform: scale(1); }
.cat-it:hover .cat-foto img.ok, .cat-it:hover .cat-foto svg { transform: scale(1.06); }
.cat-foto::after { content: ''; position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(to top, rgba(28, 25, 23, .34), transparent); opacity: 0; transition: opacity var(--t); pointer-events: none; }
.cat-it:hover .cat-foto::after { opacity: 1; }
.cat-cat { position: absolute; top: 10px; left: 10px; z-index: 1; height: 24px; padding: 0 9px; border-radius: 99px; display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 650;
  background: rgba(255, 255, 255, .88); color: var(--texto); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-marca { position: absolute; top: 40px; left: 10px; z-index: 1; height: 22px; padding: 0 8px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); animation: pop .4s var(--resorte) both; animation-delay: calc(var(--i, 0) * 30ms + .2s); }
.cat-marca.alerta { background: var(--alerta); } .cat-marca.pend { background: var(--pend); } .cat-marca.gris { background: var(--gris); }
.cat-vars { position: absolute; z-index: 2; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 99px; background: rgba(255, 255, 255, .9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.cat-vars .mini { padding: 0 5px 0 2px; font-weight: 700; color: var(--texto-2); }
.cat-var { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; transition: transform var(--t-r) var(--resorte), box-shadow var(--t-r); }
.cat-var:hover { transform: scale(1.18); }
.cat-var.act { box-shadow: 0 0 0 2px var(--marca); }
.cat-info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.cat-n { font-weight: 700; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.cat-v { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--texto-2); min-width: 0; }
.cat-cod { margin-left: auto; color: var(--texto-3); font-size: 11.5px; flex: none; }
.cat-pie { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; }
.cat-precio { font-size: 18px; font-weight: 780; letter-spacing: -.02em; }
.cat-tot { font-size: 12px; color: var(--texto-2); white-space: nowrap; } .cat-tot b { color: var(--ok); font-size: 13px; }
.cat-tot.cero b { color: var(--alerta); }
.cat-locs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.cat-loc { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px; border-radius: 8px; background: var(--fondo-3); font-size: 11.5px; font-weight: 600; color: var(--texto-2); }
.cat-loc i { width: 7px; height: 7px; border-radius: 50%; }
.cat-loc b { color: var(--texto); font-weight: 750; }
.cat-loc.bajo { background: var(--pend-suave); } .cat-loc.bajo b { color: var(--pend); }
.cat-loc.cero { background: var(--alerta-suave); } .cat-loc.cero b { color: var(--alerta); }
.cat-loc.nada { opacity: .6; }
.cat-extra { font-size: 11.5px; color: var(--texto-3); margin-top: 2px; }
.cat-mas { grid-column: 1 / -1; }
.cat-credito { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 22px 0 6px; font-size: 12px; color: var(--texto-3); text-align: center; }
@media (max-width: 520px) {
  .catalogo { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .cat-it { border-radius: 14px; }
  .cat-info { padding: 9px 10px 11px; } .cat-n { font-size: 13px; } .cat-precio { font-size: 15.5px; }
  .cat-cod, .cat-tot span, .cat-extra { display: none; }
  .cat-cat { top: 7px; left: 7px; font-size: 10.5px; height: 21px; padding: 0 7px; }
  .cat-marca { top: 32px; left: 7px; font-size: 10px; height: 20px; }
  .cat-vars { right: 6px; bottom: 6px; } .cat-var { width: 19px; height: 19px; }
  .cat-locs { gap: 4px; } .cat-loc { height: 21px; padding: 0 5px; font-size: 10.5px; gap: 4px; }
}
/* Foto de la ficha: se puede abrir en grande */
.mini-prod.con-foto { cursor: zoom-in; transition: transform var(--t) var(--ease), box-shadow var(--t); }
.mini-prod.con-foto:hover { transform: scale(1.04); box-shadow: var(--sombra-2); }
/* Visor de fotos */
.visor { position: fixed; inset: 0; z-index: 200; background: rgba(18, 16, 15, .86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 24px; animation: aparecer .22s; cursor: zoom-out; }
.visor.sale { animation: apFondoOut .2s forwards; }
.visor figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 100%; }
.visor-marco { position: relative; min-width: 120px; min-height: 120px; display: grid; place-items: center; }
.visor img { max-width: min(1100px, 92vw); max-height: 78vh; border-radius: 14px; box-shadow: 0 30px 90px rgba(0, 0, 0, .5); opacity: 0; transform: scale(.94); transition: opacity .35s var(--ease), transform .45s var(--resorte); }
.visor.listo img { opacity: 1; transform: none; }
.visor-carga { position: absolute; width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .25); border-top-color: #fff; animation: girar .8s linear infinite; }
.visor.listo .visor-carga { display: none; }
.visor figcaption { color: #fff; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; cursor: default; text-align: center; }
.visor figcaption .mut { color: rgba(255, 255, 255, .7); }
.visor-cred { width: 100%; font-size: 11.5px; color: rgba(255, 255, 255, .5); }
.visor-x { position: fixed; top: 16px; right: 16px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center; transition: background var(--t-r); }
.visor-x:hover { background: rgba(255, 255, 255, .26); }
.cat-it.cambio .cat-info > * { animation: entra .3s var(--ease) both; }
.cat-it.cambio .cat-info > :nth-child(2) { animation-delay: 30ms; } .cat-it.cambio .cat-info > :nth-child(3) { animation-delay: 60ms; } .cat-it.cambio .cat-info > :nth-child(4) { animation-delay: 90ms; }
.cat-it.cambio .cat-var.act { animation: pop .35s var(--resorte); }
.cat-locs { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }
.cat-loc { justify-content: center; }
.cat-precio { white-space: nowrap; }

/* ── Gastos: lo que falta pagar ─────────────────────────────── */
.pagar-grilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pagar-it { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 16px 20px; text-align: left; border-right: 1px solid var(--borde); transition: background var(--t-r); }
.pagar-it:last-child { border-right: 0; }
.pagar-it:hover { background: var(--fondo-2); }
.pagar-it .etq { font-size: 12px; font-weight: 650; color: var(--texto-2); text-transform: uppercase; letter-spacing: .04em; }
.pagar-it b { font-size: 22px; font-weight: 780; letter-spacing: -.02em; }
.pagar-it .mini { color: var(--texto-3); }
.pagar-it.alerta { background: linear-gradient(180deg, var(--alerta-suave), #fff 85%); } .pagar-it.alerta b, .pagar-it.alerta .etq { color: var(--alerta); }
.pagar-it.pend b, .pagar-it.pend .etq { color: var(--pend); }
.filtro-chip .cuenta { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--fondo-3); font-size: 10.5px; display: inline-grid; place-items: center; margin-left: 4px; font-variant-numeric: tabular-nums; }
.filtro-chip .cuenta.alerta { background: var(--alerta); color: #fff; }
.filtro-chip.act .cuenta:not(.alerta) { background: var(--marca-borde); color: var(--marca); }
.pago-bloque { padding: 14px; border-radius: 14px; background: var(--fondo-2); border: 1px solid var(--borde); }
@media (max-width: 520px) {
  .pagar-grilla { grid-template-columns: 1fr; }
  .pagar-it { border-right: 0; border-bottom: 1px solid var(--borde); padding: 12px 16px; flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 10px; }
  .pagar-it:last-child { border-bottom: 0; }
  .pagar-it .etq { flex: 1; } .pagar-it b { font-size: 18px; } .pagar-it .mini { width: 100%; }
}
.g-fichas { display: flex; flex-direction: column; }
.g-ficha { padding: 12px 16px; border-bottom: 1px solid var(--borde); cursor: pointer; }
.g-ficha:last-child { border-bottom: 0; }
.g-ficha.vencido { background: linear-gradient(90deg, var(--alerta-suave), #fff 70%); box-shadow: inset 3px 0 0 var(--alerta); }
.g-ficha .mini { white-space: nowrap; }

/* ════════════════════════════════════════════════════════════════
   css/03-bienvenida — presentación de WYDAN (identidad de Wydan:
   azul marino, gris acero, Poppins e Inter). Los colores de D'leon
   van solo dentro de la vista previa.
   ════════════════════════════════════════════════════════════════ */
:root {
  --w-azul: #14294A; --w-azul-2: #1B3A5B; --w-acero: #6E7C8C; --w-plata: #9AA6B2;
  --w-fondo: #F4F6F9; --w-texto-suave: #5A6773;
  --w-sombra: 0 10px 30px rgba(20, 41, 74, .10); --w-sombra-fuerte: 0 18px 50px rgba(20, 41, 74, .20);
  --w-titulo: 'Poppins', system-ui, sans-serif; --w-cuerpo: 'Inter', system-ui, sans-serif;
}
#bienvenida { position: fixed; inset: 0; z-index: 600; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 40px 18px;
  font-family: var(--w-cuerpo); background: radial-gradient(900px 420px at 50% -8%, #E6EBF3 0%, transparent 62%), var(--w-fondo); }
#bienvenida.sale { animation: bvSale .26s var(--ease-in) forwards; }
@keyframes bvSale { to { opacity: 0; transform: scale(.985); } }
.bv-in { width: 100%; max-width: 660px; text-align: center; margin: auto; }
.bv-marca { margin-bottom: 30px; }
.bv-marca img { width: 224px; max-width: 60%; height: auto; display: block; margin: 0 auto; }
.bv-para { font-size: 10.5px; letter-spacing: 3.6px; text-transform: uppercase; color: var(--w-plata); font-weight: 600; }
.bv-t { font-family: var(--w-titulo); font-size: 33px; font-weight: 700; color: var(--w-azul); line-height: 1.15; letter-spacing: -.4px; margin-top: 8px; }
.bv-s { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--w-acero); margin-top: 9px; font-weight: 500; }
.bv-frase { font-size: 16.5px; line-height: 1.6; color: var(--w-texto-suave); margin: 22px auto 0; max-width: 500px; }
.bv-vista { margin: 30px auto 26px; max-width: 540px; }
.bv-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--w-azul); color: #fff; border: none; padding: 15px 30px; border-radius: 10px;
  font-family: var(--w-cuerpo); font-size: 14px; font-weight: 600; letter-spacing: .3px; box-shadow: var(--w-sombra); transition: transform .18s, background .18s, box-shadow .18s; }
.bv-btn:hover { background: var(--w-azul-2); transform: translateY(-2px); box-shadow: var(--w-sombra-fuerte); }
.bv-btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(20, 41, 74, .25), var(--w-sombra); }
.bv-btn b { display: inline-block; transition: transform .18s; }
.bv-btn:hover b { transform: translateX(5px); }
.bv-pie { margin-top: 26px; font-size: 12px; color: var(--w-plata); }

/* Vista previa: maqueta a escala de la página de D'leon */
.bv-prev { border-radius: 14px; overflow: hidden; padding: 18px; box-shadow: var(--w-sombra-fuerte); background: linear-gradient(160deg, #22456F 0%, #0C1C34 100%); }
.bvm { display: grid; grid-template-columns: 70px 1fr; height: 236px; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 14px 34px rgba(0, 0, 0, .45); text-align: left; }
.bvm-lat { background: #FAFAF9; border-right: 1px solid #ECEBEA; padding: 10px 8px; display: flex; flex-direction: column; gap: 7px; }
.bvm-logo { width: 44px; height: 16px; border-radius: 4px; background: var(--marca); margin-bottom: 8px; transform: rotate(-4deg); }
.bvm-nav { height: 9px; border-radius: 3px; background: #ECEAE7; }
.bvm-nav.on { background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .12), inset 2px 0 0 var(--marca); }
.bvm-cuerpo { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bvm-top { display: flex; gap: 6px; align-items: center; }
.bvm-sel { width: 46px; height: 12px; border-radius: 4px; border: 1px solid #E2E0DD; }
.bvm-bus { flex: 1; height: 12px; border-radius: 4px; background: #F4F3F1; }
.bvm-btn { width: 30px; height: 12px; border-radius: 4px; background: var(--marca); }
.bvm-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.bvm-kpi { height: 30px; border-radius: 5px; border: 1px solid #ECEBEA; padding: 5px; display: flex; flex-direction: column; gap: 4px; }
.bvm-kpi i { width: 60%; height: 3px; border-radius: 2px; background: #D6D3D0; } .bvm-kpi b { width: 80%; height: 6px; border-radius: 2px; background: #1C1917; }
.bvm-kpi.osc { background: #1C1917; border-color: #1C1917; } .bvm-kpi.osc i { background: #6B6560; } .bvm-kpi.osc b { background: #fff; }
.bvm-grilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; min-height: 0; }
.bvm-prod { border: 1px solid #ECEBEA; border-radius: 5px; padding: 3px; display: flex; flex-direction: column; gap: 3px; min-height: 0; animation: bvUp .5s cubic-bezier(.2, .7, .3, 1) both; animation-delay: calc(.55s + var(--d) * 60ms); }
.bvm-foto { flex: 1; border-radius: 3px; display: grid; place-items: center; min-height: 0; overflow: hidden; }
.bvm-foto svg { width: 70%; height: 70%; }
.bvm-prod i { height: 3px; width: 75%; border-radius: 2px; background: #D6D3D0; } .bvm-prod b { height: 4px; width: 40%; border-radius: 2px; background: var(--marca); opacity: .85; }
@media (max-width: 700px) {
  #bienvenida { padding: 28px 16px; }
  .bv-t { font-size: 26px; } .bv-frase { font-size: 15px; } .bv-marca img { width: 186px; }
  .bv-prev { padding: 12px; border-radius: 11px; }
  .bvm { height: 190px; grid-template-columns: minmax(0, 1fr); } .bvm-lat { display: none; }
  .bvm-grilla { grid-template-columns: repeat(4, 1fr); }
}
/* Entrada: cada bloque aparece de abajo hacia arriba, uno atrás del otro */
@keyframes bvUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.bv-in > * { animation: bvUp .55s cubic-bezier(.2, .7, .3, 1) both; }
.bv-marca { animation-delay: .03s; } .bv-para { animation-delay: .10s; } .bv-t { animation-delay: .14s; }
.bv-s { animation-delay: .20s; } .bv-frase { animation-delay: .28s; } .bv-vista { animation-delay: .38s; }
.bv-btn { animation-delay: .50s; } .bv-pie { animation-delay: .60s; }

</style>

function rngSemilla(seed) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.int = (min, max) => Math.floor(r() * (max - min + 1)) + min;
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  r.weighted = (pairs) => { const tot = sum(pairs, p => p[1]); let x = r() * tot; for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; } return pairs[pairs.length - 1][0]; };
  return r;
}

function colorVariante(txt) {
  const partes = norm(txt).split(/[\/\-]| y /).map(s => s.trim()).filter(Boolean);
  const cols = [];
  for (const p of partes) { for (const [re, c] of COLORES_VARIANTE) { if (re.test(p)) { cols.push(c); break; } } if (cols.length === 2) break; }
  return cols.length ? cols : ['#D6D0C8'];
}
const swatch = (txt, size = 14) => { const c = colorVariante(txt); const bg = c.length > 1 ? `linear-gradient(135deg, ${c[0]} 50%, ${c[1]} 50%)` : c[0]; return `<span class="swatch" style="width:${size}px;height:${size}px;background:${bg}" aria-hidden="true"></span>`; };

/* ── Fotos desde Google Drive ─────────────────────────────────────
   Acepta: https://drive.google.com/file/d/ID/view · open?id=ID · uc?id=ID
   Se devuelve la miniatura pública (requiere "Cualquiera con el enlace"). */
function urlFoto(link, tam = 800) {
  if (!link) return '';
  if (link.startsWith('data:')) return link;
  const m = String(link).match(/(?:\/d\/|[?&]id=)([\w-]{20,})/);
  if (m && /drive\.google|docs\.google/.test(link)) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${tam}`;
  if (/images\.pexels\.com/.test(link)) return link.replace(/([?&]w=)\d+/, '$1' + tam);
  return link;
}

/* ── Reducir una foto (para no llenar el almacenamiento) ─────── */
function reducirFoto(file, max = 720, q = 0.72) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', q)); }; img.onerror = mal; img.src = fr.result; };
    fr.onerror = mal; fr.readAsDataURL(file);
  });
}

/* ── Contar números (indicadores del panel) ───────────────────── */
function contar(el, hasta, formato = fmtN, ms = 900) {
  if (reduceMotion()) { el.textContent = formato(hasta); return; }
  const t0 = performance.now();
  const paso = (t) => { const k = clamp((t - t0) / ms, 0, 1); const e = 1 - Math.pow(1 - k, 3); el.textContent = formato(hasta * e); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}

/* ── Descargar archivo ────────────────────────────────────────── */
function descargar(nombre, contenido, tipo = 'application/json') {
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ── Distancia entre textos (para detectar nombres parecidos) ─── */
function distancia(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}

  }
  function sinLugar() {
    if (avisoLugar) return; avisoLugar = true;   // se avisa una sola vez
    UI?.toast?.('Este navegador no tiene más lugar para guardar. Podés seguir usando la página, pero los cambios se pierden al cerrarla. Exportá un respaldo desde Configuración.', 'alerta', { ms: 9000 });
  }
  function guardarLS(txt) { try { localStorage.setItem(CLAVE_GUARDADO, txt); } catch (e) { sinLugar(); } }
  function guardarYa() {
    clearTimeout(guardarPend); guardarPend = null;
    const txt = JSON.stringify(db);
    if (sinBD) { guardarLS(txt); return; }
    BD.escribir(CLAVE_GUARDADO, txt).then(() => canal?.postMessage(version)).catch(() => sinLugar());
  }
  function guardar() { clearTimeout(guardarPend); guardarPend = setTimeout(guardarYa, 250); }
  addEventListener('pagehide', () => { if (guardarPend) guardarYa(); });
  function cambio(persistir = true) { version++; memo.clear(); if (persistir) guardar(); oyentes.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }
  const alCambiar = (f) => (oyentes.add(f), () => oyentes.delete(f));

  /* Los datos de ejemplo se "corren" para que siempre estén armados alrededor de hoy */
  function correrFechas() {
    const delta = deIso(iso(Date.now())) - deIso(db.baseDia);
    if (!delta) return;
    const reIso = /^\d{4}-\d{2}-\d{2}$/;
    const camina = (o) => {
      if (Array.isArray(o)) { o.forEach(camina); return; }
      if (!o || typeof o !== 'object') return;
      for (const k in o) {
        const v = o[k];
        if (typeof v === 'number' && (k === 'ts' || k.startsWith('ts') || k === 'creado' || k === 'ult')) o[k] = v + delta;
        else if (typeof v === 'string' && reIso.test(v) && k !== 'baseDia') o[k] = iso(deIso(v) + delta);
        else if (k === 'ultConteo' && v) { for (const l in v) v[l] += delta; }
        else if (v && typeof v === 'object' && k !== 'saldos') camina(v);
      }
    };
    camina(db);
    db.baseDia = iso(Date.now());
  }

  /* Sincroniza entre pestañas (simula dos tiendas operando a la vez) */
  canal?.addEventListener('message', async () => {
    try { const raw = await BD.leer(CLAVE_GUARDADO); if (!raw) return; db = JSON.parse(raw); idxMovsProd = null; idxProd = null; cambio(false); UI?.toast?.('Se actualizaron los datos desde otra pestaña abierta', 'info'); } catch (er) {}
  });

  /* ── Configuración (base + lo editado) ────────────────────── */
  function cfg() {
    return memoizar('cfg', () => {
      const c = JSON.parse(JSON.stringify(CONFIG_BASE));
      const o = db?.config || {};
      for (const k in o) { if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) c[k] = { ...c[k], ...o[k] }; else c[k] = o[k]; }
      return c;
    });
  }
  function setConfig(k, val) { db.config[k] = val; registrar('Configuración', 'Cambió ' + k); cambio(); }
  const locales = (incluirInactivos = false) => cfg().locales.filter(l => incluirInactivos || l.activo);
  const local = (id) => cfg().locales.find(l => l.id === id) || { id, nombre: id, corto: id, color: '#999' };
  const tiendas = () => locales().filter(l => l.tipo === 'tienda');
  const usuarios = () => cfg().usuarios.filter(u => u.localId !== 'dep' || locales().some(l => l.id === 'dep'));
  const usuario = (id) => cfg().usuarios.find(u => u.id === id) || { id, nombre: id };

  function memoizar(clave, f) { if (!memo.has(clave)) memo.set(clave, f()); return memo.get(clave); }

  /* ── Sesión y permisos (ÚNICA fuente de verdad) ───────────── */
  const SOLO_ADMIN = new Set(['verCostos', 'verResultado', 'editarProductos', 'precios', 'proveedoresEditar', 'usuarios', 'config',
    'aprobarConteo', 'aprobarAjuste', 'revertirAjuste', 'revisarAjuste', 'pedidosProveedor', 'gastosTodos', 'importar', 'verTodosLocales', 'pagarProveedor']);
  const PERMISOS = {
    tienda:   new Set(['vender', 'cobrar', 'devolver', 'entregas', 'pedirTransf', 'enviarTransf', 'recibirTransf', 'recibirCompra', 'contar', 'ajustar', 'cambiarEstado', 'gastos', 'pedirRepo', 'clientes', 'anularHoy']),
    deposito: new Set(['pedirTransf', 'enviarTransf', 'recibirTransf', 'recibirCompra', 'contar', 'ajustar', 'cambiarEstado', 'pedirRepo']),
  };
  function iniciarSesion(id, pass) {
    // ▶ FIREBASE AUTH: signInWithEmailAndPassword(auth, email, pass) y leer /usuarios/{uid}
    const u = cfg().usuarios.find(x => x.id === id);
    if (!u || String(u.pass) !== String(pass)) return null;
    sesion = { ...u };
    try { sessionStorage.setItem(CLAVE_GUARDADO + '_ses', u.id); } catch (e) {}
    registrar('Ingreso', 'Ingresó al sistema');
    return sesion;
  }
  function restaurarSesion() { try { const id = sessionStorage.getItem(CLAVE_GUARDADO + '_ses'); const u = id && cfg().usuarios.find(x => x.id === id); if (u) sesion = { ...u }; } catch (e) {} return sesion; }
  function cerrarSesion() { try { sessionStorage.removeItem(CLAVE_GUARDADO + '_ses'); } catch (e) {} sesion = null; }
  const yo = () => sesion;
  const esAdmin = () => sesion?.rol === 'admin';
  function puede(accion, localId) {
    if (!sesion) return false;
    if (sesion.rol === 'admin') return true;
    if (SOLO_ADMIN.has(accion)) return false;
    if (!PERMISOS[sesion.rol]?.has(accion)) return false;
    if (localId && !localesEditables().includes(localId)) return false;
    return true;
  }
  const localesVisibles = () => locales().map(l => l.id);                      // todos pueden CONSULTAR el stock
  const localesEditables = () => esAdmin() ? locales().map(l => l.id) : (sesion?.localId ? [sesion.localId] : []);
  const localesFinancieros = () => esAdmin() ? locales().map(l => l.id) : (sesion?.localId ? [sesion.localId] : []); // ventas/gastos visibles
  function exigir(accion, localId) {
    if (!puede(accion, localId)) throw new ErrorPermiso(localId && sesion?.localId && localId !== sesion.localId
      ? 'Solo podés hacer esto en tu local (' + local(sesion.localId).nombre + ').'
      : 'Tu usuario no tiene permiso para esta acción.');
  }

  /* ── Registro de actividad (solo agregar) ─────────────────── */
  function registrar(accion, detalle, ref = null, ctx = {}) {
    // ▶ FIRESTORE: addDoc(collection(db,'actividad'), {...})
    db.actividad.push({ id: uid('act'), ts: ctx.ts || Date.now(), user: ctx.user || sesion?.id || 'sistema', loc: ctx.loc ?? sesion?.localId ?? null, accion, detalle, ref });
    if (db.actividad.length > 6000) db.actividad.splice(0, db.actividad.length - 6000);
  }

  /* ── Numeración ───────────────────────────────────────────── */
  const sig = (k) => (db.cont[k] = (db.cont[k] || 0) + 1);
  const pad = (n, l = 5) => String(n).padStart(l, '0');

  /* ── Productos ────────────────────────────────────────────── */
  function prod(id) { if (!idxProd) { idxProd = new Map(db.productos.map(p => [p.id, p])); } return idxProd.get(id); }
  const productos = () => db.productos;
  const textoBusqueda = (p) => p._q || (p._q = norm([p.codigo, p.codProv, p.barras, p.nombre, p.variante, proveedor(p.prov)?.nombre, p.sub].join(' ')));
  function nuevoProducto(d, ctx = {}) {
    if (!ctx.seed) exigir('editarProductos');
    if (!d.nombre?.trim()) throw new ErrorDato('Falta el nombre del producto.');
    const n = sig('prod');
    const p = { id: 'p' + n, codigo: 'DL-' + pad(n), codProv: d.codProv || '', barras: d.barras || '', nombre: d.nombre.trim(), modelo: d.modelo || d.nombre.trim(),
      variante: d.variante || '', cat: d.cat || 'mue', sub: d.sub || '', prov: d.prov || null, costo: +d.costo || 0, precio: +d.precio || 0,
      min: d.min || {}, foto: d.foto || '', notas: d.notas || '', notaHist: d.notaHist || '', activo: d.activo !== false, creado: ctx.ts || Date.now(), ultConteo: {}, precioExh: d.precioExh || null };
    db.productos.push(p); idxProd = null;
    if (!ctx.seed) { registrar('Producto creado', p.codigo + ' · ' + nombreProd(p), { tipo: 'prod', id: p.id }); cambio(); }
    return p;
  }
  function editarProducto(id, cambios) {
    exigir('editarProductos');
    const p = prod(id); if (!p) return;
    const antes = { precio: p.precio, costo: p.costo };
    Object.assign(p, cambios); delete p._q;
    const det = [];
    if (cambios.precio != null && cambios.precio !== antes.precio) det.push('precio ' + fmt$(antes.precio) + ' → ' + fmt$(cambios.precio));
    if (cambios.costo != null && cambios.costo !== antes.costo) det.push('costo ' + fmt$(antes.costo) + ' → ' + fmt$(cambios.costo));
    registrar('Producto editado', p.codigo + ' · ' + nombreProd(p) + (det.length ? ' (' + det.join(', ') + ')' : ''), { tipo: 'prod', id });
    cambio();
  }
  function actualizarPrecios(ids, pct, redondeo) {
    exigir('precios');
    const r = redondeo || 10;
    ids.forEach(id => { const p = prod(id); p.precio = Math.round(p.precio * (1 + pct / 100) / r) * r; });
    registrar('Precios actualizados', ids.length + ' productos · ' + fmtPct(pct) + ' · redondeo $ ' + r);
    cambio();
  }
  const nombreProd = (p) => p ? p.nombre + (p.variante ? ' – ' + p.variante : '') : '—';
  const margen = (p) => p.precio ? ((p.precio / (1 + cfg().reglas.iva / 100)) - p.costo) / (p.precio / (1 + cfg().reglas.iva / 100)) * 100 : 0;
  const categoria = (id) => cfg().categorias.find(c => c.id === id) || { id, nombre: id, subs: [] };

  /* ── Proveedores y clientes ───────────────────────────────── */
  const proveedor = (id) => db.proveedores.find(p => p.id === id);
  function guardarProveedor(d) {
    exigir('proveedoresEditar');
    if (!d.nombre?.trim()) throw new ErrorDato('Escribí el nombre del proveedor.');
    if (d.id) { Object.assign(proveedor(d.id), d); registrar('Proveedor editado', d.nombre); }
    else { d.id = 'pv' + sig('prov'); d.creado = Date.now(); db.proveedores.push(d); registrar('Proveedor creado', d.nombre); }
    cambio(); return d;
  }
  function fusionarProveedores(quedaId, salenIds) {
    exigir('proveedoresEditar');
    const queda = proveedor(quedaId); let n = 0;
    salenIds.forEach(sid => {
      db.productos.forEach(p => { if (p.prov === sid) { p.prov = quedaId; delete p._q; n++; } });
      db.pedidos.forEach(p => { if (p.prov === sid) p.prov = quedaId; });
      db.facturas.forEach(f => { if (f.prov === sid) f.prov = quedaId; });
      db.compras.forEach(c => { if (c.prov === sid) c.prov = quedaId; });
      db.pagosProv.forEach(c => { if (c.prov === sid) c.prov = quedaId; });
      const s = proveedor(sid); registrar('Proveedores fusionados', s.nombre + ' → ' + queda.nombre);
      db.proveedores = db.proveedores.filter(p => p.id !== sid);
    });
    cambio(); return n;
  }
  const cliente = (id) => db.clientes.find(c => c.id === id);
  function guardarCliente(d) {
    if (!d.nombre?.trim()) throw new ErrorDato('Escribí el nombre del cliente.');
    if (d.id) { Object.assign(cliente(d.id), d); registrar('Cliente editado', d.nombre); }
    else { d.id = 'c' + sig('cli'); d.creado = Date.now(); db.clientes.push(d); registrar('Cliente creado', d.nombre, { tipo: 'cli', id: d.id }); }
    cambio(); return d;
  }

  /* ════════════════════════════════════════════════════════════
     STOCK — saldos, movimientos y transacción
     ════════════════════════════════════════════════════════════ */
  const SALDO0 = () => ({ disp: 0, exh: 0, res: 0, dan: 0, tra: 0 });
  function saldo(prodId, loc) { return db.saldos[prodId]?.[loc] || SALDO0(); }
  function saldoEst(prodId, loc, est) { return db.saldos[prodId]?.[loc]?.[est] || 0; }
  const vendible = (s) => s.disp + s.exh;
  const fisico = (s) => s.disp + s.exh + s.res + s.dan;
  function stockTotal(prodId, locs = localesVisibles()) {
    const t = SALDO0(); locs.forEach(l => { const s = saldo(prodId, l); for (const k in t) t[k] += s[k]; }); return t;
  }

  /* Aplica un lote de movimientos de forma atómica.
     ▶ FIRESTORE: runTransaction(firestore, async (tx) => {
         1) tx.get() de cada /saldos/{prod_loc} involucrado
         2) validar que ningún saldo quede negativo (si otra tienda vendió
            primero, acá falla y se avisa "ya no hay stock")
         3) tx.set() de cada movimiento nuevo en /movimientos
         4) tx.update() de los saldos
       }) */
  function aplicar(lista, ctx = {}) {
    const deltas = new Map();
    for (const m of lista) {
      if (!m.cant) continue;
      const k = m.prod + '|' + m.loc + '|' + m.est;
      deltas.set(k, (deltas.get(k) || 0) + m.cant);
    }
    const faltan = [];
    for (const [k, d] of deltas) {
      const [p, l, e] = k.split('|');
      const actual = saldoEst(p, l, e);
      if (actual + d < 0) faltan.push({ prod: p, loc: l, est: e, actual, pide: -d });
    }
    if (faltan.length) {
      const f = faltan[0]; const pr = prod(f.prod);
      throw new ErrorStock(`No alcanza el stock de “${nombreProd(pr)}” en ${local(f.loc).nombre} (${ESTADOS[f.est].nombre.toLowerCase()}: hay ${f.actual}, se necesitan ${f.pide}). Puede que otra tienda lo haya vendido recién.`, faltan);
    }
    const ts = ctx.ts || Date.now(); const user = ctx.user || sesion?.id || 'sistema'; const grupo = lista.length > 1 ? uid('g') : null;
    const nuevos = [];
    for (const m of lista) {
      if (!m.cant) continue;
      const mov = { id: 'm' + sig('mov'), ts, tipo: m.tipo, prod: m.prod, loc: m.loc, est: m.est, cant: m.cant, user };
      if (m.ref) mov.ref = m.ref; if (m.motivo) mov.motivo = m.motivo; if (m.nota) mov.nota = m.nota; if (grupo) mov.grupo = grupo;
      db.movs.push(mov); nuevos.push(mov);
      const s = (db.saldos[m.prod] ||= {}); const sl = (s[m.loc] ||= SALDO0()); sl[m.est] += m.cant;
      if (idxMovsProd) (idxMovsProd.get(m.prod) || idxMovsProd.set(m.prod, []).get(m.prod)).push(mov);
    }
    return nuevos;
  }

  function movsDe(prodId) {
    if (!idxMovsProd) { idxMovsProd = new Map(); for (const m of db.movs) { let a = idxMovsProd.get(m.prod); if (!a) idxMovsProd.set(m.prod, a = []); a.push(m); } }
    return idxMovsProd.get(prodId) || [];
  }

  /* Reconstruye todos los saldos desde los movimientos y compara con la caché */
  function recalcularStock(silencioso = false) {
    const nuevo = {};
    for (const m of db.movs) { const s = (nuevo[m.prod] ||= {}); const sl = (s[m.loc] ||= SALDO0()); sl[m.est] += m.cant; }
    const dif = [];
    const claves = new Set([...Object.keys(nuevo), ...Object.keys(db.saldos || {})]);
    for (const p of claves) {
      const locsAll = new Set([...Object.keys(nuevo[p] || {}), ...Object.keys(db.saldos?.[p] || {})]);
      for (const l of locsAll) for (const e of ESTADOS_ORDEN) {
        const a = db.saldos?.[p]?.[l]?.[e] || 0, b = nuevo[p]?.[l]?.[e] || 0;
        if (a !== b) dif.push({ prod: p, loc: l, est: e, cache: a, real: b });
      }
    }
    const negativos = [];
    for (const p in nuevo) for (const l in nuevo[p]) for (const e of ESTADOS_ORDEN) if (nuevo[p][l][e] < 0) negativos.push({ prod: p, loc: l, est: e, v: nuevo[p][l][e] });
    db.saldos = nuevo;
    if (!silencioso) { registrar('Recalcular stock', dif.length ? dif.length + ' diferencias corregidas' : 'Sin diferencias'); cambio(); }
    return { diferencias: dif, negativos, movimientos: db.movs.length };
  }

  /* ── Cambiar estado (disponible ↔ exhibición ↔ dañado) ────── */
  function cambiarEstado({ prod: p, loc, de, a, cant, nota }, ctx = {}) {
    if (!ctx.seed) exigir('cambiarEstado', loc);
    cant = +cant; if (!(cant > 0)) throw new ErrorDato('Indicá cuántas unidades.');
    if (de === a) throw new ErrorDato('Elegí un estado distinto.');
    const ref = { tipo: 'estado', num: ESTADOS[de].corto + ' → ' + ESTADOS[a].corto };
    aplicar([{ tipo: 'estado', prod: p, loc, est: de, cant: -cant, nota, ref }, { tipo: 'estado', prod: p, loc, est: a, cant, nota, ref }], ctx);
    if (!ctx.seed) { registrar('Cambio de estado', `${nombreProd(prod(p))} · ${local(loc).corto} · ${cant} u. ${ESTADOS[de].nombre} → ${ESTADOS[a].nombre}${nota ? ' · ' + nota : ''}`, { tipo: 'prod', id: p }); cambio(); }
  }
  function bajaPorDanio({ prod: p, loc, cant, nota }, ctx = {}) {
    if (!ctx.seed) exigir('cambiarEstado', loc);
    aplicar([{ tipo: 'danio', prod: p, loc, est: 'dan', cant: -cant, nota, ref: { tipo: 'baja' } }], ctx);
    if (!ctx.seed) { registrar('Baja por daño', `${nombreProd(prod(p))} · ${local(loc).corto} · ${cant} u.`, { tipo: 'prod', id: p }); cambio(); }
  }
  function stockInicial(p, loc, est, cant, ctx = {}) { aplicar([{ tipo: 'inicial', prod: p, loc, est, cant, ref: { tipo: 'inicial' }, nota: ctx.nota }], ctx); }

  /* ════════════════════════════════════════════════════════════
     AJUSTES MANUALES (registro inmutable)
     ════════════════════════════════════════════════════════════ */
  function previaAjuste({ prod: p, loc, est, modo, valor }) {
    const antes = saldoEst(p, loc, est);
    const v = Math.trunc(+valor || 0);
    const despues = modo === 'fijar' ? v : antes + v;
    const pr = prod(p);
    return { antes, despues, dif: despues - antes, costoU: pr?.costo || 0, valor: (despues - antes) * (pr?.costo || 0) };
  }
  const esGrande = (dif, valor) => Math.abs(dif) >= cfg().reglas.ajusteGrandeUnidades || Math.abs(valor) >= cfg().reglas.ajusteGrandeValor;

  function ajustar(d, ctx = {}) {
    const user = ctx.user ? usuario(ctx.user) : sesion;
    if (!ctx.seed) exigir('ajustar', d.loc);
    if (!d.motivo) throw new ErrorDato('Elegí un motivo para el ajuste.');
    if (d.motivo === 'Otro' && !d.coment?.trim()) throw new ErrorDato('Contá brevemente el motivo en el comentario.');
    if (!['disp', 'exh', 'dan'].includes(d.est)) throw new ErrorDato('Ese estado no se ajusta a mano.');
    const pv = previaAjuste(d);
    if (pv.dif === 0) throw new ErrorDato('La cantidad nueva es igual a la actual: no hay nada que ajustar.');
    if (pv.despues < 0) throw new ErrorDato('El stock no puede quedar negativo.');
    const n = sig('ajuste');
    const pendiente = cfg().reglas.ajustesRequierenAprobacion && user.rol !== 'admin' && !ctx.seed;
    const aj = { id: 'aj' + n, n, num: 'AJ-' + pad(n, 4), ts: ctx.ts || Date.now(), user: user.id, loc: d.loc, prod: d.prod, est: d.est, modo: d.modo,
      antes: pv.antes, despues: pv.despues, dif: pv.dif, costoU: pv.costoU, valor: pv.valor, motivo: d.motivo, coment: d.coment || '', foto: d.foto || '',
      grande: esGrande(pv.dif, pv.valor), requiereAprob: pendiente, tipo: 'ajuste' };
    if (!pendiente) aplicar([{ tipo: 'ajuste', prod: d.prod, loc: d.loc, est: d.est, cant: pv.dif, motivo: d.motivo, nota: d.coment, ref: { tipo: 'ajuste', id: aj.id, num: aj.num } }], { ts: aj.ts, user: user.id });
    // ▶ FIRESTORE: addDoc('ajustes', aj) dentro de la misma transacción que los movimientos
    db.ajustes.push(aj);
    if (!ctx.seed) { registrar(pendiente ? 'Ajuste pendiente de aprobación' : 'Ajuste manual', `${aj.num} · ${nombreProd(prod(d.prod))} · ${local(d.loc).corto} · ${ESTADOS[d.est].corto} ${pv.antes} → ${pv.despues} (${signo(pv.dif)}) · ${d.motivo}`, { tipo: 'ajuste', id: aj.id }); cambio(); }
    return aj;
  }
  /* Estado derivado del ajuste (el registro original nunca se modifica) */
  function estadoAjuste(a) {
    const decs = decisionesDe(a.id);
    if (a.tipo === 'reversion') return { estado: 'reversion', revisado: true };
    const rev = db.ajustes.find(x => x.revierte === a.id);
    const aprob = decs.find(x => x.accion === 'aprobado'), rech = decs.find(x => x.accion === 'rechazado'), revi = decs.find(x => x.accion === 'revisado');
    let estado = 'aplicado';
    if (a.requiereAprob && !aprob) estado = rech ? 'rechazado' : 'pendiente';
    if (rev) estado = 'revertido';
    return { estado, reversion: rev, aprobado: aprob, rechazado: rech, revisado: revi || (!a.grande) || null };
  }
  function decisionesDe(ajId) { return memoizar('decs', () => groupBy(db.decisiones, d => d.ajuste))[ajId] || []; }
  function decidirAjuste(id, accion, motivo = '', ctx = {}) {
    if (!ctx.seed) exigir(accion === 'revisado' ? 'revisarAjuste' : 'aprobarAjuste');
    const a = db.ajustes.find(x => x.id === id); if (!a) return;
    const st = estadoAjuste(a);
    if (accion === 'aprobado') {
      if (st.estado !== 'pendiente') throw new ErrorDato('Este ajuste ya fue resuelto.');
      // Se recalcula con el stock de HOY: si es "fijar", se respeta la cantidad indicada por la tienda.
      aplicar([{ tipo: 'ajuste', prod: a.prod, loc: a.loc, est: a.est, cant: a.dif, motivo: a.motivo, nota: 'Aprobado · ' + (a.coment || ''), ref: { tipo: 'ajuste', id: a.id, num: a.num } }], ctx);
    }

    if (!ctx.seed) { registrar('Ajuste ' + accion, a.num + (motivo ? ' · ' + motivo : ''), { tipo: 'ajuste', id }); cambio(); }
  }
  function revertirAjuste(id, motivo = '', ctx = {}) {
    if (!ctx.seed) exigir('revertirAjuste');

    const st = estadoAjuste(a);
    if (st.estado !== 'aplicado') throw new ErrorDato('Solo se pueden revertir ajustes aplicados que no fueron revertidos.');
    const n = sig('ajuste');
    const ant = saldoEst(a.prod, a.loc, a.est);
    const r = { id: 'aj' + n, n, num: 'AJ-' + pad(n, 4), ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, loc: a.loc, prod: a.prod, est: a.est, modo: 'sumar',
      antes: ant, despues: ant - a.dif, dif: -a.dif, costoU: a.costoU, valor: -a.valor, motivo: 'Reversión de ' + a.num, coment: motivo, foto: '', grande: false, tipo: 'reversion', revierte: a.id };
    aplicar([{ tipo: 'reversion', prod: a.prod, loc: a.loc, est: a.est, cant: -a.dif, motivo: r.motivo, nota: motivo, ref: { tipo: 'ajuste', id: r.id, num: r.num } }], ctx);
    db.ajustes.push(r);
    if (!ctx.seed) { registrar('Ajuste revertido', `${a.num} revertido con ${r.num}${motivo ? ' · ' + motivo : ''}`, { tipo: 'ajuste', id: r.id }); cambio(); }
    return r;
  }

  /* ════════════════════════════════════════════════════════════
     VENTAS
     ════════════════════════════════════════════════════════════ */
  const venta = (id) => db.ventas.find(v => v.id === id);
  function totalLinea(l) { return Math.round(l.cant * l.precio * (1 - (l.desc || 0) / 100)); }
  function totalesVenta(v) {
    const sub = sum(v.lineas, totalLinea);
    const total = Math.max(0, sub - (v.descTotal || 0) + (v.entrega?.flete || 0));
    const devuelto = sum(v.devoluciones || [], d => d.importe);
    const pagado = sum(v.pagos || [], p => p.monto) - sum(v.reintegros || [], r => r.monto);
    const neto = total - devuelto;
    return { sub, total, devuelto, pagado, saldo: Math.max(0, neto - pagado), neto };
  }
  function estadoVenta(v) {
    if (v.anulada) return 'anulada';
    const uds = sum(v.lineas, l => l.cant), dev = sum(v.lineas, l => l.devuelto || 0);
    if (uds > 0 && dev >= uds) return 'devuelta';
    const t = totalesVenta(v);
    const pendEntrega = v.lineas.some(l => (l.entregado || 0) + (l.devuelto || 0) < l.cant);
    if (t.saldo > 0) return 'reservada';
    if (pendEntrega) return 'pendiente';
    return 'completada';
  }
  /* d = {loc, cli, lineas:[{prod, cant, precio, desc, est, transferirDe}], descTotal, pagos, entrega, cfe, nota} */
  function crearVenta(d, ctx = {}) {
    if (!ctx.seed) exigir('vender', d.loc);
    if (!d.lineas?.length) throw new ErrorDato('El carrito está vacío.');
    const user = ctx.user ? usuario(ctx.user) : sesion;
    const tope = cfg().reglas.topeDescuentoTienda;
    if (user.rol !== 'admin') {
      d.lineas.forEach(l => { if ((l.desc || 0) > tope) throw new ErrorDato(`El descuento máximo para las tiendas es ${tope} %.`); });
      const sub = sum(d.lineas, totalLinea);
      if ((d.descTotal || 0) > sub * tope / 100 + 1) throw new ErrorDato(`El descuento total supera el ${tope} % permitido.`);
    }
    const n = sig('venta');
    const v = { id: 'v' + n, n, num: 'V-' + pad(n, 5), ts: ctx.ts || Date.now(), loc: d.loc, user: user.id, cli: d.cli || null,
      lineas: d.lineas.map(l => ({ prod: l.prod, cant: +l.cant, precio: +l.precio, desc: +l.desc || 0, est: l.est || 'disp', entregado: 0, res: 0, devuelto: 0, transferirDe: l.transferirDe || null, costo: prod(l.prod)?.costo || 0 })),
      descTotal: +d.descTotal || 0, pagos: (d.pagos || []).filter(p => p.monto > 0).map(p => ({ ...p, ts: ctx.ts || Date.now(), user: user.id })),
      entrega: d.entrega || { tipo: 'ahora' }, cfe: d.cfe || '', nota: d.nota || '', devoluciones: [], timeline: [] };
    const t = totalesVenta(v);
    if (t.pagado > t.total + 1) throw new ErrorDato('Lo cobrado supera el total de la venta.');
    const seLleva = v.entrega.tipo === 'ahora' && t.saldo <= 0;
    const movs = [];
    v.lineas.forEach(l => {
      if (l.transferirDe) return; // llega por transferencia
      const ref = { tipo: 'venta', id: v.id, num: v.num };
      if (seLleva) { movs.push({ tipo: 'venta', prod: l.prod, loc: v.loc, est: l.est, cant: -l.cant, ref }); l.entregado = l.cant; }
      else { movs.push({ tipo: 'reserva', prod: l.prod, loc: v.loc, est: l.est, cant: -l.cant, ref }, { tipo: 'reserva', prod: l.prod, loc: v.loc, est: 'res', cant: l.cant, ref }); l.res = l.cant; }
    });
    aplicar(movs, { ts: v.ts, user: user.id });
    v.timeline.push({ ts: v.ts, user: user.id, txt: seLleva ? 'Venta confirmada · se lo llevó' : (t.saldo > 0 ? 'Venta con seña de ' + fmt$(t.pagado) : 'Venta confirmada · entrega pendiente') });
    if (v.entrega.tipo === 'envio') { v.entrega.estado = v.entrega.estado || 'programada'; v.timeline.push({ ts: v.ts, user: user.id, txt: 'Envío programado para el ' + fmtF(v.entrega.fecha) + ' · ' + (v.entrega.franja || '') }); }
    db.ventas.push(v);
    // Líneas sin stock en el local → solicitud de transferencia ligada a la venta
    const porOrigen = groupBy(v.lineas.filter(l => l.transferirDe), l => l.transferirDe);
    for (const o in porOrigen) {
      const tr = solicitarTransferencia({ origen: o, destino: v.loc, lineas: porOrigen[o].map(l => ({ prod: l.prod, cant: l.cant })), nota: 'Para la venta ' + v.num, venta: v.id }, { ...ctx, sinPermiso: true, sinCambio: true });
      v.timeline.push({ ts: v.ts, user: user.id, txt: 'Se pidió transferencia ' + tr.num + ' desde ' + local(o).nombre });
    }
    if (!ctx.seed) { registrar('Venta', `${v.num} · ${local(v.loc).corto} · ${fmt$(t.total)}${cliente(v.cli) ? ' · ' + cliente(v.cli).nombre : ''}`, { tipo: 'venta', id: v.id }); cambio(); }
    return v;
  }
  function cobrarSaldo(id, pagos, ctx = {}) {
    const v = venta(id); if (!ctx.seed) exigir('cobrar', v.loc);
    const t = totalesVenta(v); const monto = sum(pagos, p => p.monto);
    if (monto <= 0) throw new ErrorDato('Indicá el importe a cobrar.');
    if (monto > t.saldo + 1) throw new ErrorDato('El importe supera el saldo pendiente (' + fmt$(t.saldo) + ').');
    pagos.forEach(p => v.pagos.push({ ...p, ts: ctx.ts || Date.now(), user: ctx.user || sesion.id }));
    v.timeline.push({ ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, txt: 'Cobró ' + fmt$(monto) + ' (' + pagos.map(p => p.forma).join(' + ') + ')' });
    if (!ctx.seed) { registrar('Cobro de saldo', v.num + ' · ' + fmt$(monto), { tipo: 'venta', id }); cambio(); }
  }
  function entregarVenta(id, ctx = {}) {
    const v = venta(id); if (!ctx.seed) exigir('entregas', v.loc);
    const t = totalesVenta(v);
    if (t.saldo > 0) throw new ErrorDato('Antes de entregar, cobrá el saldo pendiente (' + fmt$(t.saldo) + ').');
    const movs = []; const ref = { tipo: 'venta', id: v.id, num: v.num };
    v.lineas.forEach(l => { if (l.res > 0) { movs.push({ tipo: 'entrega', prod: l.prod, loc: v.loc, est: 'res', cant: -l.res, ref }); } });
    if (!movs.length) throw new ErrorDato('Todavía no hay mercadería reservada para entregar (¿falta recibir la transferencia?).');
    aplicar(movs, ctx);
    v.lineas.forEach(l => { if (l.res > 0) { l.entregado += l.res; l.res = 0; } });
    if (v.entrega.tipo === 'envio') { v.entrega.estado = 'entregada'; v.entrega.tsEntregada = ctx.ts || Date.now(); }
    v.timeline.push({ ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, txt: v.entrega.tipo === 'envio' ? 'Entregada en domicilio · recibió conforme' : 'Retirada por el cliente' });
    if (!ctx.seed) { registrar('Entrega', v.num + ' entregada', { tipo: 'venta', id }); cambio(); }
  }
  function estadoEnvio(id, estado, ctx = {}) {
    const v = venta(id); if (!ctx.seed) exigir('entregas', v.loc);
    v.entrega.estado = estado;
    v.timeline.push({ ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, txt: estado === 'encamino' ? 'Salió el camión · en camino' : 'Entrega reprogramada' });
    if (!ctx.seed) { registrar('Entrega', v.num + ' · ' + estado, { tipo: 'venta', id }); cambio(); }
  }
  /* devol: [{idx, cant, destino:'disp'|'dan'}] */
  function devolver(id, items, motivo, reintegro, ctx = {}) {
    const v = venta(id); if (!ctx.seed) exigir('devolver', v.loc);
    if (!motivo?.trim()) throw new ErrorDato('Indicá el motivo de la devolución.');
    const movs = []; let importe = 0; const ref = { tipo: 'venta', id: v.id, num: v.num }; const det = [];
    items.forEach(it => {
      const l = v.lineas[it.idx]; const c = +it.cant; if (!c) return;
      const max = l.entregado + l.res;
      if (c > max) throw new ErrorDato('No se pueden devolver más unidades que las vendidas.');
      const deRes = Math.min(c, l.res), deEnt = c - deRes;
      if (deRes) { movs.push({ tipo: 'devol', prod: l.prod, loc: v.loc, est: 'res', cant: -deRes, ref, nota: motivo }); l.res -= deRes; }
      movs.push({ tipo: 'devol', prod: l.prod, loc: v.loc, est: it.destino || 'disp', cant: c, ref, nota: motivo });
      l.entregado -= deEnt; l.devuelto = (l.devuelto || 0) + c;
      importe += Math.round(totalLinea(l) / l.cant * c);
      det.push(c + '× ' + nombreProd(prod(l.prod)) + ' → ' + ESTADOS[it.destino || 'disp'].nombre.toLowerCase());
    });
    if (!movs.length) throw new ErrorDato('Elegí qué unidades se devuelven.');
    aplicar(movs, ctx);
    v.devoluciones.push({ ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, importe, motivo, det });
    if (reintegro) { v.reintegros = v.reintegros || []; v.reintegros.push({ monto: Math.min(reintegro, importe), ts: ctx.ts || Date.now(), forma: 'Efectivo' }); }
    v.timeline.push({ ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, txt: 'Devolución: ' + det.join(', ') + ' · ' + motivo });
    if (!ctx.seed) { registrar('Devolución', v.num + ' · ' + fmt$(importe) + ' · ' + motivo, { tipo: 'venta', id }); cambio(); }
  }
  function anularVenta(id, motivo, ctx = {}) {
    const v = venta(id);
    if (!ctx.seed) {
      const mismoDia = iso(v.ts) === iso(Date.now());
      if (!esAdmin() && !(mismoDia && puede('anularHoy', v.loc))) throw new ErrorPermiso('Solo Administración puede anular ventas de días anteriores.');
    }
    if (!motivo?.trim()) throw new ErrorDato('Indicá el motivo de la anulación.');
    if (v.anulada) throw new ErrorDato('La venta ya está anulada.');
    const movs = []; const ref = { tipo: 'venta', id: v.id, num: v.num };
    v.lineas.forEach(l => {
      if (l.res) movs.push({ tipo: 'anulacion', prod: l.prod, loc: v.loc, est: 'res', cant: -l.res, ref, nota: motivo });
      const vuelve = l.res + l.entregado;
      if (vuelve) movs.push({ tipo: 'anulacion', prod: l.prod, loc: v.loc, est: l.est === 'exh' ? 'exh' : 'disp', cant: vuelve, ref, nota: motivo });
      l.res = 0; l.entregado = 0;
    });
    aplicar(movs, ctx);
    db.transferencias.filter(t => t.venta === v.id && t.estado === 'solicitada').forEach(t => { t.estado = 'cancelada'; t.timeline.push({ ts: Date.now(), user: ctx.user || sesion.id, txt: 'Cancelada por anulación de ' + v.num }); });
    v.anulada = { ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, motivo };
    v.timeline.push({ ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, txt: 'Venta anulada · ' + motivo });
    if (!ctx.seed) { registrar('Anulación', v.num + ' · ' + motivo, { tipo: 'venta', id }); cambio(); }
  }
  function facturar(id, cfe) { const v = venta(id); v.cfe = cfe; v.timeline.push({ ts: Date.now(), user: sesion.id, txt: 'Facturada · CFE ' + cfe }); registrar('Facturación', v.num + ' · CFE ' + cfe, { tipo: 'venta', id }); cambio(); }

  /* ════════════════════════════════════════════════════════════
     TRANSFERENCIAS  solicitada → enviada (en tránsito) → recibida
     ════════════════════════════════════════════════════════════ */
  const transferencia = (id) => db.transferencias.find(t => t.id === id);
  function solicitarTransferencia(d, ctx = {}) {
    if (!ctx.seed && !ctx.sinPermiso && !esAdmin() && !puede('pedirTransf', d.destino) && !puede('enviarTransf', d.origen)) throw new ErrorPermiso('Solo podés pedir mercadería para tu local o enviar desde tu local.');
    if (d.origen === d.destino) throw new ErrorDato('El origen y el destino tienen que ser distintos.');
    if (!d.lineas?.length) throw new ErrorDato('Agregá al menos un producto.');
    const n = sig('transf');
    const t = { id: 'tr' + n, n, num: 'TR-' + pad(n, 4), ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, origen: d.origen, destino: d.destino,
      lineas: d.lineas.map(l => ({ prod: l.prod, cant: +l.cant, recibido: null, danado: 0 })), estado: 'solicitada', nota: d.nota || '', venta: d.venta || null,
      timeline: [{ ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, txt: 'Solicitada por ' + usuario(ctx.user || sesion.id).nombre }] };
    db.transferencias.push(t);
    if (!ctx.seed) { registrar('Transferencia solicitada', `${t.num} · ${local(t.origen).corto} → ${local(t.destino).corto}`, { tipo: 'transf', id: t.id }); if (!ctx.sinCambio) cambio(); }
    return t;
  }
  function enviarTransferencia(id, ctx = {}) {
    const t = transferencia(id); if (!ctx.seed) exigir('enviarTransf', t.origen);
    if (t.estado !== 'solicitada') throw new ErrorDato('Esta transferencia ya fue despachada.');
    const ref = { tipo: 'transf', id: t.id, num: t.num }; const movs = [];
    t.lineas.forEach(l => { movs.push({ tipo: 'tenv', prod: l.prod, loc: t.origen, est: 'disp', cant: -l.cant, ref }, { tipo: 'tenv', prod: l.prod, loc: t.destino, est: 'tra', cant: l.cant, ref }); });
    aplicar(movs, ctx);
    t.estado = 'enviada'; t.tsEnv = ctx.ts || Date.now(); t.userEnv = ctx.user || sesion.id;
    t.timeline.push({ ts: t.tsEnv, user: t.userEnv, txt: 'Despachada desde ' + local(t.origen).nombre + ' · en tránsito' });
    if (!ctx.seed) { registrar('Transferencia enviada', `${t.num} · ${local(t.origen).corto} → ${local(t.destino).corto}`, { tipo: 'transf', id }); cambio(); }
  }
  function crearYEnviar(d, ctx = {}) { const t = solicitarTransferencia(d, { ...ctx, sinCambio: true }); try { enviarTransferencia(t.id, ctx); } catch (e) { db.transferencias.pop(); db.cont.transf--; throw e; } return t; }
  /* rec: [{recibido, danado}] por línea */
  function recibirTransferencia(id, rec, nota = '', ctx = {}) {
    const t = transferencia(id); if (!ctx.seed) exigir('recibirTransf', t.destino);

    const v = t.venta ? venta(t.venta) : null;
    t.lineas.forEach((l, i) => {
      const r = rec[i] || { recibido: l.cant, danado: 0 };
      const ok = Math.max(0, +r.recibido || 0), dn = Math.max(0, +r.danado || 0);
      if (ok + dn > l.cant) throw new ErrorDato('Se recibió más de lo enviado en “' + nombreProd(prod(l.prod)) + '”. Revisá las cantidades.');
      movs.push({ tipo: 'trec', prod: l.prod, loc: t.destino, est: 'tra', cant: -l.cant, ref });
      const lv = v && !v.anulada ? v.lineas.find(x => x.prod === l.prod && x.transferirDe === t.origen) : null;
      if (ok) movs.push({ tipo: 'trec', prod: l.prod, loc: t.destino, est: lv ? 'res' : 'disp', cant: ok, ref, nota: lv ? 'Reservado para ' + v.num : '' });
      if (dn) movs.push({ tipo: 'trec', prod: l.prod, loc: t.destino, est: 'dan', cant: dn, ref, nota: 'Llegó dañado' });
      if (lv && ok) lv.res += ok;
      l.recibido = ok; l.danado = dn;
      if (ok + dn < l.cant || dn) difs.push(`${nombreProd(prod(l.prod))}: enviado ${l.cant}, llegó ${ok} bien${dn ? ' y ' + dn + ' dañado' : ''}${l.cant - ok - dn ? ', faltan ' + (l.cant - ok - dn) : ''}`);

    if (v) v.timeline.push({ ts: t.tsRec, user: t.userRec, txt: 'Llegó la transferencia ' + t.num + ' · listo para entregar' });
    if (!ctx.seed) { registrar('Transferencia recibida', `${t.num}${difs.length ? ' · CON DIFERENCIAS: ' + difs.join('; ') : ''}`, { tipo: 'transf', id }); cambio(); }
  }
  function cancelarTransferencia(id, motivo) {
    const t = transferencia(id); if (!esAdmin() && !puede('pedirTransf', t.destino) && !puede('enviarTransf', t.origen)) throw new ErrorPermiso('No podés cancelar esta transferencia.');
    if (t.estado !== 'solicitada') throw new ErrorDato('Solo se cancelan transferencias que todavía no salieron.');
    t.estado = 'cancelada'; t.timeline.push({ ts: Date.now(), user: sesion.id, txt: 'Cancelada' + (motivo ? ' · ' + motivo : '') });
    registrar('Transferencia cancelada', t.num, { tipo: 'transf', id }); cambio();
  }

  /* ════════════════════════════════════════════════════════════
     CONTEO FÍSICO  abierto → enviado → aprobado (genera ajuste)
     ════════════════════════════════════════════════════════════ */
  const conteo = (id) => db.conteos.find(c => c.id === id);
  function crearConteo({ loc, cat }, ctx = {}) {
    if (!ctx.seed) exigir('contar', loc);
    const lista = db.productos.filter(p => p.activo && (!cat || p.cat === cat) && (fisico(saldo(p.id, loc)) > 0 || (p.min?.[loc] ?? 0) > 0 || ctx.todos));
    const n = sig('conteo');
    const c = { id: 'co' + n, n, num: 'CO-' + pad(n, 4), ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, loc, cat: cat || null, estado: 'abierto',
      items: lista.map(p => ({ prod: p.id, sistema: saldoEst(p.id, loc, 'disp'), contado: null })) };
    db.conteos.push(c);
    if (!ctx.seed) { registrar('Conteo iniciado', `${c.num} · ${local(loc).nombre} · ${cat ? categoria(cat).nombre : 'Todo'}`, { tipo: 'conteo', id: c.id }); cambio(); }
    return c;
  }
  function anotarConteo(id, prodId, cant) { const c = conteo(id); const it = c.items.find(i => i.prod === prodId); if (it) it.contado = cant === '' || cant == null ? null : Math.max(0, +cant); guardar(); }

    const c = conteo(id); if (!ctx.seed) exigir('contar', c.loc);
    c.items.forEach(i => { if (i.contado == null) i.contado = i.sistema; });
    c.estado = 'enviado'; c.tsEnv = ctx.ts || Date.now(); c.userEnv = ctx.user || sesion.id;
    if (!ctx.seed) { registrar('Conteo enviado', c.num + ' · esperando aprobación', { tipo: 'conteo', id }); cambio(); }
  }
  function aprobarConteo(id, ctx = {}) {
    if (!ctx.seed) exigir('aprobarConteo');
    const c = conteo(id); if (c.estado !== 'enviado') throw new ErrorDato('El conteo todavía no fue enviado.');
    const ref = { tipo: 'conteo', id: c.id, num: c.num }; const movs = [];
    c.items.forEach(i => { const d = i.contado - i.sistema; if (d) movs.push({ tipo: 'conteo', prod: i.prod, loc: c.loc, est: 'disp', cant: d, ref, motivo: d > 0 ? 'Sobrante' : 'Faltante' }); });

    c.items.forEach(i => { const p = prod(i.prod); if (p) (p.ultConteo ||= {})[c.loc] = ts; });

  }

  /* ════════════════════════════════════════════════════════════

     ════════════════════════════════════════════════════════════ */
  const pedido = (id) => db.pedidos.find(p => p.id === id);
  function guardarPedido(d, ctx = {}) {

      lineas: d.lineas.map(l => ({ prod: l.prod, dest: l.dest, costo: l.costo ?? prod(l.prod)?.costo ?? 0 })), nota: d.nota || '', recibido: {}, timeline: [{ ts: ctx.ts || Date.now(), txt: 'Borrador creado' }] };
    db.pedidos.push(p);

  function estadoPedido(id, estado, ctx = {}) {

  }
  const cantPedida = (l) => sum(Object.values(l.dest || {}));
  /* d = {pedido, prov, loc, lineas:[{prod, cant, danado, costo}], factura:{num, importe, vence}} */
  function recibirCompra(d, ctx = {}) {

    const lineas = d.lineas.filter(l => (+l.cant || 0) + (+l.danado || 0) > 0);
    if (!lineas.length) throw new ErrorDato('Indicá qué mercadería llegó.');
    const n = sig('compra');
    const c = { id: 'cp' + n, n, num: 'CP-' + pad(n, 4), ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, prov: d.prov, loc: d.loc, pedido: d.pedido || null,
      lineas: lineas.map(l => ({ prod: l.prod, cant: +l.cant || 0, danado: +l.danado || 0, faltante: +l.faltante || 0, costo: +l.costo || prod(l.prod).costo })), nota: d.nota || '' };

    });

    c.lineas.forEach(l => { const p = prod(l.prod); if (l.costo && p) p.costo = l.costo; });

    if (d.factura?.importe) { db.facturas.push({ id: uid('fa'), prov: d.prov, num: d.factura.num || '', importe: +d.factura.importe, vence: d.factura.vence || iso((ctx.ts || Date.now()) + 30 * DIA), compra: c.id, ts: ctx.ts || Date.now() }); }

      const p = pedido(c.pedido);
      c.lineas.forEach(l => { p.recibido[l.prod] = (p.recibido[l.prod] || {}); p.recibido[l.prod][c.loc] = (p.recibido[l.prod][c.loc] || 0) + l.cant + l.danado; });

    }

    return c;
  }
  function pagarProveedor(d, ctx = {}) { if (!ctx.seed) exigir('pagarProveedor'); db.pagosProv.push({ id: uid('pg'), ts: ctx.ts || Date.now(), user: ctx.user || sesion.id, ...d }); if (!ctx.seed) { registrar('Pago a proveedor', proveedor(d.prov)?.nombre + ' · ' + fmt$(d.importe)); cambio(); } }

  function pedirReposicion(d) { exigir('pedirRepo'); db.pedidosTienda.push({ id: uid('pt'), ts: Date.now(), user: sesion.id, loc: sesion.localId || d.loc, texto: d.texto, prod: d.prod || null, estado: 'nuevo' }); registrar('Pedido de tienda', d.texto); cambio(); }

  /* ════════════════════════════════════════════════════════════
     GASTOS
     ════════════════════════════════════════════════════════════ */
  function guardarGasto(d, ctx = {}) {

    else { d.id = 'g' + sig('gasto'); d.ts = ctx.ts || Date.now(); d.user = ctx.user || sesion.id; d.importe = +d.importe; db.gastos.push(d); if (!ctx.seed) registrar('Gasto', `${d.cat} · ${d.concepto || ''} · ${fmt$(d.importe)} · ${d.loc === 'gen' ? 'General' : local(d.loc).corto}`); }

  function borrarGasto(id) { const g = db.gastos.find(x => x.id === id); if (g.loc === 'gen') exigir('gastosTodos'); else exigir('gastos', g.loc); db.gastos = db.gastos.filter(x => x.id !== id); registrar('Gasto eliminado', `${g.cat} · ${fmt$(g.importe)} · ${fmtF(g.fecha)}`); cambio(); return g; }

  function estadoPago(g) {
    const pag = g.pagado === undefined ? g.fecha : g.pagado;

  }
  function pagarGasto(id, fecha, forma) {
    const g = db.gastos.find(x => x.id === id); if (!g) throw new ErrorDato('No se encontró el gasto.');

    registrar(fecha ? 'Gasto pagado' : 'Gasto marcado sin pagar', `${g.cat} · ${g.concepto || ''} · ${fmt$(g.importe)}${fecha ? ' · ' + fmtF(fecha) : ''}`); cambio();
  }
  const gastosAPagar = (locs) => db.gastos.filter(g => (!locs || locs.includes(g.loc)) && estadoPago(g).est !== 'pagado');
  function recurrentesPendientes() {
    const mk = mesKey(Date.now()); const dia = new Date().getDate();
    return db.recurrentes.filter(r => r.activo && r.ultimo !== mk && dia >= Math.min(r.dia, 28) - 3 && localesFinancieros().concat(esAdmin() ? ['gen'] : []).includes(r.loc));
  }
  function confirmarRecurrente(id, importe) {
    const r = db.recurrentes.find(x => x.id === id);
    guardarGasto({ fecha: iso(Date.now()), loc: r.loc, cat: r.cat, concepto: r.concepto, importe: importe ?? r.importe, forma: r.forma || 'Transferencia', recurrente: r.id, nota: 'Gasto recurrente' });
    r.ultimo = mesKey(Date.now()); cambio();
  }

  /* ════════════════════════════════════════════════════════════
     CÁLCULOS (memorizados por versión)
     ════════════════════════════════════════════════════════════ */
  /* Ventas por producto: última venta, unidades 30/60/90 días */
  function estadisticasProd() {
    return memoizar('estProd', () => {
      const m = new Map(); const ahora = Date.now();
      for (const v of db.ventas) {
        if (v.anulada) continue;
        for (const l of v.lineas) {
          let e = m.get(l.prod); if (!e) m.set(l.prod, e = { ult: 0, u30: 0, u60: 0, u90: 0, uTot: 0, porLoc: {}, ult60Loc: {} });
          const u = l.cant - (l.devuelto || 0); if (u <= 0) continue;
          if (v.ts > e.ult) e.ult = v.ts;
          const d = (ahora - v.ts) / DIA;
          e.uTot += u; if (d <= 30) e.u30 += u; if (d <= 60) { e.u60 += u; e.ult60Loc[v.loc] = (e.ult60Loc[v.loc] || 0) + u; } if (d <= 90) e.u90 += u;

    const e = estadisticasProd().get(p.id);
    const ref = e?.ult || p.creado;
    return diasDesde(ref);
  }

  /* Avisos de stock (alimenta "Avisos", "Para atender" y la campanita) */
  function avisosStock(locs = localesVisibles()) {
    return memoizar('avisos|' + locs.join(','), () => {
      const r = { sinStock: [], bajoMin: [], parado: [], danado: [], exhLarga: [], ajustesGrandes: [], ajustesPend: [] };
      const reglas = cfg().reglas;
      for (const p of db.productos) {
        if (!p.activo) continue;
        let totalVend = 0, valorParado = 0;
        for (const l of locs) {
          const s = saldo(p.id, l); const vend = vendible(s); totalVend += vend;
          const min = minimo(p, l);
          if (l !== 'dep') {
            if (vend <= 0 && min > 0) r.sinStock.push({ p, loc: l, min, otros: locs.filter(o => o !== l && vendible(saldo(p.id, o)) > 0) });
            else if (vend > 0 && vend < min) r.bajoMin.push({ p, loc: l, vend, min });
          }
          if (s.dan > 0) r.danado.push({ p, loc: l, cant: s.dan, nota: ultimaNotaDanio(p.id, l) });

      }

        if (!locs.includes(a.loc)) continue;

        else if (a.grande && !st.revisado && a.tipo !== 'reversion') r.ajustesGrandes.push(a);

  function desdeExhibicion(prodId, loc) { const ms = movsDe(prodId); for (let i = ms.length - 1; i >= 0; i--) { const m = ms[i]; if (m.loc === loc && m.est === 'exh' && m.cant > 0) return m.ts; } return null; }

  /* Ventas en un período */
  function ventasEn(desde, hasta, locs) {
    return db.ventas.filter(v => v.ts >= desde && v.ts < hasta && !v.anulada && (!locs || locs.includes(v.loc)));
  }
  function resumenVentas(vs) {
    let total = 0, costo = 0, uds = 0;

  /* Lista de reposición: mínimo + ventas 60 días − stock − tránsito − pedido */

  };
})();

      for (let k = 0; k < 7; k++) { const t = ini + r.int(0, 27) * DIA; if (t < H - 182 * DIA || t > AHORA) continue; const loc = r.pick(['t1', 't2', 't3', 'gen', 'gen']); const cat = loc === 'gen' ? r.pick(['Publicidad', 'Comisiones de tarjeta', 'Impuestos', 'Fletes']) : r.pick(['Mantenimiento', 'Fletes', 'Otros', 'Otros']); Store.guardarGasto({ fecha: iso(t), loc, cat, concepto: { Publicidad: r.pick(['Facebook / Instagram', 'Radio Zorrilla', 'Folletería']), 'Comisiones de tarjeta': 'Liquidación tarjetas', Impuestos: r.pick(['DGI – IVA', 'DGI – IRAE anticipo', 'Contribución']), Fletes: r.pick(['Flete Montevideo – Rivera', 'Combustible camioneta']), Mantenimiento: r.pick(['Arreglo de persiana', 'Pintura del salón', 'Electricista']), Otros: r.pick(['Artículos de limpieza', 'Café y yerba', 'Bolsas y cinta', 'Papelería']) }[cat], importe: Math.round((cat === 'Impuestos' ? 25000 : cat === 'Comisiones de tarjeta' ? 14000 : cat === 'Publicidad' ? 9000 : cat === 'Fletes' ? 6500 : 2200) * (0.5 + r()) / 10) * 10, forma: r.pick(['Efectivo', 'Transferencia', 'Débito']), comp: '', nota: '' }, S(t + 12 * 3600000, loc === 'gen' ? 'admin' : USR[loc])); }
    }
    [['t1', 38000], ['t2', 30000], ['t3', 26000], ['dep', 22000]].forEach(([loc, imp]) => db.recurrentes.push({ id: uid('rec'), cat: 'Alquiler', concepto: 'Alquiler ' + Store.local(loc).nombre, importe: imp, loc, dia: 5, forma: 'Transferencia', activo: true, ultimo: loc === 't3' ? mesKey(inicioMes(H, -1)) : mesKey(H) }));
    db.recurrentes.push({ id: uid('rec'), cat: 'Antel', concepto: 'Antel fibra + celulares', importe: 3890, loc: 'gen', dia: 20, forma: 'Débito', activo: true, ultimo: mesKey(inicioMes(H, -1)) });

    // Pedidos de las tiendas ("Nos piden este modelo")
    db.pedidosTienda.push({ id: uid('pt'), ts: dia(-2, 17), user: 'u_t2', loc: 't2', texto: 'Nos piden el Ropero Madrid en blanco (preguntaron 3 clientes)', prod: byName('Ropero Madrid').id, estado: 'nuevo' });
    db.pedidosTienda.push({ id: uid('pt'), ts: dia(-1, 11), user: 'u_t3', loc: 't3', texto: 'Colchón 1 plaza ortopédico, más firme que el D60', prod: null, estado: 'nuevo' });

    // Registro de actividad base
    db.actividad.push({ id: uid('act'), ts: ts0, user: 'admin', loc: null, accion: 'Importación', detalle: 'Stock inicial cargado desde deposito_nuevo_2026.xlsx (datos de ejemplo)', ref: null });
    db.movs.slice(-40).forEach(m => {}); // (la actividad detallada se genera al usar la página)

    Store.recalcularStock(true);
    Store._reindex();
    return db;
  }
  return { generar, CAT, PROVS };
})();

const FOTOS_EJEMPLO = {

};

/* Tipo de foto según el nombre del producto (más fino que las ilustraciones) */
function fotoKey(p) {
  const n = norm(p.nombre);
  const R = [[/recliner|reclinable|retractil/, 'recliner'], [/sofa|sillon/, 'sofa'], [/frigobar/, 'frigobar'], [/refrigerador|heladera/, 'heladera'], [/freezer/, 'freezer'],
    [/lavarropa|secarropa|lavasecarropa/, 'lavarropas'], [/aire acond/, 'aire'], [/microondas/, 'micro'], [/ventilador/, 'ventilador'], [/estufa/, 'calefactor'],
    [/freidora/, 'freidora'], [/termotanque/, 'termotanque'], [/torre hornos/, 'torre'], [/^horno/, 'horno'], [/^cocina (tem|luna|victoria|celebracion)/, 'estufa'],
    [/camarin/, 'camarin'], [/zapatera/, 'camarin'], [/cristalero/, 'cristalero'], [/placard|armario/, 'placard'], [/ropero/, 'ropero'],
    [/comoda|cajonera/, 'comoda'], [/mesa de luz/, 'mesaluz'], [/colchon/, 'colchon'], [/almohada/, 'almohada'], [/cuna/, 'cuna'],
    [/respaldo|cama|box|sommier|conjunto oro/, 'cama'], [/desayunador/, 'taburete'], [/juego de comedor|juego menorca/, 'comedor'],
    [/mesa de centro|bancada/, 'mesacentro'], [/rack|panelero|modular/, 'rack'], [/biblioteca|bar brasil/, 'biblioteca'],
    [/aereo|bajo mesada|kit|micro bahrein|cocina compacta/, 'cocina_m'], [/bano|multiuso/, 'bano'],
    [/gamer/, 'gamer'], [/silla giratoria|silla oficina|silla escritorio/, 'silla_of'], [/escritorio/, 'escritorio'], [/poltrona|butaca/, 'poltrona'],
    [/ratan/, 'silla_ratan'], [/silla/, 'silla'], [/sombrilla/, 'sombrilla'], [/reposera/, 'reposera'], [/^set /, 'set'], [/mesa/, 'mesa']];
  for (const [re, k] of R) if (re.test(n)) return k;
  return null;
}
const urlPexels = (id, w = 800) => `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=${w}`;
/* Reparte las fotos de cada tipo entre los modelos, para que dos modelos distintos no repitan foto */
function repartoFotos(productos) {
  const porTipo = {};
  for (const p of productos) { const k = fotoKey(p); if (k && FOTOS_EJEMPLO[k]) (porTipo[k] ||= new Set()).add(norm(p.modelo || p.nombre)); }
  const r = {};
  for (const k in porTipo) [...porTipo[k]].sort().forEach((m, i) => { r[k + '|' + m] = FOTOS_EJEMPLO[k][i % FOTOS_EJEMPLO[k].length]; });
  return r;
}
/* Pone fotos de ejemplo a los productos de la demo que no tienen una propia */
function ponerFotosEjemplo(db) {
  if (!db?.esEjemplo || db.fotosV === FOTOS_V) return false;
  const rep = repartoFotos(db.productos);
  for (const p of db.productos) { if (p.foto && !p.fotoEj) continue; const k = fotoKey(p); const id = k && rep[k + '|' + norm(p.modelo || p.nombre)]; const u = id ? urlPexels(id) : ''; if (u) { p.foto = u; p.fotoEj = true; } else if (p.fotoEj) { p.foto = ''; delete p.fotoEj; } }
  db.fotosV = FOTOS_V; return true;
}

/* ════════════════════════════════════════════════════════════════
   js/04c-vencimientos — vencimientos y pagos en los gastos de ejemplo
   (solo para la demo). A los gastos de servicios les pone fecha de
   vencimiento y agrega algunos sin pagar: vencidos y por vencer.
   Corre una sola vez por copia de datos (PAGOS_V).
   ════════════════════════════════════════════════════════════════ */
const PAGOS_V = 1;
const DIAS_VENCE = { UTE: 10, OSE: 10, Antel: 12, BPS: 0, Alquiler: 5, Impuestos: 0, Publicidad: 15, Fletes: 7 };

function prepararVencimientos(db) {
  if (!db?.esEjemplo || db.pagosV === PAGOS_V) return false;
  for (const g of db.gastos) {
    if (g.pagado !== undefined) continue;
    const dv = DIAS_VENCE[g.cat];
    if (dv != null) g.vence = iso(deIso(g.fecha) + dv * DIA);
    // se pagó el mismo día o unos días después, sin pasarse del vencimiento
    const atraso = dv ? (g.id.charCodeAt(g.id.length - 1) % (dv + 1)) : 0;
    g.pagado = iso(Math.min(deIso(g.fecha) + atraso * DIA, Date.now()));
  }
  const hoy = deIso(iso(Date.now())); const d = (n) => iso(hoy + n * DIA);
  const ctx = { seed: true, ts: Date.now(), user: 'admin' };
  [
    { fecha: d(-8), vence: d(2), loc: 't1', cat: 'UTE', concepto: 'UTE · Tienda 1', importe: 7930, forma: 'Débito', comp: '4418205' },
    { fecha: d(-8), vence: d(2), loc: 'dep', cat: 'OSE', concepto: 'OSE · Depósito', importe: 840, forma: 'Débito', comp: '8810452' },
    { fecha: d(-12), vence: d(-5), loc: 't3', cat: 'BPS', concepto: 'Aportes BPS · Tienda 3', importe: 10650, forma: 'Transferencia', comp: '' },
    { fecha: d(-10), vence: d(-3), loc: 't2', cat: 'Mantenimiento', concepto: 'Arreglo del aire acondicionado · Frío Norte', importe: 6800, forma: 'Transferencia', comp: 'A 1203', nota: 'Pagar con transferencia, pasaron la cuenta por WhatsApp' },
    { fecha: d(-3), vence: d(5), loc: 'gen', cat: 'Impuestos', concepto: 'DGI – IVA del mes', importe: 48200, forma: 'Transferencia', comp: '' },
    { fecha: d(-2), vence: d(13), loc: 'gen', cat: 'Publicidad', concepto: 'Radio · campaña de fin de año', importe: 9500, forma: 'Transferencia', comp: 'B 0458' },
  ].forEach(x => { try { Store.guardarGasto({ ...x, pagado: '', nota: x.nota || '' }, ctx); } catch (e) { console.error(e); } });
  db.pagosV = PAGOS_V;
  return true;
}
