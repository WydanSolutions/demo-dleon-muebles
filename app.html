const ESTADO_CO = { abierto: ['pend', 'Contando'], enviado: ['res', 'Esperando aprobación'], aprobado: ['ok', 'Aprobado'] };
const Conteo = {
  render(c, acc) {
    const locs = Store.esAdmin() ? Store.localesVisibles() : [Store.yo().localId];
    if (Store.puede('contar') || Store.esAdmin()) acc.innerHTML = `<button class="btn prim" id="co-nuevo">${ico('clipboard')} Nuevo conteo</button>`;
    $('#co-nuevo')?.addEventListener('click', () => this.nuevo());
    const ls = Store.db.conteos.filter(x => locs.includes(x.loc)).slice().reverse();
    c.innerHTML = `<div class="caja fila" style="margin-bottom:14px">${ico('info')}<span class="peq">Contá las unidades <b>disponibles para la venta</b> (sin reservadas, dañadas ni en exhibición). Al terminar ves las diferencias; Administración aprueba y recién ahí se ajusta el stock. Cada producto guarda la fecha de su último conteo.</span></div>
      <div class="card" id="co-t"></div>`;
    UI.tabla($('#co-t'), { clave: 'conteos', filas: ls, clic: x => this.abrir(x.id), vacioHtml: UI.vacio('clipboard', 'Todavía no hay conteos', '', `<button class="btn prim" onclick="Conteo.nuevo()">Empezar el primero</button>`), cols: [
      { k: 'num', t: 'N.º', html: x => `<b>${x.num}</b>`, v: x => x.n }, { k: 'ts', t: 'Fecha', html: x => `${fmtFH(x.ts)}<div class="mini mut">${hace(x.ts)}</div>`, v: x => x.ts },
      { k: 'loc', t: 'Local', html: x => locChip(x.loc) }, { k: 'cat', t: 'Alcance', html: x => x.cat ? esc(Store.categoria(x.cat).nombre) : 'Todo el local' },
      { k: 'it', t: 'Productos', n: true, html: x => `${x.items.filter(i => i.contado != null).length} / ${x.items.length}` },
      { k: 'dif', t: 'Diferencias', n: true, html: x => { const d = x.items.filter(i => i.contado != null && i.contado !== i.sistema); return d.length ? `<span class="pend-t semi">${d.length}</span>` : '<span class="ok-t">0</span>'; } },
      { k: 'estado', t: 'Estado', html: x => `<span class="chip ${ESTADO_CO[x.estado][0]}"><span class="pt"></span>${ESTADO_CO[x.estado][1]}</span>`, v: x => x.estado },
      { k: 'user', t: 'Contó', html: x => esc(Store.usuario(x.user).nombre) },
    ] });
  },
  nuevo() {
    const editables = Store.localesEditables().filter(l => Store.puede('contar', l));
    const m = UI.modal({ titulo: 'Nuevo conteo físico', ico: 'clipboard', ancho: 'angosto', cuerpo: `<div class="col" style="gap:14px"><div class="campo"><label>Local</label><select class="sel" id="cn-l">${Store.locales().filter(l => editables.includes(l.id)).map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select></div><div class="campo"><label>¿Qué vas a contar?</label><select class="sel" id="cn-c"><option value="">Todo el local</option>${Store.cfg().categorias.map(x => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select></div></div>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="cn-ok">Empezar a contar</button>` });
    m.el.querySelector('#cn-ok').onclick = () => { const r = UI.hacer(() => Store.crearConteo({ loc: m.el.querySelector('#cn-l').value, cat: m.el.querySelector('#cn-c').value })); if (r) { m.cerrar(); this.abrir(r.id); } };
  },
  abrir(id) {
    const co = Store.conteo(id); const verCostos = Store.puede('verCostos');
    const editable = co.estado === 'abierto' && Store.puede('contar', co.loc);
    let q = '';
    const h = UI.cajon({ ancho: true, cab: `<div style="flex:1;min-width:0"><div class="fila g6" style="margin-bottom:4px"><span class="chip ${ESTADO_CO[co.estado][0]}"><span class="pt"></span>${ESTADO_CO[co.estado][1]}</span><span class="mini mut">${fmtFH(co.ts)} · ${esc(Store.usuario(co.user).nombre)}</span></div><h2>Conteo ${co.num} · ${esc(Store.local(co.loc).nombre)}</h2><div class="mut peq">${co.cat ? esc(Store.categoria(co.cat).nombre) : 'Todo el local'} · ${co.items.length} productos</div><div class="progreso" style="margin-top:12px"><i id="co-prog"></i></div></div>`,
      cuerpo: `${editable ? `<div class="inp-ico" style="margin-bottom:12px">${ico('search')}<input class="inp" id="co-q" placeholder="Buscar en la planilla…"><button class="btn fant ch ico-b" id="co-scan" aria-label="Leer código">${ico('scan')}</button></div>` : ''}<div id="co-res"></div><div class="card" id="co-items"></div>`,
      pie: `<button class="btn" id="co-imp">${ico('printer')} Planilla</button><span class="esp"></span>${editable ? `<button class="btn prim" id="co-env">${ico('send')} Terminar y enviar</button>` : ''}${co.estado === 'enviado' && Store.esAdmin() ? `<button class="btn peligro" id="co-rech">Devolver</button><button class="btn prim" id="co-apr">${ico('check')} Aprobar y ajustar</button>` : ''}` });
    const el = h.el;
    const resumen = () => {
      const cont = co.items.filter(i => i.contado != null); const difs = cont.filter(i => i.contado !== i.sistema);
      const sob = difs.filter(i => i.contado > i.sistema), fal = difs.filter(i => i.contado < i.sistema);
      const val = (xs) => sum(xs, i => (i.contado - i.sistema) * (Store.prod(i.prod)?.costo || 0));
      el.querySelector('#co-prog').style.width = (cont.length / Math.max(1, co.items.length) * 100) + '%';
      el.querySelector('#co-res').innerHTML = `<div class="stat-mini" style="margin-bottom:14px"><div><b>${cont.length}/${co.items.length}</b><span>contados</span></div><div><b class="ok-t">+${sum(sob, i => i.contado - i.sistema)}</b><span>sobrantes${verCostos ? ' · ' + fmt$(val(sob)) : ''}</span></div><div><b class="alerta-t">${sum(fal, i => i.contado - i.sistema)}</b><span>faltantes${verCostos ? ' · ' + fmt$(val(fal)) : ''}</span></div></div>`;
    };
    const pintar = () => {
      const pal = norm(q).split(' ').filter(Boolean);
      const its = co.items.filter(i => !pal.length || pal.every(w => Store.textoBusqueda(Store.prod(i.prod)).includes(w)));
      el.querySelector('#co-items').innerHTML = its.map(i => { const p = Store.prod(i.prod); const d = i.contado == null ? null : i.contado - i.sistema;
        return `<div class="conteo-it ${d == null ? '' : d ? 'dif' : 'ok-c'}" data-it="${i.prod}">${miniProd(p, 40)}<div style="min-width:0"><div class="semi trunc peq">${esc(p.nombre)}</div><div class="mini mut">${esc(p.variante)} · ${p.codigo} · sistema: <b>${i.sistema}</b>${d ? ` · <b class="${d > 0 ? 'ok-t' : 'alerta-t'}">${signo(d)}</b>` : ''}</div></div>${editable ? `<input class="inp num" type="number" min="0" inputmode="numeric" value="${i.contado ?? ''}" placeholder="—" data-prod="${i.prod}">` : `<b class="num" style="font-size:16px">${i.contado ?? '—'}</b>`}</div>`; }).join('');
      $$('[data-prod]', el).forEach(inp => { inp.oninput = () => { Store.anotarConteo(id, inp.dataset.prod, inp.value); const it = co.items.find(x => x.prod === inp.dataset.prod); const row = inp.closest('.conteo-it'); const d = it.contado == null ? null : it.contado - it.sistema; row.classList.toggle('dif', !!d); row.classList.toggle('ok-c', d === 0); resumen(); };
        inp.onkeydown = e => { if (e.key === 'Enter') { const nx = inp.closest('.conteo-it').nextElementSibling?.querySelector('input'); nx?.focus(); nx?.select(); } }; });
    };
    resumen(); pintar();
    el.querySelector('#co-q')?.addEventListener('input', debounce(e => { q = e.target.value; pintar(); }, 100));
    el.querySelector('#co-scan')?.addEventListener('click', () => Escaner.abrir(cod => { const p = Store.productos().find(x => x.barras === cod || norm(x.codigo) === norm(cod)); if (p) { const i = el.querySelector(`[data-prod="${p.id}"]`); i?.scrollIntoView({ block: 'center', behavior: 'smooth' }); i?.focus(); } else UI.toast('Ese código no está en la planilla', 'alerta'); }));
    el.querySelector('#co-imp').onclick = () => Impresos.planillaConteo(id);
    el.querySelector('#co-env')?.addEventListener('click', () => { const sin = co.items.filter(i => i.contado == null).length; UI.confirmar({ titulo: 'Terminar el conteo', texto: sin ? `Quedan ${sin} productos sin contar: se van a tomar como iguales al sistema.` : 'Se envía a Administración para aprobar.', ok: 'Enviar a aprobar', ico: 'send' }).then(ok => { if (ok && UI.hacer(() => Store.enviarConteo(id), 'Conteo enviado a Administración')) h.cerrar(); }); });
    el.querySelector('#co-apr')?.addEventListener('click', () => UI.confirmar({ titulo: 'Aprobar ' + co.num, texto: 'Se genera un “Ajuste por conteo” por cada diferencia.', ok: 'Aprobar', ico: 'check' }).then(ok => { if (ok && UI.hacer(() => Store.aprobarConteo(id))) { h.cerrar(); UI.exito({ titulo: 'Conteo aprobado', texto: 'El stock quedó igual a lo contado.' }); } }));
    el.querySelector('#co-rech')?.addEventListener('click', () => UI.pedirTexto({ titulo: 'Devolver el conteo', etiqueta: '¿Qué hay que revisar?', ok: 'Devolver', peligro: true }).then(t => { if (t && UI.hacer(() => Store.rechazarConteo(id, t), 'Conteo devuelto a la tienda')) h.cerrar(); }));
  },
};

/* ── Avisos de stock ──────────────────────────────────────────── */
const StockAvisos = {
  render(c) {
    const locs = App.locsActivos(); const a = Store.avisosStock(locs);
    const bloque = (tit, icono, cls, items, fila, vacioT, i) => `<div class="card entra" style="--i:${i}"><div class="card-cab"><span class="a-ico ${cls}" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center">${ico(icono, 's')}</span><h3>${tit}</h3><span class="chip ${cls}">${items.length}</span></div><div style="max-height:360px;overflow:auto">${items.length ? items.slice(0, 40).map(fila).join('') : `<p class="mut peq" style="padding:16px 20px">${vacioT}</p>`}</div></div>`;
    const fila = (p, der, sub) => `<div class="fila clic" style="padding:10px 20px;border-bottom:1px solid var(--borde);cursor:pointer" data-p="${p.id}">${miniProd(p, 36)}<div class="esp" style="min-width:0"><div class="trunc semi peq">${esc(Store.nombreProd(p))}</div><div class="mini mut">${sub}</div></div>${der}</div>`;

      ${bloque('Dañados o incompletos', 'alert', 'alerta', a.danado, x => fila(x.p, `<span class="stk cero">${x.cant}</span>`, `${esc(Store.local(x.loc).nombre)} · ${esc(x.nota || 'sin nota')}`), 'No hay unidades dañadas.', 3)}
      ${bloque('En exhibición hace mucho', 'eye', 'tra', a.exhLarga, x => fila(x.p, `<span class="chip exh">${x.dias} días</span>`, `${esc(Store.local(x.loc).nombre)} · ${x.cant} u. · conviene rotarla o hacerle descuento`), 'Nada lleva mucho en exhibición.', 4)}

/* ════════════════════════════════════════════════════════════════
   js/11c-catalogo — Stock › Productos en vista «Catálogo» (tarjetas
   con foto) y el visor de fotos en grande.
   ════════════════════════════════════════════════════════════════ */
const Catalogo = {
  POR_TANDA: 36,
  pintar(cont, ps, locsVer) {
    cont.classList.remove('card');
    if (this.obs) this.obs.disconnect();
    if (!ps.length) { cont.innerHTML = `<div class="card">${UI.vacio('caja', 'No hay productos con esos filtros')}</div>`; return; }
    // Una tarjeta por modelo (los colores se eligen en la tarjeta). Primero los más vendidos.
    const est = Store.estadisticasProd(); const vend90 = p => (est.get(p.id)?.u90 || 0) * p.precio;  // lo que más factura
    const grupos = Object.values(groupBy(ps, p => p.modelo + '|' + p.prov));
    grupos.forEach(g => g.sort((a, b) => vend90(b) - vend90(a)));
    grupos.sort((a, b) => (!!b[0].foto - !!a[0].foto) || (sum(b, vend90) - sum(a, vend90)) || a[0].nombre.localeCompare(b[0].nombre));
    this.grupos = new Map(grupos.map(g => [g[0].modelo + '|' + g[0].prov, g])); this.locsVer = locsVer;
    const cnt = $('#f-cnt'); if (cnt) cnt.textContent = fmtN(grupos.length) + ' modelo' + (grupos.length === 1 ? '' : 's') + ' · ' + fmtN(ps.length) + ' producto' + (ps.length === 1 ? '' : 's');
    const conFoto = ps.some(p => p.fotoEj);
    cont.innerHTML = `<div class="catalogo" id="cat-grilla"></div>${conFoto ? `<p class="cat-credito">${ico('image', 's')} Fotos ilustrativas de Pexels. En la página real van las fotos de cada producto de D’leon (un link de Drive por producto).</p>` : ''}`;
    const g = $('#cat-grilla', cont); let n = 0;
    const tanda = () => {
      const html = grupos.slice(n, n + this.POR_TANDA).map((g, i) => this.tarjeta(g[0], locsVer, g, i)).join('');
      g.insertAdjacentHTML('beforeend', html); n += this.POR_TANDA;
      if (n < grupos.length) { const c = document.createElement('div'); c.className = 'cat-mas'; c.innerHTML = UI.esqueleto(1); g.appendChild(c); this.obs.observe(c); }
    };
    this.obs = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; this.obs.unobserve(e.target); e.target.remove(); tanda(); }), { rootMargin: '600px' });
    tanda();
    g.onclick = e => {
      const v = e.target.closest('[data-var]'); if (v) { e.stopPropagation(); this.cambiarVariante(v); return; }
      const t = e.target.closest('[data-ficha]'); if (t) Ficha.abrir(t.dataset.ficha);
    };
  },
  /* Tocar un color cambia la tarjeta a esa variante (precio, stock y código) */
  cambiarVariante(b) {
    const card = b.closest('.cat-it'); const p = Store.prod(b.dataset.var); if (!card || !p || b.classList.contains('act')) return;
    const g = this.grupos.get(p.modelo + '|' + p.prov) || [p];
    const tmp = document.createElement('div'); tmp.innerHTML = this.tarjeta(p, this.locsVer, g, 0, true);
    const nueva = tmp.firstElementChild; const img = card.querySelector('.cat-foto img.ok');
    if (img) { const ni = nueva.querySelector('.cat-foto img'); if (ni && ni.src === img.src) ni.classList.add('ok'); }
    card.replaceWith(nueva); nueva.classList.add('cambio');
  },
  tarjeta(p, locsVer, hermanos, i, sinEntrada) {
    const c = colorVariante(p.variante);
    const fondo = c.length > 1 ? `linear-gradient(135deg, ${c[0]}22, ${c[1]}30)` : c[0] + '26';
    const tot = Store.stockTotal(p.id, locsVer); const vend = Store.vendible(tot);
    const sinEn = locsVer.filter(l => l !== 'dep' && Store.vendible(Store.saldo(p.id, l)) <= 0 && Store.minimo(p, l) > 0);
    const bajo = locsVer.some(l => l !== 'dep' && Store.vendible(Store.saldo(p.id, l)) > 0 && Store.vendible(Store.saldo(p.id, l)) < Store.minimo(p, l));
    const marca = !p.activo ? `<span class="cat-marca gris">Discontinuado</span>` : vend <= 0 ? `<span class="cat-marca alerta">Sin stock</span>` : sinEn.length ? `<span class="cat-marca alerta">Falta en ${sinEn.map(l => Store.local(l).corto).join(', ')}</span>` : bajo ? `<span class="cat-marca pend">Bajo mínimo</span>` : '';
    const extras = [tot.exh ? `${tot.exh} en exhibición` : '', tot.res ? `${tot.res} reservada${tot.res > 1 ? 's' : ''}` : '', tot.dan ? `${tot.dan} dañada${tot.dan > 1 ? 's' : ''}` : '', tot.tra ? `${tot.tra} en camino` : ''].filter(Boolean);
    const vars = hermanos.length > 1 ? `<span class="cat-vars" role="group" aria-label="Colores">${hermanos.slice(0, 6).map(h => `<button type="button" class="cat-var ${h.id === p.id ? 'act' : ''}" data-var="${h.id}" data-tip="${esc(h.variante || 'Única')}" aria-label="${esc(h.variante || 'Única')}">${swatch(h.variante, 14)}</button>`).join('')}${hermanos.length > 6 ? `<span class="mini">+${hermanos.length - 6}</span>` : ''}</span>` : '';
    const foto = p.foto ? `<img src="${esc(urlFoto(p.foto, 600))}" alt="${esc(p.nombre)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.classList.add('ok')" onerror="this.remove()">` : '';
    return `<article class="cat-it ${sinEntrada ? '' : 'entra'}" style="--i:${Math.min(i, 14)}" data-ficha="${p.id}" tabindex="0" role="button" aria-label="${esc(Store.nombreProd(p))}">
      <div class="cat-foto" style="background:${fondo}">
        <svg viewBox="0 0 120 90" fill="none" stroke="#3A3532" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${ILUS[ilusKey(p)]}</svg>${foto}
        <span class="cat-cat">${esc(p.sub || Store.categoria(p.cat).nombre)}</span>${marca}${vars}
      </div>
      <div class="cat-info">
        <div class="cat-n">${esc(p.nombre)}</div>
        <div class="cat-v">${p.variante ? swatch(p.variante, 11) + `<span class="trunc">${esc(p.variante)}</span>` : '<span>Única</span>'}<span class="cat-cod num">${p.codigo}</span></div>
        <div class="cat-pie"><span class="cat-precio num">${fmt$(p.precio)}</span><span class="cat-tot ${vend <= 0 ? 'cero' : ''}" data-tip="Para vender en total"><b class="num">${vend}</b><span> para vender</span></span></div>
        <div class="cat-locs">${locsVer.map(l => { const s = Store.saldo(p.id, l); const v = Store.vendible(s); const min = Store.minimo(p, l); const lo = Store.local(l);
          return `<span class="cat-loc ${v <= 0 ? (min > 0 ? 'cero' : 'nada') : v < min ? 'bajo' : ''}" data-tip="${esc(lo.nombre)}: ${v} para vender${min ? ' · mínimo ' + min : ''}"><i style="background:${lo.color}"></i>${esc(lo.corto)}<b class="num">${v}</b></span>`; }).join('')}</div>
        ${extras.length ? `<div class="cat-extra">${extras.join(' · ')}</div>` : ''}
      </div>
    </article>`;
  },
};
/* Teclado: Enter abre la ficha */
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList?.contains('cat-it')) Ficha.abrir(e.target.dataset.ficha); });

/* ── Visor de fotos en grande ──────────────────────────────────── */
const Visor = {
  abrir(p) {
    if (!p?.foto) return;
    const v = document.createElement('div'); v.className = 'visor'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', 'Foto de ' + p.nombre);
    v.innerHTML = `<button class="visor-x" aria-label="Cerrar">${ico('x')}</button>
      <figure><div class="visor-marco"><div class="visor-carga"></div><img src="${esc(urlFoto(p.foto, 1600))}" alt="${esc(Store.nombreProd(p))}" referrerpolicy="no-referrer"></div>
      <figcaption><b>${esc(p.nombre)}</b>${p.variante ? ` · ${swatch(p.variante, 12)} ${esc(p.variante)}` : ''}<span class="mut"> · ${fmt$(p.precio)}</span>${p.fotoEj ? '<span class="visor-cred">Foto ilustrativa · Pexels</span>' : ''}</figcaption></figure>`;
    document.body.appendChild(v);
    const img = v.querySelector('img');
    img.onload = () => v.classList.add('listo'); img.onerror = () => { v.classList.add('listo'); img.replaceWith(Object.assign(document.createElement('div'), { className: 'peq', style: 'color:#fff;padding:40px', textContent: 'No se pudo cargar la foto.' })); };
    const cerrar = () => { v.classList.add('sale'); document.removeEventListener('keydown', esc_, true); setTimeout(() => v.remove(), 220); };
    const esc_ = e => { if (e.key === 'Escape') { e.stopPropagation(); cerrar(); } };
    document.addEventListener('keydown', esc_, true);
    v.onclick = e => { if (!e.target.closest('figcaption')) cerrar(); };
    v.querySelector('.visor-x').focus();
  },
};

/* ════════════════════════════════════════════════════════════════
   js/12-ventas — Nueva venta (salón y celular), Ventas, Entregas
   ════════════════════════════════════════════════════════════════ */
const WA = {
  numero(tel) { const d = String(tel || '').replace(/\D/g, ''); if (!d) return ''; return d.startsWith('598') ? d : '598' + d.replace(/^0/, ''); },
  abrir(tel, txt) { const n = this.numero(tel); window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`, '_blank', 'noopener'); },

      <div><div class="etq" style="margin-bottom:8px">Forma de pago</div><div class="opciones">${formas.map(f => `<button class="opcion ${f === st.forma ? 'act' : ''}" data-f="${f}">${ico(icoF[f] || 'dollar')}${f}</button>`).join('')}</div>
        <div id="co-cuotas" class="oculto" style="margin-top:10px"><div class="campo" style="max-width:220px"><label>Cuotas de la tarjeta</label><select class="sel" id="co-cuo">${[1, 2, 3, 6, 10, 12, 18].map(n => `<option value="${n}">${n === 1 ? '1 pago' : n + ' cuotas'}</option>`).join('')}</select></div></div>
        <div id="co-mixto" class="oculto" style="margin-top:10px"></div></div>
      <div class="caja"><label class="chk"><input type="checkbox" id="co-sena"><span>Deja una seña (la venta queda <b>reservada</b> hasta pagar el saldo)</span></label><div id="co-sena-c" class="oculto fila wrap" style="margin-top:10px"><div class="campo" style="width:180px"><label>Importe de la seña</label><input class="inp num" type="number" id="co-sena-m" value="${st.montoSena}"></div><span class="peq mut" id="co-saldo"></span></div></div>

      <div class="err oculto" id="co-err"></div></div>`,
      pie: `<button class="btn" data-cerrar>Seguir vendiendo</button><button class="btn prim gr" id="co-ok">${ico('check')} Confirmar venta</button>` });
    const el = m.el;
    const total = () => t.total + (st.entrega === 'envio' ? (+el.querySelector('#co-flete').value || 0) : 0);
    const pintarMixto = () => { el.querySelector('#co-mixto').innerHTML = st.mixto.map((x, i) => `<div class="fila g6" style="margin-bottom:6px"><select class="sel ch" data-mf="${i}" style="width:160px">${Store.cfg().formasPago.map(f => `<option ${f === x.forma ? 'selected' : ''}>${f}</option>`).join('')}</select><input class="inp ch num" type="number" data-mm="${i}" value="${x.monto}" style="width:130px">${i > 1 ? `<button class="btn ch fant ico-b" data-mx="${i}">${ico('x', 's')}</button>` : ''}</div>`).join('') + `<button class="btn ch fant" id="mx-mas">${ico('plus', 's')} Otra forma</button> <span class="peq" id="mx-suma"></span>`;
      $$('[data-mf]', el).forEach(s => s.onchange = () => { st.mixto[+s.dataset.mf].forma = s.value; }); $$('[data-mm]', el).forEach(s => s.oninput = () => { st.mixto[+s.dataset.mm].monto = +s.value || 0; resumen(); }); $$('[data-mx]', el).forEach(b => b.onclick = () => { st.mixto.splice(+b.dataset.mx, 1); pintarMixto(); resumen(); });
      el.querySelector('#mx-mas').onclick = () => { st.mixto.push({ forma: 'Transferencia', monto: 0 }); pintarMixto(); }; resumen(); };
    const aCobrar = () => st.sena ? (+el.querySelector('#co-sena-m').value || 0) : total();
    const resumen = () => { const tot = total(); el.querySelector('#co-total').textContent = fmt$(tot); const hoy = aCobrar(); el.querySelector('#co-hoy').textContent = st.sena ? `Cobrás hoy ${fmt$(hoy)} · saldo ${fmt$(tot - hoy)}` : ''; el.querySelector('#co-saldo').textContent = st.sena ? 'Saldo: ' + fmt$(tot - hoy) : '';
      if (st.forma === 'Mixto') { const s = sum(st.mixto, x => x.monto); const ms = el.querySelector('#mx-suma'); if (ms) ms.innerHTML = s === hoy ? `<span class="ok-t">${ico('check', 's')} Suma ${fmt$(s)}</span>` : `<span class="alerta-t">Suma ${fmt$(s)} · faltan ${fmt$(hoy - s)}</span>`; } };
    $$('[data-ent]', el).forEach(b => b.onclick = () => { if (b.disabled) return; st.entrega = b.dataset.ent; $$('[data-ent]', el).forEach(x => x.classList.toggle('act', x === b)); el.querySelector('#co-envio').classList.toggle('oculto', st.entrega !== 'envio'); resumen(); });
    $$('[data-f]', el).forEach(b => b.onclick = () => { st.forma = b.dataset.f; $$('[data-f]', el).forEach(x => x.classList.toggle('act', x === b)); el.querySelector('#co-cuotas').classList.toggle('oculto', st.forma !== 'Crédito'); el.querySelector('#co-mixto').classList.toggle('oculto', st.forma !== 'Mixto'); if (st.forma === 'Mixto') { st.mixto[1].monto = aCobrar() - st.mixto[0].monto; pintarMixto(); } });
    el.querySelector('#co-sena').onchange = e => { st.sena = e.target.checked; el.querySelector('#co-sena-c').classList.toggle('oculto', !st.sena); resumen(); if (st.forma === 'Mixto') { st.mixto[1].monto = aCobrar() - st.mixto[0].monto; pintarMixto(); } };
    el.querySelector('#co-sena-m').oninput = resumen; el.querySelector('#co-flete').oninput = resumen;
    el.querySelector('#co-ok').onclick = () => {
      const err = el.querySelector('#co-err'); const mostrarErr = (t) => { err.innerHTML = ico('alert', 's') + ' ' + t; err.classList.remove('oculto'); };
      const entrega = st.entrega === 'envio' ? { tipo: 'envio', dir: el.querySelector('#co-dir').value.trim(), fecha: el.querySelector('#co-fecha').value, franja: el.querySelector('#co-franja').value, armado: el.querySelector('#co-armado').checked, flete: +el.querySelector('#co-flete').value || 0, nota: el.querySelector('#co-nota').value.trim() } : { tipo: 'ahora' };
      if (st.entrega === 'envio' && !entrega.dir) { el.querySelector('#co-dir').classList.add('invalido'); return mostrarErr('Escribí la dirección de entrega.'); }
      if (st.entrega === 'envio' && !this.cli) return mostrarErr('Para un envío elegí o creá el cliente (para tener su teléfono).');
      const hoy = aCobrar();
      if (st.sena && (hoy <= 0 || hoy >= total())) return mostrarErr('La seña tiene que ser mayor a $ 0 y menor al total.');
      const pagos = st.forma === 'Mixto' ? st.mixto.filter(x => x.monto > 0) : [{ forma: st.forma, monto: hoy, cuotas: st.forma === 'Crédito' ? +el.querySelector('#co-cuo').value : undefined }];
      if (st.forma === 'Mixto' && sum(pagos, x => x.monto) !== hoy) return mostrarErr('Las formas de pago tienen que sumar ' + fmt$(hoy) + '.');
      if (!st.sena && st.entrega === 'envio' && hoy < total()) return mostrarErr('Falta cobrar el total o marcar seña.');
      const btn = el.querySelector('#co-ok'); btn.classList.add('cargando');
      setTimeout(() => {
        try {
          const v = Store.crearVenta({ loc: this.loc, cli: this.cli, lineas: this.carrito.map(l => ({ ...l })), descTotal: this.descTotal, pagos, entrega, cfe: el.querySelector('#co-cfe').value.trim() });
          m.cerrar(); this.carrito = []; this.cli = null; this.descTotal = 0; this.pintarCarrito(); this.buscar();
          this.exito(v);
        } catch (e) { btn.classList.remove('cargando'); if (e instanceof ErrorStock) { mostrarErr(esc(e.message)); this.buscar(); } else UI.err(e); }
      }, 350);
    };
  },
  exito(v) {
    const t = Store.totalesVenta(v); const c = Store.cliente(v.cli); const est = Store.estadoVenta(v);
    const tr = Store.db.transferencias.filter(x => x.venta === v.id);
    const m = UI.exito({ titulo: `Venta ${v.num} confirmada`, texto: `${fmt$(t.total)}${t.saldo ? ` · seña ${fmt$(t.pagado)} · saldo ${fmt$(t.saldo)}` : ''}${est === 'completada' ? ' · el cliente se lo llevó' : v.entrega.tipo === 'envio' ? ' · entrega el ' + fmtF(v.entrega.fecha) : ' · queda reservada'}${tr.length ? `<br><span class="chip tra" style="margin-top:8px">${ico('swap', 's')} Se pidió ${tr.map(x => x.num).join(', ')}</span>` : ''}`,
      botones: `<button class="btn" data-x="a4">${ico('printer')} A4</button><button class="btn" data-x="tic">${ico('receipt')} Ticket</button>${c?.tel ? `<button class="btn" data-x="wa" style="color:#128C4A">${ico('whatsapp')} WhatsApp</button>` : ''}<button class="btn prim" data-cerrar style="flex:1">Nueva venta</button>` });
    m.el.querySelector('.modal-pie').onclick = e => { const b = e.target.closest('[data-x]'); if (!b) return; ({ a4: () => Impresos.comprobante(v.id), tic: () => Impresos.comprobante(v.id, 'ticket'), wa: () => WA.abrir(c.tel, mensajeVenta(v)) })[b.dataset.x](); };
  },
};

/* ════════════════════════════════════════════════════════════════

/* Chip del estado de pago de un gasto */
function chipPago(g) {
  const e = Store.estadoPago(g);
  if (e.est === 'pagado') return `<span class="chip ok"><span class="pt"></span>Pagado ${fmtFC(e.fecha)}</span>`;
  if (e.est === 'vencido') return `<span class="chip alerta"><span class="pt"></span>Vencido hace ${-e.dias} día${e.dias === -1 ? '' : 's'}</span>`;
  if (e.est === 'pronto') return `<span class="chip pend"><span class="pt"></span>${e.dias === 0 ? 'Vence hoy' : e.dias === 1 ? 'Vence mañana' : 'Vence en ' + e.dias + ' días'}</span>`;
  return `<span class="chip borde"><span class="pt"></span>Sin pagar</span>`;
}
const fmtFC = (f) => { const [, m, d] = String(f).split('-'); return d ? `${+d}/${+m}` : ''; };

      <div id="g-rec"></div><div id="g-pagar"></div>
      <div class="barra-filtros"><select class="sel ch" id="g-mes" style="width:auto">${meses.map(k => `<option value="${k}" ${f.mes === k ? 'selected' : ''}>${mesNombre(k)}</option>`).join('')}<option value="todo" ${f.mes === 'todo' ? 'selected' : ''}>Últimos 6 meses</option></select>
        ${admin ? `<select class="sel ch" id="g-loc" style="width:auto"><option value="">Todos</option>${Store.locales().map(l => `<option value="${l.id}" ${f.loc === l.id ? 'selected' : ''}>${esc(l.nombre)}</option>`).join('')}<option value="gen" ${f.loc === 'gen' ? 'selected' : ''}>Generales</option></select>` : ''}
        <select class="sel ch" id="g-cat" style="width:auto"><option value="">Todas las categorías</option>${Store.cfg().categoriasGasto.map(c => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>

        <div class="card"><div class="card-cab"><h3>Comparativo mensual</h3></div><div class="card-cuerpo" id="g-mes-g"></div></div>${admin ? `<div class="card"><div class="card-cab"><h3>Por local</h3></div><div class="card-cuerpo" id="g-loc-g"></div></div>` : ''}</div>`;

        .map(([v, t, n, c]) => `<button class="filtro-chip ${f.est === v ? 'act' : ''}" data-v="${v}">${t}${n ? ` <span class="cuenta ${c || ''}">${n}</span>` : ''}</button>`).join('')
        + (f.est === 'apagar' || f.est === 'vencidos' ? '<span class="esp"></span><span class="mut peq">De todos los meses</span>' : '');
      $('#g-mes').disabled = f.est === 'apagar' || f.est === 'vencidos';
      if (f.est === 'apagar') filas = aPagar.slice().sort((a, b) => (a.vence || '9999').localeCompare(b.vence || '9999'));
      else if (f.est === 'vencidos') filas = vencidos.slice().sort((a, b) => a.vence.localeCompare(b.vence));
      else filas = Store.gastosEn(d, h, locsOp).filter(coincide).filter(g => f.est !== 'pagados' || Store.estadoPago(g).est === 'pagado').sort((a, b) => b.fecha.localeCompare(a.fecha));
      $('#g-tot').textContent = fmt$(sum(filas, g => g.importe));

        vacioHtml: f.est === 'apagar' || f.est === 'vencidos' ? UI.vacio('receipt', f.est === 'vencidos' ? 'No hay gastos vencidos' : 'No queda nada por pagar', 'Todo al día.') : UI.vacio('receipt', 'Todavía no hay gastos en este período', '', `<button class="btn prim" onclick="Vistas.gastos.form()">Cargar el primero</button>`), cols: [

        { k: 'vence', t: 'Vence', html: g => g.vence ? `<span class="peq">${fmtF(g.vence)}</span>` : '<span class="mut peq">—</span>', v: g => g.vence || '' },
        { k: 'pago', t: 'Pago', html: g => `${chipPago(g)}<div class="mini mut" style="margin-top:3px">${esc(g.forma || '')}${g.comp ? ' · Comp. ' + esc(g.comp) : ''}${g.foto ? ' · ' + ico('camera', 's') : ''}</div>`, v: g => { const e = Store.estadoPago(g); return e.est === 'pagado' ? '9' + e.fecha : (e.dias ?? 999) + 5000; } },
        { k: 'importe', t: 'Importe', n: true, html: g => `<b class="num">${fmt$(g.importe)}</b>`, v: g => g.importe },
        { k: 'x', t: '', ord: false, w: '1%', html: g => `<span class="fila g4" style="justify-content:flex-end;flex-wrap:nowrap">${Store.estadoPago(g).est !== 'pagado' ? `<button class="btn ch prim" data-pagar="${g.id}">${ico('check', 's')} Pagar</button>` : ''}<button class="btn ch fant ico-b" data-borrar="${g.id}" aria-label="Eliminar">${ico('trash', 's')}</button></span>` },
      ], pie: (fs) => `<td colspan="${admin ? 5 : 4}">Total</td><td class="n num">${fmt$(sum(fs, g => g.importe))}</td><td></td>` });

      $$('[data-pagar]', el).forEach(b => b.onclick = e => { e.stopPropagation(); this.pagar(b.dataset.pagar); });
      const porCat = Object.entries(groupBy(filas, g => g.cat)).map(([c, xs]) => ({ l: c, v: sum(xs, x => x.importe) })).sort((a, b) => b.v - a.v).map((x, i) => ({ ...x, c: PALETA_GASTOS[i % PALETA_GASTOS.length] }));
      $('#g-cat-g').innerHTML = porCat.length ? Graf.horiz(porCat, { ancho: 380 }) : '<p class="mut peq">Sin datos</p>';

      <div class="fila" style="padding:12px 16px;border-top:1px solid var(--borde)"><span class="esp semi">Total</span><b class="num">${fmt$(sum(filas, g => g.importe))}</b></div>

    $('#g-mas')?.addEventListener('click', () => { this.tope = tope + 40; this.fichas(filas, f); $$('[data-pagar]', c).forEach(b => b.onclick = ev => { ev.stopPropagation(); this.pagar(b.dataset.pagar); }); });

    if (!aPagar.length) { c.innerHTML = ''; return; }
    const pronto = aPagar.filter(g => Store.estadoPago(g).est === 'pronto');
    const prox = aPagar.filter(g => g.vence && Store.estadoPago(g).est !== 'vencido').sort((a, b) => a.vence.localeCompare(b.vence))[0];
    c.innerHTML = `<div class="card pagar-card entra" style="margin-bottom:16px"><div class="pagar-grilla">
      <button class="pagar-it ${vencidos.length ? 'alerta' : ''}" data-f="vencidos"><span class="etq">Vencidos</span><b class="num">${fmt$(sum(vencidos, g => g.importe))}</b><span class="mini">${vencidos.length ? vencidos.length + ' gasto' + (vencidos.length > 1 ? 's' : '') + ' · pagalos cuanto antes' : 'Ninguno'}</span></button>
      <button class="pagar-it ${pronto.length ? 'pend' : ''}" data-f="apagar"><span class="etq">Vencen en 7 días</span><b class="num">${fmt$(sum(pronto, g => g.importe))}</b><span class="mini">${pronto.length ? pronto.length + ' gasto' + (pronto.length > 1 ? 's' : '') + (prox ? ' · el próximo ' + (Store.estadoPago(prox).dias === 0 ? 'hoy' : fmtF(prox.vence)) : '') : 'Ninguno'}</span></button>
      <button class="pagar-it" data-f="apagar"><span class="etq">Total sin pagar</span><b class="num">${fmt$(sum(aPagar, g => g.importe))}</b><span class="mini">${aPagar.length} gasto${aPagar.length > 1 ? 's' : ''} en total</span></button>
    </div></div>`;
    $$('[data-f]', c).forEach(b => b.onclick = () => this.ponerFiltro(b.dataset.f));
  },
  /* Registrar el pago de un gasto que estaba pendiente */
  pagar(id) {
    const g = Store.db.gastos.find(x => x.id === id); if (!g) return;
    const e = Store.estadoPago(g);
    const m = UI.modal({ titulo: 'Registrar el pago', sub: `${g.concepto || g.cat} · ${fmt$(g.importe)}`, ico: 'check', ancho: 'angosto', cuerpo: `<div class="col" style="gap:14px">
      ${g.vence ? `<div class="caja fila ${e.est === 'vencido' ? 'alerta' : ''}">${ico('calendar')}<span class="peq">Vence el <b>${fmtF(g.vence)}</b>${e.est === 'vencido' ? ` · hace ${-e.dias} día${e.dias === -1 ? '' : 's'}` : ''}</span></div>` : ''}
      <div class="campo"><label>Fecha de pago</label><input class="inp" type="date" id="gp-f" value="${iso(Date.now())}"></div>
      <div class="campo"><label>Forma de pago</label><select class="sel" id="gp-fp">${Store.cfg().formasPago.map(x => `<option ${g.forma === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="gp-ok">${ico('check')} Marcar pagado</button>` });
    m.el.querySelector('#gp-ok').onclick = () => {
      const fecha = m.el.querySelector('#gp-f').value; if (!fecha) { m.el.querySelector('#gp-f').classList.add('invalido'); return; }
      const formaAntes = g.forma;
      if (UI.hacer(() => Store.pagarGasto(id, fecha, m.el.querySelector('#gp-fp').value))) {
        m.cerrar();
        UI.toast(`Pago registrado · ${esc(g.concepto || g.cat)}`, 'ok', { accion: { txt: 'Deshacer', fn: () => Store.pagarGasto(id, '', formaAntes) } });
      }
    };
  },
  recurrentes() {
    const rp = Store.recurrentesPendientes(); const c = $('#g-rec'); if (!c) return;
    c.innerHTML = rp.length ? `<div class="card entra" style="margin-bottom:16px;border-color:var(--tra-borde)"><div class="card-cab">${ico('refresh')}<h3>Gastos recurrentes para confirmar este mes</h3><span class="chip tra">${rp.length}</span></div>${rp.map(r => `<div class="fila" style="padding:12px 20px;border-bottom:1px solid var(--borde)"><div class="esp"><div class="semi">${esc(r.concepto)}</div><div class="mini mut">${esc(r.cat)} · ${r.loc === 'gen' ? 'General' : esc(Store.local(r.loc).nombre)} · todos los días ${r.dia}</div></div><input class="inp ch num" type="number" value="${r.importe}" data-ri="${r.id}" style="width:120px"><button class="btn ch prim" data-rc="${r.id}">${ico('check', 's')} Confirmar</button></div>`).join('')}</div>` : '';
    $$('[data-rc]', c).forEach(b => b.onclick = () => UI.hacer(() => Store.confirmarRecurrente(b.dataset.rc, +c.querySelector(`[data-ri="${b.dataset.rc}"]`).value), 'Gasto recurrente confirmado'));
  },
  form(g = null) {
    const admin = Store.esAdmin();
    const v = g || { fecha: iso(Date.now()), loc: admin ? (App.locUnico() || 'gen') : Store.yo().localId, cat: '', concepto: '', importe: '', forma: 'Efectivo', comp: '', nota: '', foto: '', vence: '', pagado: iso(Date.now()) };
    const pagadoAhora = Store.estadoPago(v).est === 'pagado';
    const fechaPago = v.pagado === undefined ? v.fecha : (v.pagado || iso(Date.now()));
    const m = UI.modal({ titulo: g ? 'Editar gasto' : 'Cargar gasto', ico: 'wallet', cuerpo: `<div class="grilla g2" style="gap:14px">
      <div class="campo"><label>Fecha del gasto</label><input class="inp" type="date" id="gf-f" value="${v.fecha}"><div class="ayuda">La de la factura o el recibo</div></div>
      <div class="campo"><label>Vence <span class="mut" style="font-weight:500">(opcional)</span></label><input class="inp" type="date" id="gf-v" value="${v.vence || ''}"><div class="ayuda">Hasta cuándo hay plazo para pagar</div></div>
      <div class="campo"><label>Local</label><select class="sel" id="gf-l" ${admin ? '' : 'disabled'}>${(admin ? Store.locales() : [Store.local(Store.yo().localId)]).map(l => `<option value="${l.id}" ${v.loc === l.id ? 'selected' : ''}>${esc(l.nombre)}</option>`).join('')}${admin ? `<option value="gen" ${v.loc === 'gen' ? 'selected' : ''}>General de la empresa</option>` : ''}</select></div>
      <div class="campo"><label>Categoría <span class="alerta-t">*</span></label><select class="sel" id="gf-c"><option value="">Elegí…</option>${Store.cfg().categoriasGasto.map(c => `<option ${v.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="campo"><label>Importe ($) <span class="alerta-t">*</span></label><input class="inp num" type="number" id="gf-i" value="${v.importe}" inputmode="decimal"></div>
      <div class="campo"><label>N.º de comprobante</label><input class="inp" id="gf-cp" value="${esc(v.comp)}"></div>
      <div class="campo" style="grid-column:1/-1"><label>Proveedor / concepto</label><input class="inp" id="gf-co" value="${esc(v.concepto)}" placeholder="Ej.: UTE local Centro"></div>
      <div class="campo pago-bloque" style="grid-column:1/-1"><label>¿Ya está pagado?</label>
        ${UI.seg([{ v: 'si', txt: 'Sí, ya se pagó', ico: 'check' }, { v: 'no', txt: 'No, falta pagar', ico: 'clock' }], pagadoAhora ? 'si' : 'no', { id: 'gf-pg', cls: 'lleno' })}
        <div class="grilla g2" style="gap:14px;margin-top:12px">
          <div class="campo" id="gf-pf-c"><label>Fecha de pago</label><input class="inp" type="date" id="gf-pf" value="${fechaPago}"></div>
          <div class="campo"><label id="gf-fp-l">${pagadoAhora ? 'Forma de pago' : 'Se va a pagar con'}</label><select class="sel" id="gf-fp">${Store.cfg().formasPago.map(x => `<option ${v.forma === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
        </div>
        <div class="caja pend fila oculto" id="gf-sinv" style="margin-top:10px">${ico('info')}<span class="peq">Poné la fecha de vencimiento para que te avisemos antes de que venza.</span></div>
      </div>
      <label class="foto-sub" style="grid-column:1/-1"><input type="file" accept="image/*" capture="environment" id="gf-foto" hidden>${ico('camera')}<span class="esp">Foto del comprobante (opcional)</span><span id="gf-fp-prev">${v.foto ? `<img src="${v.foto}">` : ''}</span></label>
      <div class="campo" style="grid-column:1/-1"><label>Nota</label><input class="inp" id="gf-n" value="${esc(v.nota)}"></div>
      ${!g && admin ? `<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="gf-rec"> Repetir todos los meses (gasto recurrente)</label>` : ''}</div>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="gf-ok">${ico('check')} Guardar</button>` });
    const q = (s) => m.el.querySelector(s);
    let pagado = pagadoAhora;
    const ajustar = () => {
      q('#gf-pf-c').classList.toggle('oculto', !pagado);
      q('#gf-fp-l').textContent = pagado ? 'Forma de pago' : 'Se va a pagar con';
      q('#gf-sinv').classList.toggle('oculto', pagado || !!q('#gf-v').value);
    };
    UI.activarSeg(q('#gf-pg'), x => { pagado = x === 'si'; if (pagado && !q('#gf-pf').value) q('#gf-pf').value = iso(Date.now()); ajustar(); });
    q('#gf-v').addEventListener('input', ajustar);
    ajustar();
    let foto = v.foto || '';
    q('#gf-foto').onchange = async e => { const f = e.target.files[0]; if (f) { foto = await reducirFoto(f, 900, .7); q('#gf-fp-prev').innerHTML = `<img src="${foto}">`; } };
    q('#gf-ok').onclick = () => {
      const d = { ...(g || {}), fecha: q('#gf-f').value, vence: q('#gf-v').value, pagado: pagado ? (q('#gf-pf').value || iso(Date.now())) : '', loc: q('#gf-l').value, cat: q('#gf-c').value, importe: +q('#gf-i').value, concepto: q('#gf-co').value.trim(), forma: q('#gf-fp').value, comp: q('#gf-cp').value.trim(), nota: q('#gf-n').value.trim(), foto };
      if (!d.cat) q('#gf-c').classList.add('invalido'); if (!(d.importe > 0)) q('#gf-i').classList.add('invalido');
      if (!d.fecha) { q('#gf-f').classList.add('invalido'); return; }
      if (d.vence && d.vence < d.fecha) { q('#gf-v').classList.add('invalido'); UI.toast('El vencimiento no puede ser antes de la fecha del gasto.', 'alerta'); return; }
      if (UI.hacer(() => Store.guardarGasto(d), g ? 'Gasto actualizado' : (pagado ? 'Gasto cargado' : 'Gasto cargado · queda para pagar'))) {
        if (q('#gf-rec')?.checked) { Store.db.recurrentes.push({ id: uid('rec'), cat: d.cat, concepto: d.concepto || d.cat, importe: d.importe, loc: d.loc, dia: new Date(deIso(d.fecha)).getDate(), forma: d.forma, activo: true, ultimo: mesKey(deIso(d.fecha)) }); Store.cambio(); }
        m.cerrar();
      }
    };
  },
};

const ClienteForm = {
  abrir(id = null, alGuardar) {
    const c = id ? Store.cliente(id) : { nombre: '', doc: '', tel: '', dir: '', barrio: '', ciudad: 'Rivera', notas: '' };
    const m = UI.modal({ titulo: id ? 'Editar cliente' : 'Cliente nuevo', sub: 'Los clientes se comparten entre las tres tiendas', ico: 'userPlus', cuerpo: `<div class="grilla g2" style="gap:14px">
      <div class="campo" style="grid-column:1/-1"><label>Nombre y apellido <span class="alerta-t">*</span></label><input class="inp" id="cf-n" value="${esc(c.nombre)}" autofocus></div>
      <div class="campo"><label>Teléfono / WhatsApp</label><input class="inp" id="cf-t" value="${esc(c.tel)}" inputmode="tel" placeholder="099 123 456"></div>
      <div class="campo"><label>Cédula o RUT</label><input class="inp" id="cf-d" value="${esc(c.doc)}"></div>
      <div class="campo" style="grid-column:1/-1"><label>Dirección</label><input class="inp" id="cf-di" value="${esc(c.dir)}"></div>
      <div class="campo"><label>Barrio</label><input class="inp" id="cf-b" value="${esc(c.barrio)}"></div><div class="campo"><label>Ciudad</label><input class="inp" id="cf-c" value="${esc(c.ciudad)}"></div>
      <div class="campo" style="grid-column:1/-1"><label>Notas</label><input class="inp" id="cf-no" value="${esc(c.notas)}" placeholder="Ej.: prefiere entregas de mañana"></div></div>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="cf-ok">${ico('check')} Guardar</button>` });
    m.el.querySelector('#cf-ok').onclick = () => {
      const d = { ...(id ? c : {}), nombre: m.el.querySelector('#cf-n').value.trim(), tel: m.el.querySelector('#cf-t').value.trim(), doc: m.el.querySelector('#cf-d').value.trim(), dir: m.el.querySelector('#cf-di').value.trim(), barrio: m.el.querySelector('#cf-b').value.trim(), ciudad: m.el.querySelector('#cf-c').value.trim(), notas: m.el.querySelector('#cf-no').value.trim() };
      if (!d.nombre) { m.el.querySelector('#cf-n').classList.add('invalido'); return UI.toast('Escribí el nombre del cliente', 'alerta'); }
      const dup = !id && Store.db.clientes.find(x => (d.tel && x.tel.replace(/\D/g, '') === d.tel.replace(/\D/g, '')) || (d.doc && x.doc === d.doc));
      if (dup) { UI.toast(`Ya existe ${esc(dup.nombre)} con ese teléfono o documento`, 'info', { accion: { txt: 'Usarlo', fn: () => { m.cerrar(); alGuardar?.(dup); } } }); return; }
      const r = UI.hacer(() => Store.guardarCliente(d), id ? 'Cliente actualizado' : 'Cliente creado'); if (r) { m.cerrar(); alGuardar?.(r); }
    };
  },
};

Vistas.clientes = {
  render(el, sub) {
    this.el = el; this.sub = sub || 'clientes';
    el.innerHTML = `<div class="titulo-pag"><div><h1>Clientes y proveedores</h1><p class="sub">Clientes compartidos entre las tiendas · proveedores unificados</p></div><div class="acc" id="cl-acc"></div></div>${UI.tabs([{ id: 'clientes', txt: 'Clientes', cuenta: Store.db.clientes.length }, { id: 'proveedores', txt: 'Proveedores', cuenta: Store.db.proveedores.length }], this.sub, 'cl-tabs')}<div id="cl-cont"></div>`;
    UI.indicador($('#cl-tabs')); $('#cl-tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) App.ir('clientes', b.dataset.tab); };
    this.sub === 'proveedores' ? this.proveedores($('#cl-cont'), $('#cl-acc')) : this.clientes($('#cl-cont'), $('#cl-acc'));
  },
  refrescar() { if (!UI.pila.length) this.render(this.el, this.sub); },
  datosCliente(c) {
    const vs = Store.db.ventas.filter(v => v.cli === c.id && !v.anulada);
    return { vs, total: sum(vs, v => Store.totalesVenta(v).neto), saldo: sum(vs, v => Store.totalesVenta(v).saldo), ult: vs.length ? Math.max(...vs.map(v => v.ts)) : null };
  },
  clientes(c, acc) {
    acc.innerHTML = `<button class="btn prim" id="cl-nuevo">${ico('userPlus')} Cliente nuevo</button>`; $('#cl-nuevo').onclick = () => ClienteForm.abrir();
    const f = UI.recordar('cli_f', { q: '', filtro: '' });
    c.innerHTML = `<div class="barra-filtros"><div class="inp-ico">${ico('search')}<input class="inp ch" id="cl-q" placeholder="Nombre, teléfono, cédula o barrio"></div><div id="cl-f" class="fila g6">${[['', 'Todos'], ['saldo', 'Con saldo pendiente'], ['mes', 'Compraron este mes'], ['inactivos', 'Sin compras hace +6 meses']].map(([v, t]) => `<button class="filtro-chip ${f.filtro === v ? 'act' : ''}" data-v="${v}">${t}</button>`).join('')}</div></div><div class="card" id="cl-t"></div>`;
    const datos = new Map(Store.db.clientes.map(x => [x.id, this.datosCliente(x)]));
    const pintar = () => {
      const q = norm($('#cl-q').value); const im = inicioMes(); const h6 = Date.now() - 182 * DIA;
      const fs = Store.db.clientes.filter(x => (!q || norm([x.nombre, x.tel, x.doc, x.barrio, x.ciudad].join(' ')).includes(q))).map(x => ({ ...x, _d: datos.get(x.id) }))
        .filter(x => !f.filtro || (f.filtro === 'saldo' ? x._d.saldo > 0 : f.filtro === 'mes' ? x._d.ult >= im : (!x._d.ult || x._d.ult < h6)));
      UI.tabla($('#cl-t'), { clave: 'clientes', filas: fs, clic: x => this.fichaCliente(x.id), cols: [
        { k: 'nombre', t: 'Cliente', html: x => `<div class="fila"><span class="avatar ch">${App.iniciales(x.nombre)}</span><div style="min-width:0"><div class="semi trunc">${esc(x.nombre)}</div><div class="mini mut">${esc(x.doc)}</div></div></div>`, v: x => x.nombre },
        { k: 'tel', t: 'Teléfono', html: x => esc(x.tel) }, { k: 'barrio', t: 'Barrio · ciudad', html: x => `${esc(x.barrio)}<div class="mini mut">${esc(x.ciudad)}</div>`, v: x => x.barrio },
        { k: 'n', t: 'Compras', n: true, html: x => x._d.vs.length, v: x => x._d.vs.length }, { k: 'tot', t: 'Total comprado', n: true, html: x => `<b class="num">${fmt$(x._d.total)}</b>`, v: x => x._d.total },
        { k: 'saldo', t: 'Saldo', n: true, html: x => x._d.saldo ? `<span class="chip res">${fmt$(x._d.saldo)}</span>` : '<span class="mut2">—</span>', v: x => x._d.saldo },
        { k: 'ult', t: 'Última compra', html: x => x._d.ult ? `${fmtF(x._d.ult)}<div class="mini mut">${hace(x._d.ult)}</div>` : '<span class="mut">Nunca</span>', v: x => x._d.ult || 0 },
        { k: 'wa', t: '', ord: false, w: '1%', html: x => x.tel ? `<button class="btn ch fant ico-b" data-wa="${x.id}" aria-label="WhatsApp" style="color:#128C4A">${ico('whatsapp')}</button>` : '' },
      ] });
      $$('[data-wa]', c).forEach(b => b.onclick = e => { e.stopPropagation(); const x = Store.cliente(b.dataset.wa); WA.abrir(x.tel, `Hola ${x.nombre.split(' ')[0]}! Te escribimos de D'leon Muebles.`); });
    };
    $('#cl-q').oninput = debounce(pintar, 120);
    $('#cl-f').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; f.filtro = b.dataset.v; UI.guardarRec('cli_f', f); $$('#cl-f .filtro-chip').forEach(x => x.classList.toggle('act', x === b)); pintar(); };
    pintar();
  },
  fichaCliente(id) {
    const c = Store.cliente(id); const d = this.datosCliente(c); const vis = Store.localesFinancieros();
    const ents = d.vs.filter(v => v.entrega.tipo === 'envio');
    UI.cajon({ cab: `<div class="fila" style="flex:1;min-width:0"><span class="avatar" style="width:52px;height:52px;border-radius:16px;font-size:18px">${App.iniciales(c.nombre)}</span><div style="min-width:0"><h2>${esc(c.nombre)}</h2><div class="mut peq">${esc(c.tel)} · ${esc(c.doc)} · ${esc(c.barrio)}, ${esc(c.ciudad)}</div></div></div>`,
      cuerpo: `<div class="stat-mini" style="margin-bottom:18px"><div><b>${d.vs.length}</b><span>compras en todos los locales</span></div><div><b>${fmt$(d.total)}</b><span>total comprado</span></div><div><b style="${d.saldo ? 'color:var(--res)' : ''}">${fmt$(d.saldo)}</b><span>saldo pendiente</span></div></div>
        ${c.notas ? `<div class="caja" style="margin-bottom:16px"><div class="etq">Notas</div><p class="peq">${esc(c.notas)}</p></div>` : ''}
        <dl class="datos-lista" style="margin-bottom:18px"><dt>Dirección</dt><dd>${esc(c.dir)}</dd><dt>Cliente desde</dt><dd>${fmtF(c.creado)}</dd><dt>Entregas</dt><dd>${ents.length} (${ents.filter(v => v.entrega.estado !== 'entregada').length} pendientes)</dd></dl>
        <h3 style="margin-bottom:10px">Historial de compras</h3>${d.vs.length ? `<div class="card"><table class="tabla compacta"><thead><tr><th>Venta</th><th>Fecha</th><th>Local</th><th class="n">Total</th><th>Estado</th></tr></thead><tbody>${d.vs.slice().reverse().map(v => `<tr class="${vis.includes(v.loc) ? 'clic' : ''}" data-v="${vis.includes(v.loc) ? v.id : ''}"><td class="semi">${v.num}</td><td>${fmtF(v.ts)}</td><td>${locChip(v.loc)}</td><td class="n">${fmt$(Store.totalesVenta(v).total)}</td><td>${chipVenta(v)}</td></tr>`).join('')}</tbody></table></div>` : UI.vacio('cart', 'Todavía no compró')}`,
      pie: `${c.tel ? `<button class="btn" id="fc-wa" style="color:#128C4A">${ico('whatsapp')} WhatsApp</button>` : ''}<button class="btn" id="fc-ed">${ico('edit')} Editar</button>${Store.puede('vender') ? `<button class="btn prim dcha" id="fc-v">${ico('cart')} Nueva venta</button>` : ''}`,
      alAbrir: (el, h) => { $$('[data-v]', el).forEach(r => r.dataset.v && (r.onclick = () => Vistas.ventas.detalle(r.dataset.v)));
        el.querySelector('#fc-wa')?.addEventListener('click', () => WA.abrir(c.tel, `Hola ${c.nombre.split(' ')[0]}! Te escribimos de D'leon Muebles.`));
        el.querySelector('#fc-ed').onclick = () => ClienteForm.abrir(id);
        el.querySelector('#fc-v')?.addEventListener('click', () => { h.cerrar(); POS.cli = id; App.ir('ventas', 'nueva'); }); } });
  },
  proveedores(c, acc) {
    const admin = Store.puede('proveedoresEditar');
    acc.innerHTML = admin ? `<button class="btn" id="pv-fus">${ico('merge')} Fusionar duplicados</button><button class="btn prim" id="pv-nuevo">${ico('plus')} Proveedor nuevo</button>` : '';
    const sinProv = Store.productos().filter(p => !p.prov && p.activo).length;
    const dups = this.duplicados();
    c.innerHTML = `${dups.length && admin ? `<div class="caja pend fila" style="margin-bottom:14px">${ico('merge')}<span class="esp">Parece que hay proveedores escritos de distintas formas: ${dups.map(g => '<b>' + g.map(p => esc(p.nombre)).join(' / ') + '</b>').join(', ')}.</span><button class="btn ch" id="pv-fus2">Revisar</button></div>` : ''}

      <div class="pasos" style="margin-bottom:18px">${['borrador', 'enviado', 'encamino', 'recibido'].map((e, k, arr) => { const ord = { borrador: 0, enviado: 1, encamino: 2, parcial: 2.5, recibido: 3 }[p.estado]; return `<div class="paso ${k < ord || p.estado === 'recibido' ? 'hecho' : k === Math.ceil(ord) ? 'actual' : ''}"><span class="p-c">${k < ord || p.estado === 'recibido' ? ico('check', 's') : k + 1}</span>${ESTADO_PE[e][1]}</div>${k < arr.length - 1 ? `<div class="paso-l ${k < ord ? 'hecho' : ''}"></div>` : ''}`; }).join('')}</div>
      <div class="card" style="margin-bottom:14px"><table class="tabla compacta"><thead><tr><th>Producto</th>${locs.map(l => `<th class="n">${esc(l.corto)}</th>`).join('')}<th class="n">Pedido</th><th class="n">Recibido</th>${verCostos ? '<th class="n">Costo</th>' : ''}</tr></thead><tbody>${p.lineas.map(l => { const rec = sum(Object.values(p.recibido[l.prod] || {})); return `<tr><td>${prodCelda(Store.prod(l.prod))}</td>${locs.map(lo => `<td class="n">${l.dest[lo.id] || ''}</td>`).join('')}<td class="n semi">${Store.cantPedida(l)}</td><td class="n ${rec >= Store.cantPedida(l) ? 'ok-t' : rec ? 'pend-t' : ''}">${rec}</td>${verCostos ? `<td class="n">${fmt$(l.costo)}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>
      ${p.timeline?.length ? `<div class="linea-tiempo">${p.timeline.map(x => `<div class="lt-it"><div class="semi peq">${esc(x.txt)}</div><div class="mini mut">${fmtFH(x.ts)}</div></div>`).join('')}</div>` : ''}`,
      pie: `<button class="btn" id="pd-pdf">${ico('printer')} PDF</button>${pv?.tel ? `<button class="btn" id="pd-wa" style="color:#128C4A">${ico('whatsapp')} WhatsApp</button>` : ''}<span class="esp"></span>
        ${admin && p.estado === 'borrador' ? `<button class="btn prim" data-e="enviado">${ico('send')} Marcar enviado</button>` : ''}${admin && p.estado === 'enviado' ? `<button class="btn" data-e="encamino">${ico('truck')} En camino</button>` : ''}
        ${['enviado', 'encamino', 'parcial'].includes(p.estado) && Store.puede('recibirCompra') ? `<button class="btn prim" id="pd-rec">${ico('inbox')} Recibir mercadería</button>` : ''}` });
    m.el.querySelector('#pd-pdf').onclick = () => Impresos.pedido(id);
    m.el.querySelector('#pd-wa')?.addEventListener('click', () => WA.abrir(pv.tel, WA.plantilla('pedido', { proveedor: pv.nombre, numero: p.num, detalle: p.lineas.map(l => `• ${Store.cantPedida(l)}× ${Store.nombreProd(Store.prod(l.prod))}${Store.prod(l.prod).codProv ? ' (' + Store.prod(l.prod).codProv + ')' : ''}`).join('\n') })));
    $$('[data-e]', m.el).forEach(b => b.onclick = () => { if (UI.hacer(() => Store.estadoPedido(id, b.dataset.e), 'Pedido ' + ESTADO_PE[b.dataset.e][1].toLowerCase())) { m.cerrar(); this.detallePedido(id); } });
    m.el.querySelector('#pd-rec')?.addEventListener('click', () => { m.cerrar(); this.recibir({ pedido: id }); });
  },
  recibidas(c, acc, extra) {
    acc.innerHTML = Store.puede('recibirCompra') ? `<button class="btn prim" id="rc-n">${ico('inbox')} Recibir mercadería</button>` : '';
    $('#rc-n')?.addEventListener('click', () => this.recibir({}));
    const locs = Store.esAdmin() ? Store.localesVisibles() : [Store.yo().localId]; const verCostos = Store.puede('verCostos');
    const ls = Store.db.compras.filter(x => locs.includes(x.loc)).slice().reverse();
    const facts = Store.db.facturas; const hoy = iso(Date.now());
    const porPagar = verCostos ? Store.db.proveedores.map(p => ({ p, d: Store.deudaProveedor(p.id), prox: facts.filter(f => f.prov === p.id).sort((a, b) => b.vence.localeCompare(a.vence))[0] })).filter(x => x.d > 0).sort((a, b) => b.d - a.d) : [];
    c.innerHTML = `${porPagar.length ? `<div class="card" style="margin-bottom:16px"><div class="card-cab">${ico('dollar')}<h3>Facturas de proveedores por pagar</h3><span class="chip pend">${fmt$(sum(porPagar, x => x.d))}</span></div><div class="grilla g3" style="padding:16px 20px;gap:10px">${porPagar.slice(0, 9).map(x => `<div class="caja fila"><div class="esp"><div class="semi peq">${esc(x.p.nombre)}</div><div class="mini ${x.prox?.vence < hoy ? 'alerta-t' : 'mut'}">Vence ${fmtF(x.prox?.vence)}</div></div><b class="num">${fmt$(x.d)}</b></div>`).join('')}</div></div>` : ''}<div class="card" id="rc-t"></div>`;
    UI.tabla($('#rc-t'), { clave: 'compras', filas: ls, cols: [
      { k: 'num', t: 'N.º', html: x => `<b>${x.num}</b>${x.pedido ? `<div class="mini mut">${Store.pedido(x.pedido)?.num}</div>` : ''}`, v: x => x.n },
      { k: 'ts', t: 'Fecha', html: x => `${fmtFH(x.ts)}<div class="mini mut">${hace(x.ts)}</div>`, v: x => x.ts },
      { k: 'prov', t: 'Proveedor', html: x => esc(Store.proveedor(x.prov)?.nombre || '—') }, { k: 'loc', t: 'Entró en', html: x => locChip(x.loc) },
      { k: 'u', t: 'Unidades', n: true, html: x => `${sum(x.lineas, l => l.cant)}${sum(x.lineas, l => l.danado) ? ` <span class="chip alerta">${sum(x.lineas, l => l.danado)} dañ.</span>` : ''}` },
      ...(verCostos ? [{ k: 'imp', t: 'A costo', n: true, html: x => fmt$(sum(x.lineas, l => (l.cant + l.danado) * l.costo)) }] : []),
      { k: 'user', t: 'Recibió', html: x => esc(Store.usuario(x.user).nombre) },
    ], vacioHtml: UI.vacio('inbox', 'Todavía no se recibió mercadería') });
    if (extra?.recibir) this.recibir({});
  },
  /* Recibir mercadería (con o sin pedido) */
  recibir({ pedido = null }) {
    const editables = Store.localesEditables().filter(l => Store.puede('recibirCompra', l)); const verCostos = Store.puede('verCostos');
    if (!editables.length) return UI.toast('Tu usuario no recibe mercadería', 'alerta');
    const ped = pedido ? Store.pedido(pedido) : null;
    const st = { pedido, prov: ped?.prov || '', loc: ped ? (Object.keys(ped.lineas[0]?.dest || {}).find(l => editables.includes(l)) || editables[0]) : (editables.includes(App.locUnico()) ? App.locUnico() : editables[0]), lineas: [] };
    const cargarPedido = () => { st.lineas = ped ? ped.lineas.filter(l => l.dest[st.loc]).map(l => { const pend = (l.dest[st.loc] || 0) - (ped.recibido[l.prod]?.[st.loc] || 0); return { prod: l.prod, esperado: Math.max(0, pend), cant: Math.max(0, pend), danado: 0, costo: l.costo }; }) : st.lineas; };
    cargarPedido();
    const m = UI.modal({ titulo: 'Recibir mercadería', sub: ped ? `Pedido ${ped.num} · ${Store.proveedor(ped.prov)?.nombre}` : 'Contá lo que llegó: entra al stock con movimiento “Ingreso por compra”', ico: 'inbox', ancho: 'xancho', cuerpo: `
      <div class="grilla g3" style="margin-bottom:12px"><div class="campo"><label>Entra en</label><select class="sel" id="rm-l">${Store.locales().filter(l => editables.includes(l.id)).map(l => `<option value="${l.id}" ${l.id === st.loc ? 'selected' : ''}>${esc(l.nombre)}</option>`).join('')}</select></div>
      <div class="campo"><label>Proveedor</label><select class="sel" id="rm-p" ${ped ? 'disabled' : ''}><option value="">Elegí…</option>${Store.db.proveedores.map(p => `<option value="${p.id}" ${p.id === st.prov ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div>
      ${!ped ? `<div class="campo"><label>Agregar producto</label>${buscadorProd('rm-b')}</div>` : '<div></div>'}</div>
      <div class="card" id="rm-lin"></div>
      ${verCostos ? `<div class="grilla g3" style="margin-top:14px"><div class="campo"><label>Factura del proveedor</label><input class="inp" id="rm-fn" placeholder="A 12345"></div><div class="campo"><label>Importe con IVA ($)</label><input class="inp num" type="number" id="rm-fi"></div><div class="campo"><label>Vencimiento de pago</label><input class="inp" type="date" id="rm-fv" value="${iso(Date.now() + 30 * DIA)}"></div></div>` : `<p class="peq mut" style="margin-top:12px">${ico('lock', 's')} La factura y los costos los completa Administración.</p>`}
      <div class="campo" style="margin-top:12px"><label>Nota</label><input class="inp" id="rm-n" placeholder="Ej.: una caja llegó golpeada"></div>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="rm-ok">${ico('check')} Confirmar recepción</button>` });
    const el = m.el;
    const sugerirImporte = () => { const i = el.querySelector('#rm-fi'); if (i && !i.dataset.tocado) i.value = Math.round(sum(st.lineas, l => (l.cant + l.danado) * (l.costo || 0)) * (1 + Store.cfg().reglas.iva / 100)); };
    const pintar = () => { el.querySelector('#rm-lin').innerHTML = st.lineas.length ? `<table class="tabla compacta"><thead><tr><th>Producto</th>${ped ? '<th class="n">Esperado</th>' : ''}<th class="n">Llegó bien</th><th class="n">Dañado</th>${ped ? '<th class="n">Falta</th>' : ''}${verCostos ? '<th class="n">Costo unit.</th>' : ''}${!ped ? '<th></th>' : ''}</tr></thead><tbody>${st.lineas.map((l, i) => `<tr><td>${prodCelda(Store.prod(l.prod))}</td>${ped ? `<td class="n">${l.esperado}</td>` : ''}<td class="n"><input class="inp ch num" type="number" min="0" value="${l.cant}" data-c="${i}" style="width:66px;text-align:right"></td><td class="n"><input class="inp ch num" type="number" min="0" value="${l.danado}" data-d="${i}" style="width:66px;text-align:right"></td>${ped ? `<td class="n" data-f="${i}">${Math.max(0, l.esperado - l.cant - l.danado) || '—'}</td>` : ''}${verCostos ? `<td class="n"><input class="inp ch num" type="number" min="0" value="${l.costo}" data-co="${i}" style="width:96px;text-align:right"></td>` : ''}${!ped ? `<td><button class="btn ch fant ico-b" data-x="${i}">${ico('x', 's')}</button></td>` : ''}</tr>`).join('')}</tbody></table>` : UI.vacio('inbox', ped ? 'Nada pendiente para este local' : 'Agregá lo que llegó');
      $$('[data-c]', el).forEach(x => x.oninput = () => { st.lineas[+x.dataset.c].cant = +x.value || 0; act(+x.dataset.c); }); $$('[data-d]', el).forEach(x => x.oninput = () => { st.lineas[+x.dataset.d].danado = +x.value || 0; act(+x.dataset.d); }); $$('[data-co]', el).forEach(x => x.oninput = () => { st.lineas[+x.dataset.co].costo = +x.value || 0; sugerirImporte(); }); $$('[data-x]', el).forEach(b => b.onclick = () => { st.lineas.splice(+b.dataset.x, 1); pintar(); });
      sugerirImporte(); };
    const act = (i) => { const f = el.querySelector(`[data-f="${i}"]`); const l = st.lineas[i]; if (f) f.textContent = Math.max(0, l.esperado - l.cant - l.danado) || '—'; sugerirImporte(); };
    el.querySelector('#rm-fi')?.addEventListener('input', e => e.target.dataset.tocado = 1);
    if (!ped) activarBuscadorProd(el, 'rm-b', id => { const l = st.lineas.find(x => x.prod === id); if (l) l.cant++; else { st.lineas.push({ prod: id, cant: 1, danado: 0, costo: Store.prod(id).costo }); if (!st.prov && Store.prod(id).prov) { st.prov = Store.prod(id).prov; el.querySelector('#rm-p').value = st.prov; } } pintar(); });
    el.querySelector('#rm-l').onchange = e => { st.loc = e.target.value; cargarPedido(); pintar(); };
    el.querySelector('#rm-p').onchange = e => { st.prov = e.target.value; };
    el.querySelector('#rm-ok').onclick = () => {
      if (!st.prov) { el.querySelector('#rm-p').classList.add('invalido'); return UI.toast('Elegí el proveedor', 'alerta'); }
      try { const cp = Store.recibirCompra({ pedido: st.pedido, prov: st.prov, loc: st.loc, lineas: st.lineas.map(l => ({ ...l, faltante: l.esperado ? Math.max(0, l.esperado - l.cant - l.danado) : 0 })), nota: el.querySelector('#rm-n').value, factura: verCostos ? { num: el.querySelector('#rm-fn').value, importe: +el.querySelector('#rm-fi').value, vence: el.querySelector('#rm-fv').value } : null });
        m.cerrar(); const falt = sum(cp.lineas, l => l.faltante); UI.exito({ titulo: 'Mercadería recibida', texto: `${sum(cp.lineas, l => l.cant)} u. entraron a ${Store.local(cp.loc).nombre}${sum(cp.lineas, l => l.danado) ? ` · ${sum(cp.lineas, l => l.danado)} dañadas` : ''}${falt ? ` · faltan ${falt} (el pedido queda abierto)` : ''}.` }); }
      catch (e) { UI.err(e); }
    };
    pintar();
  },
};

   js/17-importar — Importar deposito_nuevo_2026.xlsx con vista previa

const Importador = (() => {
  const HOJAS = [[/mueble/i, 'mue'], [/colch/i, 'col'], [/electro/i, 'ele'], [/patio/i, 'pat']];
  const MENORES = new Set(['de', 'del', 'con', 'y', 'para', 'a', 'en', 'la', 'el', 'sin', 'c/']);
  const limpiarNombre = (s) => String(s || '').replace(/\s+/g, ' ').replace(/\s*\/+\s*$/, '').replace(/\s*-+\s*$/, '').trim().toLowerCase()
    .split(' ').map((w, i) => (i && MENORES.has(w)) ? w : /\d/.test(w) ? w.replace(/x/g, '×').replace(/(\d)\*(\d)/g, '$1×$2') : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  const titulo = (s) => String(s || '').replace(/\s*\/\s*/g, '/').replace(/\s+/g, ' ').trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  function subcat(cat, n) {
    n = norm(n);
    if (cat === 'mue') return /aereo|aero|bajo mesada|kit|cocina compacta|torre|micro|desayunador|alacena/.test(n) ? 'Cocina' : /ropero|placar|comoda|cama |respaldo|mesa de luz|zapatera|camarin|cajonera/.test(n) ? 'Dormitorio' : /bano|multiuso|botiquin/.test(n) ? 'Baño' : /escritorio|silla (de )?(oficina|escritorio)|gamer|mesa de pc/.test(n) ? 'Oficina y escritorio' : /cuna|infantil|marinera|book/.test(n) ? 'Infantil' : 'Living y comedor';
    if (cat === 'col') return /almoh|cervical/.test(n) ? 'Almohadas' : /king|158|160|198|200/.test(n) ? 'King' : /\b(108|110)\b|1,08|1,10|1\.10|plaza y media/.test(n) ? '1½ plaza' : /\b(80|88|90)\b|cuna|junior/.test(n) ? '1 plaza' : '2 plazas';
    if (cat === 'ele') return /^cocina|hornalla/.test(n) ? 'Cocinas' : /horno/.test(n) ? 'Hornos' : /freezer|frezzer/.test(n) ? 'Freezers' : /refri|frigobar/.test(n) ? 'Refrigeradores' : /lava|seca/.test(n) ? 'Lavado' : /aire|ventilador|estufa|airway/.test(n) ? 'Climatización' : 'Pequeños electro';
    return /mesa/.test(n) ? 'Mesas' : /sombrilla/.test(n) ? 'Sombrillas' : /reposera/.test(n) ? 'Reposeras' : /set|juego|conjunto/.test(n) ? 'Sets' : 'Sillas';
  }
  /* Detecta columnas por encabezado y por contenido */
  function columnas(filas) {
    let hi = filas.findIndex(f => f.some(c => /detalle|cantidad|catidad|codigo|fecha/i.test(String(c || ''))));
    if (hi < 0) hi = 0;
    const cab = filas[hi].map(c => norm(c));
    const map = {};
    cab.forEach((h, i) => {
      if (/llegad/.test(h)) map.llegada = i; else if (/cod/.test(h)) map.codigo = i; else if (/color/.test(h)) map.color = i; else if (/proveed/.test(h)) map.prov = i;
      else if (/cant|catidad/.test(h)) map.cant = i; else if (/salida/.test(h)) map.salida = i; else if (/detalle|colchon|cocinas/.test(h)) map.detalle = i; else if (/observ|nota/.test(h)) map.obs = i;
    });
    const datos = filas.slice(hi + 1);
    const ancho = Math.max(...filas.map(f => f.length));
    const stats = Array.from({ length: ancho }, (_, i) => { const vs = datos.map(f => f[i]).filter(v => v !== '' && v != null).map(String); return { n: vs.length, largo: vs.length ? sum(vs, v => v.length) / vs.length : 0, espacios: vs.filter(v => / /.test(v.trim())).length / (vs.length || 1), llego: vs.filter(v => /lleg/i.test(v)).length }; });
    const usados = new Set(Object.values(map));
    if (map.detalle == null) { let best = -1, bl = 0; stats.forEach((s, i) => { if (!usados.has(i) && !s.llego && s.largo > bl) { bl = s.largo; best = i; } }); map.detalle = best; usados.add(best); }
    if (map.codigo == null) { const i = stats.findIndex((s, i) => !usados.has(i) && i < map.detalle && s.n > 3 && s.espacios < .3 && !s.llego); if (i >= 0) { map.codigo = i; usados.add(i); } }
    if (map.llegada == null) { const i = stats.findIndex((s, i) => !usados.has(i) && s.llego > 0); if (i >= 0) { map.llegada = i; usados.add(i); } }
    map.extra = stats.map((s, i) => i).filter(i => !usados.has(i) && i > Math.max(map.cant ?? 0, map.salida ?? 0));
    return { hi, map };
  }
  function cantidad(v) {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return Math.max(0, Math.round(v));
    const s = String(v).trim().replace(/^=/, '');
    if (/^[\d\s+\-]+$/.test(s)) { try { return Math.max(0, s.split('+').reduce((a, x) => a + (+x.trim() || 0), 0)); } catch (e) { return 0; } }
    const m = s.match(/^\d+/); return m ? +m[0] : 0;
  }
  const fechaSerie = (v) => typeof v === 'number' && v > 40000 && v < 60000 ? fmtF(Math.round((v - 25569) * DIA) + 12 * 3600000) : null;
  function provDeNombre(n) { const t = norm(n); return /princi|prince/.test(t) ? 'PRINCI HOGAR' : /litoral/.test(t) ? 'LITORAL' : /herval/.test(t) ? 'HERVAL' : /uruguay comercial/.test(t) ? 'URUGUAY COMERCIAL' : /patria/.test(t) ? 'PATRIA' : /nigamar/.test(t) ? 'NIGAMAR' : /divino/.test(t) ? 'DIVINO' : /zona muebles/.test(t) ? 'ZONA MUEBLES' : /\btem\b/.test(t) ? 'TEM' : ''; }
  /* Agrupa proveedores escritos de distintas formas */
  function unificarProveedores(nombres) {
    const clave = (n) => norm(n).replace(/\b(muebles|hogar|interior|sa|srl)\b/g, '').replace(/[^a-z]/g, '');

      if (!g) grupos.push(g = { claves: [], vars: [] });

    }

    return grupos;
  }

  function analizar(wb) {
    const X = window.XLSX; const res = { productos: [], avisos: [], hojas: [], provs: new Map() };
    for (const nombre of wb.SheetNames) {
      const h = HOJAS.find(([re]) => re.test(nombre)); if (!h) { res.avisos.push({ t: 'info', m: `Hoja “${nombre}” sin categoría conocida: se ignora.` }); continue; }
      const cat = h[1]; const ws = wb.Sheets[nombre];
      const filas = X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      // fórmulas tipo "=22+18": usar el valor calculado o evaluarlas
      Object.keys(ws).filter(k => k[0] !== '!' && ws[k].f).forEach(k => { const c = X.utils.decode_cell(k); if (filas[c.r]) filas[c.r][c.c] = ws[k].v ?? cantidad('=' + ws[k].f); });
      const { hi, map } = columnas(filas);
      let seccion = ''; let n = 0;
      filas.slice(hi + 1).forEach((f, idx) => {
        const fila = hi + idx + 2;
        const det = String(f[map.detalle] ?? '').trim(); const cod = map.codigo != null ? String(f[map.codigo] ?? '').trim() : '';
        const cantRaw = map.cant != null ? f[map.cant] : ''; const llegada = map.llegada != null ? f[map.llegada] : '';
        if (!det && !cod) return;
        if (det && !cod && (cantRaw === '' || cantRaw == null) && !llegada && det.length < 30 && det === det.toUpperCase() && !/\d/.test(det)) { seccion = det; return; } // título de sección
        if (!det) { res.avisos.push({ t: 'alerta', m: `${nombre} fila ${fila}: tiene código “${cod}” pero no tiene detalle. Se omite.` }); return; }
        const obs = [...(map.extra || []).map(i => f[i]), map.obs != null ? f[map.obs] : ''].map(x => String(x || '').trim()).filter(Boolean);
        const salida = map.salida != null ? String(f[map.salida] || '').trim() : '';
        let prov = map.prov != null ? String(f[map.prov] || '').trim() : ''; if (!prov) prov = provDeNombre(det);
        if (/^lleg/i.test(prov) || /^\d/.test(prov)) { obs.push(prov); prov = ''; }
        const cant = cantidad(cantRaw); const fs = fechaSerie(llegada);
        const p = { hoja: nombre, fila, cat, sub: subcat(cat, (seccion + ' ' + det)), nombre: limpiarNombre(det.replace(/\s*[-/]+\s*(patria|zona muebles|princi hogar|mobil|rm muebles|nigamar|divino)\s*$/i, '')), variante: map.color != null ? titulo(f[map.color]) : '', codProv: cod, provOrig: prov, cant,
          notaHist: [fs ? 'Llegó ' + fs : String(llegada || '').trim(), salida ? 'Control: ' + salida : ''].filter(Boolean).join(' · '), obs: obs.join(' · '), danado: 0, notaDanio: '' };
        const mObs = obs.join(' ').match(/(\d+)?\s*(roto|abierto|incompleto)/i);
        if (mObs) { p.danado = Math.min(cant || 1, +(mObs[1] || 1)); p.notaDanio = obs.join(' · '); }
        if (typeof cantRaw === 'string' && cantRaw.startsWith('=')) res.avisos.push({ t: 'info', m: `${nombre} fila ${fila}: fórmula “${cantRaw}” → ${cant}.` });
        if (prov) res.provs.set(prov, (res.provs.get(prov) || 0) + 1);
        res.productos.push(p); n++;
      });
      res.hojas.push({ nombre, cat, n, cols: map });
    }
    // Códigos repetidos con distinto color → mismo modelo
    const porCod = groupBy(res.productos.filter(p => p.codProv && p.codProv.length > 1), p => p.cat + '|' + norm(p.codProv));
    Object.values(porCod).filter(g => g.length > 1).forEach(g => { const modelo = g.sort((a, b) => a.nombre.length - b.nombre.length)[0].nombre; g.forEach(p => p.modelo = modelo); res.avisos.push({ t: 'info', m: `Código “${g[0].codProv}” repetido en ${g.length} filas (${g.map(p => p.variante || 's/color').join(', ')}): se agrupan como variantes de “${modelo}”.` }); });
    const raros = res.productos.filter(p => /^\d$/.test(p.codProv)); if (raros.length) res.avisos.push({ t: 'alerta', m: `${raros.length} productos tienen un código de un solo dígito (ej. “2”): se les asigna código interno y conviene revisarlos.` });

    res.grupos = unificarProveedores([...res.provs.entries()]);
    res.sinProv = res.productos.filter(p => !p.provOrig).length;

  function importar(r) {
    const loc = $('#im-loc').value; const cero = $('#im-modo').value === 'cero';

    if (cero) { const nuevo = Store.vacia(); nuevo.config = Store.db.config; nuevo.actividad = Store.db.actividad; Store._set(nuevo); }

      const nombres = unir ? [[g.canon, g.vars.map(v => v[0])]] : g.vars.map(([n]) => [titulo(n), [n]]);
      nombres.forEach(([nombre, origs]) => {
        let pv = db.proveedores.find(p => norm(p.nombre) === norm(nombre) || distancia(norm(p.nombre).replace(/[^a-z]/g, ''), norm(nombre).replace(/[^a-z]/g, '')) <= 1);

const Exportar = {
  async excel(nombre, filas, hoja = 'Datos') {
    if (!filas?.length) return UI.toast('No hay datos para exportar', 'info');
    try { UI.toast('Preparando el Excel…', 'info', { ms: 1500 }); const X = await cargarXLSX(); const wb = X.utils.book_new(); const ws = X.utils.json_to_sheet(filas);
      ws['!cols'] = Object.keys(filas[0]).map(k => ({ wch: Math.min(48, Math.max(k.length, ...filas.slice(0, 200).map(f => String(f[k] ?? '').length)) + 2) }));
      X.utils.book_append_sheet(wb, ws, hoja.slice(0, 30)); X.writeFile(wb, `${nombre}_${iso(Date.now())}.xlsx`); }
    catch (e) { UI.toast('No se pudo cargar la librería de Excel (¿sin internet?). Se descarga en CSV.', 'alerta'); const cols = Object.keys(filas[0]); descargar(`${nombre}.csv`, '﻿' + [cols.join(';'), ...filas.map(f => cols.map(c => `"${String(f[c] ?? '').replace(/"/g, '""')}"`).join(';'))].join('\n'), 'text/csv'); }
  },
  async pdf(titulo, filas, sub = '') {
    if (!filas?.length) return UI.toast('No hay datos para exportar', 'info');
    try { UI.toast('Armando el PDF…', 'info', { ms: 1500 }); const JsPDF = await cargarPDF(); const doc = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      try { doc.addImage(LOGO_DLEON_SRC, 'PNG', 14, 10, 42, 17); } catch (e) {}
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(titulo, 62, 18); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(107, 101, 96); doc.text(`${sub}  ·  Generado ${fmtFH(Date.now())} por ${Store.yo()?.nombre || ''}`, 62, 24);
      const cols = Object.keys(filas[0]);
      doc.autoTable({ startY: 32, head: [cols], body: filas.map(f => cols.map(c => typeof f[c] === 'number' && /valor|importe|total|\$/i.test(c) ? fmt$(f[c]) : String(f[c] ?? ''))), styles: { fontSize: 7.5, cellPadding: 1.8 }, headStyles: { fillColor: [28, 25, 23] }, alternateRowStyles: { fillColor: [250, 250, 249] } });
      doc.save(`${titulo.toLowerCase().replace(/\s+/g, '_')}_${iso(Date.now())}.pdf`); }
    catch (e) { console.error(e); UI.toast('No se pudo generar el PDF (¿sin internet?). Probá imprimir la pantalla.', 'alerta'); }
  },
};

  function pedido(id) {
    const p = Store.pedido(id); const pv = Store.proveedor(p.prov);
    imprimir(`<div class="imp">${cab('Pedido a proveedor ' + p.num, `${esc(pv?.nombre || '')} · ${fmtF(p.ts)}`)}
      <table><thead><tr><th>Cód. prov.</th><th>Producto</th>${Store.locales().map(l => `<th class="n">${esc(l.corto)}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${p.lineas.map(l => { const pr = Store.prod(l.prod); return `<tr><td>${esc(pr.codProv)}</td><td>${esc(Store.nombreProd(pr))}</td>${Store.locales().map(lo => `<td class="n">${l.dest[lo.id] || ''}</td>`).join('')}<td class="n"><b>${Store.cantPedida(l)}</b></td></tr>`; }).join('')}</tbody></table>
      ${p.nota ? `<p><b>Nota:</b> ${esc(p.nota)}</p>` : ''}${pie()}</div>`);
  }
  function etiquetas(ids) {
    imprimir(`<div class="imp"><div class="etiquetas">${ids.map(id => { const p = Store.prod(id); const cod = p.barras || p.codigo; return `<div class="etiqueta">${LOGO_DLEON(22)}<div style="font-weight:700;margin:3mm 0 1mm;font-size:11pt;line-height:1.2">${esc(p.nombre)}</div><div style="color:#6B6560;font-size:9pt">${esc(p.variante)}</div><div class="e-p">${fmt$(p.precio)}</div><div style="font-size:8pt;color:#6B6560">IVA incluido</div>${barrasSVG(cod)}<div style="font-size:8pt;text-align:center;letter-spacing:1px">${esc(cod)}</div></div>`; }).join('')}</div></div>`);
  }
  /* Código de barras Code 39 (simple, legible por lectores comunes) */
  function barrasSVG(txt) {
    const C39 = { '0': 'nnnwwnwnn', '1': 'wnnwnnnnw', '2': 'nnwwnnnnw', '3': 'wnwwnnnnn', '4': 'nnnwwnnnw', '5': 'wnnwwnnnn', '6': 'nnwwwnnnn', '7': 'nnnwnnwnw', '8': 'wnnwnnwnn', '9': 'nnwwnnwnn', 'A': 'wnnnnwnnw', 'B': 'nnwnnwnnw', 'C': 'wnwnnwnnn', 'D': 'nnnnwwnnw', 'E': 'wnnnwwnnn', 'F': 'nnwnwwnnn', 'G': 'nnnnnwwnw', 'H': 'wnnnnwwnn', 'I': 'nnwnnwwnn', 'J': 'nnnnwwwnn', 'K': 'wnnnnnnww', 'L': 'nnwnnnnww', 'M': 'wnwnnnnwn', 'N': 'nnnnwnnww', 'O': 'wnnnwnnwn', 'P': 'nnwnwnnwn', 'Q': 'nnnnnnwww', 'R': 'wnnnnnwwn', 'S': 'nnwnnnwwn', 'T': 'nnnnwnwwn', 'U': 'wwnnnnnnw', 'V': 'nwwnnnnnw', 'W': 'wwwnnnnnn', 'X': 'nwnnwnnnw', 'Y': 'wwnnwnnnn', 'Z': 'nwwnwnnnn', '-': 'nwnnnnwnw', '.': 'wwnnnnwnn', ' ': 'nwwnnnwnn', '*': 'nwnnwnwnn' };
    const s = '*' + String(txt).toUpperCase().replace(/[^0-9A-Z\-. ]/g, '') + '*'; let x = 0, out = '';
    for (const ch of s) { const pat = C39[ch]; for (let i = 0; i < 9; i++) { const w = pat[i] === 'w' ? 3 : 1; if (i % 2 === 0) out += `<rect x="${x}" y="0" width="${w}" height="40"/>`; x += w; } x += 1; }
    return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" style="width:100%;height:12mm;margin-top:2mm" fill="#000">${out}</svg>`;
  }
  return { comprobante, remito, hojaRuta, planillaConteo, pedido, etiquetas, imprimir, cab, pie };
})();

/* ════════════════════════════════════════════════════════════════
   js/99-app — arranque
   ════════════════════════════════════════════════════════════════ */
(async function arrancar() {
  try { await Store.cargar(); }
  catch (e) { console.error(e); $('#raiz').innerHTML = '<div class="vacio"><h3>No se pudieron cargar los datos</h3><p>' + esc(e.message) + '</p></div>'; return; }
  if (Store.restaurarSesion()) App.iniciar(); else Bienvenida.mostrar();
})();

</script>
