const Bienvenida = (() => {
  /* Maqueta a escala de la página (no es la pantalla real) con los colores de D'leon */
  function miniApp() {
    const rep = (h, n) => Array.from({ length: n }, (_, i) => h(i)).join('');
    const tonos = ['#E9DFD3', '#D9D4CF', '#E8E1EE', '#DCE6E2', '#EFE3D9', '#E1E6EE', '#E7DCD2', '#DDE2D8'];
    return `<div class="bv-prev"><div class="bvm">
      <div class="bvm-lat"><span class="bvm-logo"></span>${rep(i => `<span class="bvm-nav ${i === 1 ? 'on' : ''}"></span>`, 6)}</div>
      <div class="bvm-cuerpo">
        <div class="bvm-top"><span class="bvm-sel"></span><span class="bvm-bus"></span><span class="bvm-btn"></span></div>
        <div class="bvm-kpis">${rep(i => `<span class="bvm-kpi ${i === 0 ? 'osc' : ''}"><i></i><b></b></span>`, 4)}</div>
        <div class="bvm-grilla">${rep(i => `<span class="bvm-prod" style="--d:${i}"><span class="bvm-foto" style="background:${tonos[i]}"><svg viewBox="0 0 120 90" fill="none" stroke="#3A3532" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".55">${ILUS[['sofa', 'cama', 'ropero', 'comedor', 'rack', 'poltrona', 'heladera', 'comoda'][i]]}</svg></span><i></i><b></b></span>`, 8)}</div>
      </div></div></div>`;
  }
  function mostrar() {
    $('#raiz').innerHTML = `
    <section id="bienvenida" aria-label="Presentación">
      <div class="bv-in">
        <div class="bv-marca"><img src="${LOGO_WYDAN_H}" alt="Wydan Solutions"></div>
        <div class="bv-para">Una demostración preparada para</div>
        <h1 class="bv-t">${esc(BV_NOMBRE)}</h1>
        <div class="bv-s">${esc(BV_ROL)}</div>
        <p class="bv-frase">${esc(BV_FRASE)}</p>
        <div class="bv-vista" aria-hidden="true">${miniApp()}</div>
        <button class="bv-btn" id="bv-entrar">Entrar a la demostración <b>→</b></button>
        <div class="bv-pie">Wydan Solutions · páginas de gestión a medida</div>
      </div>
    </section>`;
    $('#bv-entrar').onclick = () => {
      const s = $('#bienvenida'); s.classList.add('sale');
      setTimeout(() => Ingreso.mostrar(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 260);
    };
    setTimeout(() => $('#bv-entrar')?.focus({ preventScroll: true }), 700);
  }
  return { mostrar };
})();

/* ════════════════════════════════════════════════════════════════
   js/06-nav — componentes de interfaz (UI) y estructura (App)
   ════════════════════════════════════════════════════════════════ */
const UI = (() => {
  const pila = []; // modales/cajones abiertos (Esc cierra el de arriba)

  function toast(msg, tipo = 'ok', op = {}) {
    let cont = $('.toasts'); if (!cont) { cont = document.createElement('div'); cont.className = 'toasts'; cont.setAttribute('aria-live', 'polite'); document.body.appendChild(cont); }
    const t = document.createElement('div'); t.className = 'toast ' + tipo;
    const ic = { ok: 'check', alerta: 'alert', info: 'info' }[tipo] || 'info';
    t.innerHTML = `<span class="t-ico">${ico(ic, 's')}</span><span>${msg}</span>${op.accion ? `<button class="t-acc">${esc(op.accion.txt)}</button>` : ''}`;
    cont.appendChild(t);
    const quitar = () => { if (!t.isConnected) return; t.classList.add('sale'); setTimeout(() => t.remove(), 230); };
    if (op.accion) t.querySelector('.t-acc').onclick = () => { op.accion.fn(); quitar(); };
    setTimeout(quitar, op.ms || (op.accion ? 6500 : 3600));
    while (cont.children.length > 4) cont.firstChild.remove();
  }
  function err(e) {
    if (e instanceof ErrorStock || e instanceof ErrorDato || e instanceof ErrorPermiso) toast(esc(e.message), 'alerta', { ms: 5500 });
    else { console.error(e); toast('Algo no salió bien: ' + esc(e.message || e), 'alerta'); }
  }
  /* Ejecuta una acción del Store con manejo de errores */
  function hacer(fn, okMsg, op) { try { const r = fn(); if (okMsg) toast(okMsg, 'ok', op); return r ?? true; } catch (e) { err(e); return false; } }

  /* Cuando se cierra la última ventana o ficha, la pantalla de atrás se actualiza si hubo cambios */
  function capasCerradas() { if (!pila.length) setTimeout(() => document.dispatchEvent(new Event('capas-cerradas')), 0); }
  function cerrarArriba() { const t = pila[pila.length - 1]; if (t) { t.cerrar(); return true; } return false; }

  function modal({ titulo = '', sub = '', ico: ic = null, icoTipo = '', cuerpo = '', pie = '', ancho = '', alAbrir, alCerrar, clase = '', sinCab = false }) {
    const env = document.createElement('div'); env.className = 'modal-env';
    env.innerHTML = `<div class="velo"></div><div class="modal ${ancho} ${clase}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      ${sinCab ? '' : `<div class="modal-cab">${ic ? `<div class="ico-cab ${icoTipo}">${ico(ic)}</div>` : ''}<div style="flex:1;min-width:0"><h2>${titulo}</h2>${sub ? `<p class="mut peq" style="margin-top:4px">${sub}</p>` : ''}</div><button class="cerrar" data-cerrar aria-label="Cerrar">${ico('x')}</button></div>`}
      <div class="modal-cuerpo">${cuerpo}</div>${pie ? `<div class="modal-pie">${pie}</div>` : ''}</div>`;
    document.body.appendChild(env);
    const previo = document.activeElement;
    requestAnimationFrame(() => { env.querySelector('.velo').classList.add('vis'); env.querySelector('.modal').classList.add('vis'); });
    const h = { el: env.querySelector('.modal'), cerrado: false,
      cerrar() { if (h.cerrado) return; h.cerrado = true; pila.splice(pila.indexOf(h), 1); capasCerradas(); env.querySelector('.velo').classList.remove('vis'); env.querySelector('.modal').classList.remove('vis'); setTimeout(() => env.remove(), 260); alCerrar?.(); previo?.focus?.(); },
      set(html) { h.el.querySelector('.modal-cuerpo').innerHTML = html; },
      pie(html) { let p = h.el.querySelector('.modal-pie'); if (!p) { p = document.createElement('div'); p.className = 'modal-pie'; h.el.appendChild(p); } p.innerHTML = html; } };
    env.addEventListener('click', e => { if (e.target.classList.contains('velo') || e.target.closest('[data-cerrar]')) h.cerrar(); });
    pila.push(h);
    alAbrir?.(h.el, h);
    setTimeout(() => { const f = h.el.querySelector('[autofocus], .modal-cuerpo input:not([type=hidden]):not([type=checkbox]), .modal-cuerpo select'); f?.focus(); }, 60);
    return h;
  }
  function confirmar({ titulo, texto = '', ok = 'Confirmar', peligro = false, ico: ic = 'alert' }) {
    return new Promise(res => {
      let r = false;
      const m = modal({ titulo, ico: ic, icoTipo: peligro ? 'alerta' : '', clase: 'angosto', ancho: 'angosto', cuerpo: `<p class="mut">${texto}</p>`,
        pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn ${peligro ? 'osc' : 'prim'}" id="conf-ok">${ok}</button>`, alCerrar: () => res(r) });
      m.el.querySelector('#conf-ok').onclick = () => { r = true; m.cerrar(); };
      setTimeout(() => m.el.querySelector('#conf-ok').focus(), 80);
    });
  }
  function pedirTexto({ titulo, texto = '', etiqueta = 'Motivo', ok = 'Confirmar', peligro = false, requerido = true, valor = '' }) {
    return new Promise(res => {
      let r = null;
      const m = modal({ titulo, ico: peligro ? 'alert' : 'edit', icoTipo: peligro ? 'alerta' : '', ancho: 'angosto', cuerpo: `${texto ? `<p class="mut" style="margin-bottom:14px">${texto}</p>` : ''}<div class="campo"><label for="pt-in">${etiqueta}</label><textarea class="txa" id="pt-in" rows="3">${esc(valor)}</textarea><div class="err oculto">${ico('alert', 's')} Este dato es obligatorio.</div></div>`,
        pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn ${peligro ? 'osc' : 'prim'}" id="pt-ok">${ok}</button>`, alCerrar: () => res(r) });

    return { stock: a.sinStock.length + a.ajustesGrandes.length + a.ajustesPend.length, entregas, transf, conteos, a };
  }
  const pintarCampana = (inicial) => Avisos.pintarCampana(inicial);

  /* ── Rutas ─────────────────────────────────────────────────── */
  function ir(ruta, sub = null, extra = null) {
    st.extra = extra;
    const h = '#/' + ruta + (sub ? '/' + sub : '');
    if (location.hash === h) render(); else location.hash = h;
  }
  function desdeHash() {
    const [r, s] = location.hash.replace(/^#\/?/, '').split('/');
    const ok = navVisibles().some(n => n.id === r);
    st.ruta = ok ? r : 'panel'; st.sub = ok ? (s || null) : null;
    render();
  }
  addEventListener('hashchange', () => { if (Store.yo()) desdeHash(); });
  let renderPend = false;
  function render() {
    const c = $('#contenido'); if (!c) return;
    $$('.nav-it', $('#nav')).forEach(a => a.classList.toggle('act', a.dataset.r === st.ruta));
    $('#fab')?.classList.toggle('oculto', st.ruta === 'ventas' && (!st.sub || st.sub === 'nueva'));
    $$('#barra-inf button[data-r]').forEach(a => a.classList.toggle('act', a.dataset.r === st.ruta));
    moverInd();
    const v = Vistas[st.ruta];
    c.innerHTML = `<div class="vista" id="vista"></div>`;
    try { v ? v.render($('#vista'), st.sub, st.extra) : ($('#vista').innerHTML = UI.vacio('caja', 'Pantalla en construcción')); }
    catch (e) { console.error(e); $('#vista').innerHTML = UI.vacio('caja', 'Esta pantalla tuvo un problema', esc(e.message)); }
    st.extra = null;
    UI.observar(c);
    document.title = (NAV.find(n => n.id === st.ruta)?.txt || 'Panel') + " · D'leon Muebles";
  }
  /* Repinta lo necesario cuando cambian los datos */
  let sucio = false;
  document.addEventListener('capas-cerradas', () => { if (!sucio || UI.pila.length || !Store.yo() || !$('#app')) return; sucio = false; const y = scrollY; Vistas[st.ruta]?.refrescar?.(); requestAnimationFrame(() => scrollTo(0, y)); });
  Store.alCambiar(() => { if (!Store.yo() || !$('#app')) return; if (UI.pila.length) sucio = true; if (renderPend) return; renderPend = true; requestAnimationFrame(() => { renderPend = false; pintarNav(); pintarCampana(); Vistas[st.ruta]?.refrescar?.(); }); });

  function atajosAyuda() {
    UI.modal({ titulo: 'Atajos de teclado', ico: 'command', ancho: 'angosto', cuerpo: `<div class="col">${[['Ctrl', 'K', 'Buscar o ir a cualquier pantalla'], ['/', '', 'Buscar'], ['N', '', 'Nueva venta'], ['Esc', '', 'Cerrar ventanas']].map(([a, b, t]) => `<div class="fila"><span class="kbd">${a}</span>${b ? `<span class="kbd">${b}</span>` : ''}<span class="mut">${t}</span></div>`).join('')}</div>` });
  }
  addEventListener('keydown', e => {
    if (!Store.yo() || !$('#app')) return;
    const enCampo = e.target.closest?.('input, textarea, select, [contenteditable]');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Paleta.abrir(); return; }
    if (e.key === 'Escape') { $$('.menu').forEach(m => m.remove()); if (UI.cerrarArriba()) e.preventDefault(); return; }
    if (enCampo || e.ctrlKey || e.metaKey || e.altKey || UI.pila.length) return;
    if (e.key === '/') { e.preventDefault(); Paleta.abrir(); }
    else if (e.key.toLowerCase() === 'n' && Store.puede('vender')) { e.preventDefault(); ir('ventas', 'nueva'); }
  });

  return { iniciar, ir, render, st, locsActivos, locUnico, miLocal, pintarNav, pintarCampana, iniciales };
})();

/* ── Paleta de comandos (Ctrl/Cmd + K) ───────────────────────── */
const Paleta = (() => {
  function acciones() {
    const a = [
      { t: 'Ir al Panel general', ico: 'home', fn: () => App.ir('panel') },
      { t: 'Nueva venta', ico: 'cart', fn: () => App.ir('ventas', 'nueva'), perm: 'vender', k: 'N' },
      { t: 'Productos y stock', ico: 'box', fn: () => App.ir('stock') },
      { t: 'Registro de ajustes manuales', ico: 'sliders', fn: () => App.ir('stock', 'ajustes') },
      { t: 'Transferencias', ico: 'swap', fn: () => App.ir('stock', 'transferencias') },
      { t: 'Conteo físico', ico: 'clipboard', fn: () => App.ir('stock', 'conteo'), perm: 'contar' },
      { t: 'Entregas', ico: 'truck', fn: () => App.ir('ventas', 'entregas'), perm: 'entregas' },
      { t: 'Listado de ventas', ico: 'receipt', fn: () => App.ir('ventas', 'lista'), perm: 'vender' },
      { t: 'Cargar un gasto', ico: 'wallet', fn: () => App.ir('gastos', null, { nuevo: true }), perm: 'gastos' },
      { t: 'Lista de reposición', ico: 'truck', fn: () => App.ir('compras'), perm: 'pedirRepo' },
      { t: 'Recibir mercadería', ico: 'inbox', fn: () => App.ir('compras', 'recibidas', { recibir: true }), perm: 'recibirCompra' },
      { t: 'Clientes', ico: 'users', fn: () => App.ir('clientes') },
      { t: 'Importar planilla Excel', ico: 'upload', fn: () => App.ir('config', 'importar'), perm: 'importar' },
      { t: 'Configuración', ico: 'settings', fn: () => App.ir('config'), perm: 'config' },
      { t: 'Bloquear', ico: 'lock', fn: () => $('#bloquear').click() },
    ];
    return a.filter(x => !x.perm || Store.puede(x.perm));
  }
  function abrir() {
    if ($('.paleta')) return;
    let act = 0, res = [];
    const m = UI.modal({ sinCab: true, clase: 'paleta', cuerpo: `<div class="inp-ico">${ico('search')}<input class="inp" id="pal-q" placeholder="Buscá un producto, cliente, venta o acción…" autocomplete="off"></div><div class="paleta-res" id="pal-res"></div><div class="paleta-pie"><span><span class="kbd">↑</span> <span class="kbd">↓</span> moverse</span><span><span class="kbd">Enter</span> abrir</span><span><span class="kbd">Esc</span> cerrar</span></div>` });
    m.el.querySelector('.modal-cuerpo').style.padding = 0;
    const q = m.el.querySelector('#pal-q'), cont = m.el.querySelector('#pal-res');
    const buscar = () => {
      const t = norm(q.value); res = [];
      const acc = acciones().filter(a => !t || norm(a.t).includes(t)).slice(0, t ? 4 : 8).map(a => ({ ...a, grupo: 'Acciones' }));
      if (t.length >= 2) {
        const pal = t.split(' ');
        const prods = Store.productos().filter(p => pal.every(w => Store.textoBusqueda(p).includes(w))).slice(0, 6).map(p => ({ grupo: 'Productos', html: `${miniProd(p, 30)}<span class="esp trunc"><b>${esc(p.nombre)}</b> <span class="mut">${esc(p.variante)}</span></span><span class="mini mut">${p.codigo}</span>`, fn: () => Ficha.abrir(p.id) }));
        const clis = Store.db.clientes.filter(c => pal.every(w => norm(c.nombre + ' ' + c.tel + ' ' + c.doc).includes(w))).slice(0, 4).map(c => ({ grupo: 'Clientes', ico: 'user', t: c.nombre, sub: c.tel, fn: () => Vistas.clientes.fichaCliente(c.id) }));
        const vtas = Store.puede('vender') || Store.esAdmin() ? Store.db.ventas.filter(v => Store.localesFinancieros().includes(v.loc) && norm(v.num).includes(t)).slice(-4).reverse().map(v => ({ grupo: 'Ventas', ico: 'receipt', t: v.num + ' · ' + fmt$(Store.totalesVenta(v).total), sub: fmtF(v.ts), fn: () => Vistas.ventas.detalle(v.id) })) : [];
        res = [...prods, ...clis, ...vtas, ...acc];
      } else res = acc;
      act = 0; pintar();
    };
    const pintar = () => {
      let g = '';
      cont.innerHTML = res.length ? res.map((r, i) => { const cab = r.grupo !== g ? `<div class="mini mut semi" style="padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.06em">${r.grupo}</div>` : ''; g = r.grupo; return cab + `<button class="paleta-it ${i === act ? 'act' : ''}" data-i="${i}">${r.html || `<span class="pi-ico">${ico(r.ico)}</span><span class="esp trunc">${esc(r.t)}</span>${r.sub ? `<span class="mini mut">${esc(r.sub)}</span>` : ''}${r.k ? `<span class="kbd">${r.k}</span>` : ''}`}</button>`; }).join('') : UI.vacio('caja', 'Sin resultados', 'Probá con el código, el color o el proveedor.');
      cont.querySelector('.paleta-it.act')?.scrollIntoView({ block: 'nearest' });
    };
    const elegir = (i) => { const r = res[i]; if (!r) return; m.cerrar(); setTimeout(r.fn, 120); };
    q.addEventListener('input', debounce(buscar, 90));
    q.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { act = Math.min(res.length - 1, act + 1); pintar(); e.preventDefault(); } else if (e.key === 'ArrowUp') { act = Math.max(0, act - 1); pintar(); e.preventDefault(); } else if (e.key === 'Enter') elegir(act); });
    cont.onclick = e => { const b = e.target.closest('[data-i]'); if (b) elegir(+b.dataset.i); };
    buscar(); q.focus();
  }
  return { abrir };
})();

/* ════════════════════════════════════════════════════════════════
   js/07-avisos — centro de avisos de la campana
   Cada aviso tiene una clave propia. Lo que marcás como leído queda
   guardado por usuario: si el aviso cambia (otra fecha, otra lista de
   productos, otro estado) vuelve a aparecer como nuevo.
   ▶ FIRESTORE: los leídos van en leidos/{uid} (un documento por usuario).
   ════════════════════════════════════════════════════════════════ */
const Avisos = (() => {
  let pan = null, fondo = null, vista = 'nuevos', cerrarFuera = null;

  const huella = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

  /* Arma la lista de avisos del usuario actual (más urgentes primero) */
  function lista() {
    if (!Store.yo()) return [];
    const locs = Store.esAdmin() ? Store.localesVisibles() : [Store.yo().localId];
    const hoy = iso(Date.now()); const r = [];
    const nomProd = (id) => { const p = Store.prod(id); return p ? Store.nombreProd(p) : 'Producto'; };

    Store.db.ventas.filter(v => !v.anulada && v.entrega.tipo === 'envio' && v.entrega.estado !== 'entregada' && v.entrega.fecha <= hoy && locs.includes(v.loc)).forEach(v => {
      const atr = v.entrega.fecha < hoy; const dias = atr ? Math.round((deIso(hoy) - deIso(v.entrega.fecha)) / 864e5) : 0;
      const cli = v.cli ? Store.cliente(v.cli)?.nombre : '';
      r.push({ k: `ent:${v.id}:${atr ? 'a' : 'h'}`, prio: atr ? 0 : 1, ico: 'truck', cls: atr ? 'alerta' : 'pend',
        tit: atr ? `Entrega atrasada ${plural(dias, 'día', 'días')}` : (v.entrega.estado === 'encamino' ? 'Entrega en camino hoy' : 'Entrega para hoy'),
        det: [cli, v.entrega.dir].filter(Boolean).join(' · ') || v.num, meta: `${v.num} · ${Store.local(v.loc).nombre}${v.entrega.franja ? ' · ' + v.entrega.franja : ''}`,
        ts: deIso(v.entrega.fecha), abrir: () => { App.ir('ventas', 'entregas'); setTimeout(() => Vistas.ventas.detalle(v.id), 80); } });
    });
    Store.db.transferencias.forEach(t => {
      const uds = t.lineas.reduce((s, l) => s + l.cant, 0);
      if (t.estado === 'enviada' && locs.includes(t.destino)) r.push({ k: `tr:${t.id}:env`, prio: 1, ico: 'swap', cls: 'tra', tit: `Mercadería en camino a ${Store.local(t.destino).nombre}`,
        det: `${plural(uds, 'unidad', 'unidades')} desde ${Store.local(t.origen).nombre} · confirmá cuando llegue`, meta: t.num, ts: t.tsEnv || t.ts,
        abrir: () => { App.ir('stock', 'transferencias'); setTimeout(() => Transf.detalle(t.id), 80); } });
      if (t.estado === 'solicitada' && locs.includes(t.origen)) r.push({ k: `tr:${t.id}:sol`, prio: 1, ico: 'send', cls: 'pend', tit: `${Store.local(t.destino).nombre} pide mercadería`,
        det: t.lineas.length === 1 ? `${t.lineas[0].cant} × ${nomProd(t.lineas[0].prod)}` : `${plural(t.lineas.length, 'producto', 'productos')} · ${plural(uds, 'unidad', 'unidades')}`, meta: `${t.num} · sale de ${Store.local(t.origen).nombre}${t.venta ? ' · para una venta' : ''}`, ts: t.ts,
        abrir: () => { App.ir('stock', 'transferencias'); setTimeout(() => Transf.detalle(t.id), 80); } });
    });
    const a = Store.avisosStock(locs);
    const aj = (x, pend) => ({ k: `aj:${x.id}:${pend ? 'p' : 'g'}`, prio: pend ? 1 : 2, ico: pend ? 'clock' : 'sliders', cls: pend ? 'pend' : 'alerta',
      tit: pend ? 'Ajuste esperando aprobación' : 'Ajuste grande sin revisar',
      det: `${nomProd(x.prod)} · ${x.antes} → ${x.despues} (${signo(x.dif)})`, meta: `${x.num} · ${Store.local(x.loc).nombre} · ${Store.usuario(x.user).nombre} · ${x.motivo}`, ts: x.ts,
      abrir: () => { App.ir('stock', 'ajustes'); setTimeout(() => StockAjustes.detalle(x.id), 80); } });
    a.ajustesPend.forEach(x => r.push(aj(x, true)));
    a.ajustesGrandes.forEach(x => r.push(aj(x, false)));
    if (Store.esAdmin()) Store.db.conteos.filter(c => c.estado === 'enviado' && locs.includes(c.loc)).forEach(c => {
      const dif = c.items.filter(i => i.contado != null && i.contado !== i.sistema).length;
      r.push({ k: `co:${c.id}`, prio: 1, ico: 'clipboard', cls: 'res', tit: `Conteo de ${Store.local(c.loc).nombre} para aprobar`,
        det: `${plural(c.items.length, 'producto contado', 'productos contados')} · ${dif ? plural(dif, 'diferencia', 'diferencias') : 'sin diferencias'}`, meta: `${c.num} · ${Store.usuario(c.userEnv || c.user).nombre}`, ts: c.tsEnv || c.ts,
        abrir: () => { App.ir('stock', 'conteo'); setTimeout(() => Conteo.abrir(c.id), 80); } });
    });
    // Gastos vencidos o que vencen en los próximos 3 días
    const locsG = Store.esAdmin() ? [...locs, 'gen'] : locs.filter(l => Store.puede('gastos', l));
    Store.gastosAPagar(locsG).forEach(g => {
      const e = Store.estadoPago(g); if (e.est === 'pendiente' || (e.est === 'pronto' && e.dias > 3)) return;
      const venc = e.est === 'vencido';
      r.push({ k: `ga:${g.id}:${venc ? 'v' : 'p'}`, prio: venc ? 0 : 2, ico: 'wallet', cls: venc ? 'alerta' : 'pend',
        tit: venc ? `Gasto vencido hace ${plural(-e.dias, 'día', 'días')}` : (e.dias === 0 ? 'Gasto que vence hoy' : e.dias === 1 ? 'Gasto que vence mañana' : `Gasto que vence en ${e.dias} días`),
        det: `${g.concepto || g.cat} · ${fmt$(g.importe)}`, meta: `${g.cat} · ${g.loc === 'gen' ? 'General' : Store.local(g.loc).nombre} · vence ${fmtF(g.vence)}`, ts: deIso(g.vence),
        abrir: () => App.ir('gastos', null, { estado: venc ? 'vencidos' : 'apagar' }) });
    });
    const porLoc = {};
    a.sinStock.forEach(x => (porLoc[x.loc] ||= []).push(x));
    Object.entries(porLoc).forEach(([l, xs]) => {
      const ids = xs.map(x => x.p.id).sort();
      const nombres = xs.slice(0, 2).map(x => Store.nombreProd(x.p));
      r.push({ k: `ss:${l}:${huella(ids.join(','))}`, prio: 3, ico: 'box', cls: 'alerta', tit: `${plural(xs.length, 'producto', 'productos')} sin stock en ${Store.local(l).nombre}`,
        det: nombres.join(', ') + (xs.length > 2 ? ` y ${xs.length - 2} más` : ''), meta: xs.some(x => x.otros.length) ? 'Hay unidades en otros locales para pedir' : 'Hay que reponer', ts: null,
        abrir: () => App.ir('stock', 'avisos') });
    });
    r.forEach(x => { x.leido = Store.estaLeido(x.k); });
    return r.sort((x, y) => x.prio - y.prio || (y.ts || 0) - (x.ts || 0));
  }
  const sinLeer = () => lista().filter(x => !x.leido).length;

  /* ── Campana ─────────────────────────────────────────────── */
  let previo = null;
  function pintarCampana(inicial) {
    const b = $('#campana'); if (!b) return;
    const n = Math.min(99, sinLeer());
    const antes = b.querySelector('.cnt')?.textContent;
    b.innerHTML = ico('bell') + (n ? `<span class="cnt">${n}</span>` : '');
    b.setAttribute('aria-label', n ? `Avisos: ${n} sin leer` : 'Avisos: todo leído');
    if (antes && n && String(n) !== antes) b.querySelector('.cnt').classList.add('salta');
    if (!inicial && previo != null && n > previo) { b.classList.remove('suena'); void b.offsetWidth; b.classList.add('suena'); }
    if (inicial && n) setTimeout(() => b.classList.add('suena'), 900);
    previo = n;
  }

  /* ── Panel ───────────────────────────────────────────────── */
  function itemHtml(x, i) {
    return `<div class="ap-it ${x.leido ? 'leido' : 'nuevo'}" data-k="${esc(x.k)}" role="button" tabindex="0" style="--i:${i}">
      <span class="a-ico ${x.cls}">${ico(x.ico, 's')}</span>
      <div class="ap-txt"><div class="ap-tit">${esc(x.tit)}</div><div class="ap-det">${esc(x.det)}</div>
        <div class="ap-meta">${x.ts ? `<span>${hace(x.ts)}</span><span class="ap-sep">·</span>` : ''}<span class="trunc">${esc(x.meta || '')}</span></div></div>
      <button class="ap-marca" data-marca aria-label="${x.leido ? 'Marcar como no leído' : 'Marcar como leído'}" data-tip="${x.leido ? 'Marcar como no leído' : 'Marcar como leído'}"><span class="ap-pt"></span>${ico('check', 's')}</button>
    </div>`;
  }
  function pintarPanel(anim = true) {
    if (!pan) return;
    const todos = lista(); const nuevos = todos.filter(x => !x.leido);
    const ver = vista === 'nuevos' ? nuevos : todos;
    $('#ap-n', pan).innerHTML = nuevos.length ? `<b>${nuevos.length}</b> sin leer` : 'Todo leído';
    $('#ap-todo', pan).disabled = !nuevos.length;
    $$('#ap-seg button', pan).forEach(b => { const c = b.querySelector('.cuenta'); if (c) { const n = b.dataset.v === 'nuevos' ? nuevos.length : todos.length; c.textContent = n; c.toggleAttribute('data-cero', !n); } });
    const cont = $('#ap-lista', pan);
    cont.classList.toggle('sin-anim', !anim);
    if (!ver.length) {
      cont.innerHTML = `<div class="ap-vacio"><div class="ap-ok">${ico('check')}</div><b>${vista === 'nuevos' && todos.length ? '¡Estás al día!' : 'No hay avisos'}</b><span class="peq mut">${vista === 'nuevos' && todos.length ? `Leíste los ${plural(todos.length, 'aviso', 'avisos')}. Si algo cambia, te lo marcamos de nuevo.` : 'Cuando haya algo para atender va a aparecer acá.'}</span>${vista === 'nuevos' && todos.length ? `<button class="btn fant ch" id="ap-ver-todos">Ver los leídos</button>` : ''}</div>`;
      $('#ap-ver-todos', pan)?.addEventListener('click', () => cambiarVista('todos'));
      return;
    }
    cont.innerHTML = ver.map(itemHtml).join('');
  }
  function cambiarVista(v) {
    vista = v;
    $$('#ap-seg button', pan).forEach(b => { b.classList.toggle('act', b.dataset.v === v); b.setAttribute('aria-checked', b.dataset.v === v); });
    UI.indicador($('#ap-seg', pan), 'button.act', 'seg-ind');
    pintarPanel();
  }
  /* Saca un ítem de la lista con animación (vista «Sin leer») */
  function salir(el) {
    return new Promise(res => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return res(); }
      el.style.height = el.offsetHeight + 'px'; el.classList.add('saliendo');
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.height = '0px'; }));
      setTimeout(() => { el.remove(); res(); }, 360);
    });
  }
  async function marcar(k, leido) {
    Store.marcarLeido(k, leido);
    pintarCampana();
    const el = pan && pan.querySelector(`.ap-it[data-k="${CSS.escape(k)}"]`);
    if (el && vista === 'nuevos' && leido) { el.classList.replace('nuevo', 'leido'); await salir(el); pintarPanel(false); }
    else pintarPanel(false);
  }
  async function marcarTodo() {
    const ks = lista().filter(x => !x.leido).map(x => x.k); if (!ks.length) return;
    Store.marcarLeido(ks, true);
    pintarCampana();
    const els = $$('.ap-it.nuevo', pan);
    els.forEach((el, i) => setTimeout(() => el.classList.replace('nuevo', 'leido'), i * 45));
    await new Promise(r => setTimeout(r, Math.min(els.length * 45, 400) + 260));
    if (vista === 'nuevos') await Promise.all(els.map(salir));
    pintarPanel(false);
    UI.toast(`${plural(ks.length, 'aviso marcado', 'avisos marcados')} como leído${ks.length === 1 ? '' : 's'}`, 'ok', { accion: { txt: "Deshacer", fn: () => { Store.marcarLeido(ks, false); pintarCampana(); pintarPanel(); } } });
  }

  function ubicar() {
    const ancla = $('#campana'); if (!pan || !ancla) return;
    const r = ancla.getBoundingClientRect(); const w = Math.min(400, innerWidth - 16);
    pan.style.width = w + 'px'; pan.style.left = clamp(r.right - w, 8, innerWidth - w - 8) + 'px'; pan.style.top = (r.bottom + 8) + 'px';
    pan.style.setProperty('--flecha', (r.left + r.width / 2 - parseFloat(pan.style.left)) + 'px');
  }
  function cerrar() {
    if (!pan) return;
    const p = pan, f = fondo; pan = null; fondo = null;
    document.removeEventListener('pointerdown', cerrarFuera, true);
    $('#campana')?.setAttribute('aria-expanded', 'false');
    p.classList.add('sale'); f?.classList.add('sale');
    setTimeout(() => { p.remove(); f?.remove(); }, 220);
  }
  function abrir(ancla) {
    if (pan) return cerrar();
    $$('.menu').forEach(m => m.remove());
    const movil = innerWidth <= 620;
    if (movil) { fondo = document.createElement('div'); fondo.className = 'ap-fondo'; document.body.appendChild(fondo); fondo.onclick = cerrar; }
    pan = document.createElement('div'); pan.className = 'ap-pan' + (movil ? ' hoja' : ''); pan.setAttribute('role', 'dialog'); pan.setAttribute('aria-label', 'Avisos');
    pan.innerHTML = `${movil ? '<div class="ap-asa"></div>' : ''}
      <div class="ap-cab"><div><div class="ap-h">Avisos</div><div class="mini mut" id="ap-n"></div></div>
        <button class="btn fant ch" id="ap-todo">${ico('check', 's')} Marcar todo como leído</button></div>
      <div class="seg ch lleno" id="ap-seg" role="radiogroup">
        <button type="button" role="radio" data-v="nuevos" class="${vista === 'nuevos' ? 'act' : ''}">Sin leer <span class="cuenta"></span></button>
        <button type="button" role="radio" data-v="todos" class="${vista === 'todos' ? 'act' : ''}">Todos <span class="cuenta"></span></button></div>
      <div class="ap-lista" id="ap-lista"></div>
      <div class="ap-pie"><button class="btn fant ch" id="ap-ir">${ico('alert', 's')} Ver todos los avisos de stock</button></div>`;
    document.body.appendChild(pan);
    if (!movil) ubicar();
    ancla.setAttribute('aria-expanded', 'true');
    pintarPanel();
    UI.indicador($('#ap-seg', pan), 'button.act', 'seg-ind');
    $('#ap-seg', pan).onclick = e => { const b = e.target.closest('button[data-v]'); if (b && !b.classList.contains('act')) cambiarVista(b.dataset.v); };
    $('#ap-todo', pan).onclick = marcarTodo;
    $('#ap-ir', pan).onclick = () => { cerrar(); App.ir('stock', 'avisos'); };
    const lis = $('#ap-lista', pan);
    lis.onclick = e => {
      const it = e.target.closest('.ap-it'); if (!it) return;
      const x = lista().find(a => a.k === it.dataset.k); if (!x) return;
      if (e.target.closest('[data-marca]')) { e.stopPropagation(); marcar(x.k, !x.leido); return; }
      if (!x.leido) Store.marcarLeido(x.k, true);
      cerrar(); pintarCampana(); x.abrir();
    };
    lis.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('ap-it')) { e.preventDefault(); e.target.click(); } };
    if (movil) {  // deslizar hacia abajo para cerrar
      let y0 = null, dy = 0;
      pan.addEventListener('touchstart', e => { if (lis.scrollTop > 0 && lis.contains(e.target)) return; y0 = e.touches[0].clientY; dy = 0; pan.style.transition = 'none'; }, { passive: true });
      pan.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); pan.style.transform = `translateY(${dy}px)`; }, { passive: true });
      pan.addEventListener('touchend', () => { if (y0 == null) return; pan.style.transition = ''; pan.style.transform = ''; if (dy > 90) cerrar(); y0 = null; });
    }
    cerrarFuera = e => { if (pan && !pan.contains(e.target) && !e.target.closest('#campana') && !e.target.closest('.toast')) cerrar(); };
    setTimeout(() => document.addEventListener('pointerdown', cerrarFuera, true), 0);
  }
  addEventListener('keydown', e => { if (e.key === 'Escape' && pan) { e.stopPropagation(); cerrar(); } }, true);
  addEventListener('resize', () => { if (!pan) return; const movil = innerWidth <= 620; if (movil !== pan.classList.contains('hoja')) { cerrar(); return; } if (!movil) ubicar(); });

  /* Si los datos cambian con el panel abierto, se actualiza solo */
  Store.alCambiar(() => { if (pan) requestAnimationFrame(() => pintarPanel(false)); });

  return { lista, sinLeer, pintarCampana, abrir, cerrar, marcar };
})();

/* ════════════════════════════════════════════════════════════════
   js/10-panel — Panel general + gráficos SVG propios
   ════════════════════════════════════════════════════════════════ */
const Graf = (() => {
  let gid = 0;
  /* Línea con área (ventas por día) */
  function linea(datos, { alto = 220, fmt = fmtK, etiquetas } = {}) {
    const id = 'g' + (++gid); const W = 720, H = alto, pl = 46, pr = 10, pt = 14, pb = 26;
    const max = Math.max(1, ...datos.map(d => d.v)) * 1.12;
    const x = i => pl + (i * (W - pl - pr)) / Math.max(1, datos.length - 1), y = v => pt + (H - pt - pb) * (1 - v / max);
    const pts = datos.map((d, i) => [x(i), y(d.v)]);
    const path = pts.map((p, i) => {
      if (!i) return `M${p[0]},${p[1]}`;
      const p0 = pts[i - 1], cx = (p0[0] + p[0]) / 2; return `C${cx},${p0[1]} ${cx},${p[1]} ${p[0]},${p[1]}`;
    }).join('');
    let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const grid = [0, .25, .5, .75, 1].map(k => `<line class="eje" x1="${pl}" x2="${W - pr}" y1="${y(max / 1.12 * k)}" y2="${y(max / 1.12 * k)}" ${k ? 'stroke-dasharray="2 4"' : ''}/><text x="${pl - 8}" y="${y(max / 1.12 * k) + 4}" text-anchor="end">${fmt(max / 1.12 * k)}</text>`).join('');
    const labs = datos.map((d, i) => (i % Math.ceil(datos.length / 8) === 0 || i === datos.length - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(d.l)}</text>` : '').join('');
    return `<div style="position:relative" class="graf-env" data-graf="${id}"><svg class="graf" viewBox="0 0 ${W} ${H}" data-pts='${JSON.stringify(pts.map((p, i) => [Math.round(p[0]), Math.round(p[1]), datos[i].l, datos[i].v]))}'>
      <defs><linearGradient id="gradMarca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BF1100" stop-opacity=".16"/><stop offset="1" stop-color="#BF1100" stop-opacity="0"/></linearGradient></defs>
      ${grid}${labs}<path class="area" d="${path}L${x(datos.length - 1)},${H - pb}L${pl},${H - pb}Z"/><path class="linea" style="--len:${Math.ceil(len)}" d="${path}"/>
      <line class="guia" y1="${pt}" y2="${H - pb}"/><circle class="punto-h" r="5"/><rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent" class="capa"/></svg><div class="graf-tip"></div></div>`;
  }
  function interactivo(root, fmt = fmt$) {
    $$('.graf-env', root).forEach(env => {
      const svg = env.querySelector('svg'); const pts = JSON.parse(svg.dataset.pts || '[]'); if (!pts.length) return;
      const tip = env.querySelector('.graf-tip'), guia = svg.querySelector('.guia'), pto = svg.querySelector('.punto-h');
      svg.querySelector('.capa').addEventListener('pointermove', e => {
        const r = svg.getBoundingClientRect(); const vx = (e.clientX - r.left) * (720 / r.width);
        let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - vx) < Math.abs(best[0] - vx)) best = p;
        guia.setAttribute('x1', best[0]); guia.setAttribute('x2', best[0]); guia.style.opacity = 1; pto.setAttribute('cx', best[0]); pto.setAttribute('cy', best[1]); pto.style.opacity = 1;
        tip.innerHTML = `<b>${fmt(best[3])}</b>${esc(best[2])}`; tip.style.left = (best[0] / 720 * r.width) + 'px'; tip.style.top = (best[1] / svg.viewBox.baseVal.height * r.height) + 'px'; tip.style.opacity = 1;
      });
      svg.querySelector('.capa').addEventListener('pointerleave', () => { tip.style.opacity = 0; guia.style.opacity = 0; pto.style.opacity = 0; });
    });
  }
  /* Barras verticales agrupadas (comparativo por local/mes) */
  function barras(grupos, series, { alto = 220, fmt = fmtK } = {}) {
    const W = 720, H = alto, pl = 46, pb = 26, pt = 10;
    const max = Math.max(1, ...grupos.flatMap(g => g.v)) * 1.1;
    const gw = (W - pl) / grupos.length, bw = Math.min(26, (gw - 18) / series.length);
    const y = v => pt + (H - pt - pb) * (1 - v / max);
    let out = [0, .5, 1].map(k => `<line class="eje" x1="${pl}" x2="${W}" y1="${y(max / 1.1 * k)}" y2="${y(max / 1.1 * k)}" ${k ? 'stroke-dasharray="2 4"' : ''}/><text x="${pl - 8}" y="${y(max / 1.1 * k) + 4}" text-anchor="end">${fmt(max / 1.1 * k)}</text>`).join('');
    let i = 0;
    grupos.forEach((g, gi) => { const x0 = pl + gi * gw + (gw - bw * series.length - 4 * (series.length - 1)) / 2;
      g.v.forEach((v, si) => { out += `<rect class="barra-v" style="--i:${i++}" x="${x0 + si * (bw + 4)}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - pb - y(v))}" rx="5" fill="${series[si].c}"><title>${esc(series[si].n)} · ${esc(g.l)}: ${fmt$(v)}</title></rect>`; });
      out += `<text x="${pl + gi * gw + gw / 2}" y="${H - 6}" text-anchor="middle">${esc(g.l)}</text>`; });
    return `<svg class="graf" viewBox="0 0 ${W} ${H}">${out}</svg>`;
  }
  /* Barras horizontales (categorías, motivos) */
  function horiz(items, { fmt = fmt$, color = '#BF1100', ancho = 520 } = {}) {
    const max = Math.max(1, ...items.map(i => i.v)); const fh = 34; const H = items.length * fh;
    return `<svg class="graf" viewBox="0 0 ${ancho} ${H}">${items.map((it, i) => `<text x="0" y="${i * fh + 14}" style="fill:var(--texto);font-weight:600;font-size:12px">${esc(it.l)}</text><text x="${ancho}" y="${i * fh + 14}" text-anchor="end" style="font-weight:600">${fmt(it.v)}</text>
      <rect x="0" y="${i * fh + 20}" width="${ancho}" height="7" rx="3.5" fill="#F4F3F1"/><rect class="barra-h" style="--i:${i}" x="0" y="${i * fh + 20}" width="${Math.max(4, it.v / max * ancho)}" height="7" rx="3.5" fill="${it.c || color}"/>`).join('')}</svg>`;
  }
  /* Dona */
  function dona(items, { tam = 180, centro = '', sub = '' } = {}) {
    const tot = sum(items, i => i.v) || 1; const R = 70, r = 48, c = 90; let a0 = -Math.PI / 2;
    const segs = items.map((it, i) => { const a1 = a0 + it.v / tot * Math.PI * 2 - 0.012; const big = a1 - a0 > Math.PI ? 1 : 0;
      const p = (a, rr) => [c + rr * Math.cos(a), c + rr * Math.sin(a)];
      const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [x2, y2] = p(a1, r), [x3, y3] = p(a0, r);
      const d = `M${x0},${y0}A${R},${R} 0 ${big} 1 ${x1},${y1}L${x2},${y2}A${r},${r} 0 ${big} 0 ${x3},${y3}Z`; a0 = a1 + 0.012;
      return `<path class="dona-seg" style="--i:${i}" d="${d}" fill="${it.c}"><title>${esc(it.l)}: ${fmt$(it.v)} (${Math.round(it.v / tot * 100)} %)</title></path>`; }).join('');
    return `<svg class="graf" viewBox="0 0 180 180" style="width:${tam}px;height:${tam}px">${segs}<text x="90" y="88" text-anchor="middle" style="font-size:18px;font-weight:780;fill:var(--texto)">${centro}</text><text x="90" y="106" text-anchor="middle">${sub}</text></svg>`;
  }
  /* Mini gráfico de tendencia para las tarjetas */
  function spark(vals, color = '#BF1100') {
    if (vals.length < 2) return '';
    const max = Math.max(...vals, 1), min = Math.min(...vals, 0); const W = 96, H = 36;
    const pts = vals.map((v, i) => [i * W / (vals.length - 1), H - 3 - (H - 6) * (v - min) / (max - min || 1)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return `<svg class="spark graf" viewBox="0 0 ${W} ${H}"><path d="${d}L${W},${H}L0,${H}Z" fill="${color}" opacity=".08"/><path class="linea" style="--len:${Math.ceil(len)};stroke:${color};stroke-width:1.75" d="${d}"/></svg>`;
  }
  return { linea, interactivo, barras, horiz, dona, spark };
})();

    $('#b-scan').onclick = () => Escaner.abrir(cod => { $('#f-q').value = cod; filtrar(); const p = Store.productos().find(x => x.barras === cod || norm(x.codigo) === norm(cod) || norm(x.codProv) === norm(cod)); if (p) Ficha.abrir(p.id); });
    $('#b-ajustar').onclick = () => Ajuste.abrir({ ids: sel.size ? [...sel] : null });
    $('#sel-ajustar').onclick = () => Ajuste.abrir({ ids: [...sel] });
    $('#sel-limpiar').onclick = () => { sel.clear(); sel.alCambiar(); filtrar(); };
    if (admin) { $('#b-nuevo').onclick = () => ProdForm.abrir(); $('#b-precios').onclick = () => PreciosBloque.abrir(); }
    if (f.vista !== 'lista') { $('#t-prod').classList.remove('card'); }
    this.filtrar = filtrar;
    filtrar();
    setTimeout(() => $('#f-q')?.focus({ preventScroll: true }), 50);
  },
};

const Ficha = {
  abrir(id, tab = 'resumen') {
    const p = Store.prod(id); if (!p) return;

    const cab = `<div class="ficha-cab" style="flex:1;min-width:0">${miniProd(p, 116, 'gr')}<div style="min-width:0;flex:1">

      <h2>${esc(p.nombre)}</h2><div class="fila g6 mut" style="margin-top:4px">${p.variante ? swatch(p.variante, 14) + esc(p.variante) + ' · ' : ''}${esc(Store.proveedor(p.prov)?.nombre || 'Sin proveedor')}</div>
      <div class="fila" style="margin-top:10px;gap:14px;align-items:baseline"><span class="ficha-precio">${fmt$(p.precio)}</span>${p.precioExh ? `<span class="chip exh">Exhibición ${fmt$(p.precioExh)}</span>` : ''}${verCostos ? `<span class="peq mut">Costo ${fmt$(p.costo)} · margen <b class="${Store.margen(p) < 25 ? 'pend-t' : 'ok-t'}">${nf1.format(Store.margen(p))} %</b></span>` : ''}</div></div></div>`;
    const loc = App.miLocal();
    const pie = `<button class="btn prim" data-acc="ajustar">${ico('sliders')} Ajustar stock</button>
      ${Store.puede('cambiarEstado', loc) ? `<button class="btn" data-acc="estado">${ico('shuffle')} Cambiar estado</button>` : ''}
      <button class="btn" data-acc="transf">${ico('swap')} Transferir</button>
      <button class="btn" data-acc="etiqueta">${ico('tag')} Etiqueta</button>
      ${Store.esAdmin() ? `<button class="btn fant dcha" data-acc="editar">${ico('edit')} Editar</button>` : ''}`;
    const h = UI.cajon({ cab, ancho: true, pie, cuerpo: '', alAbrir: (c) => {
      c.querySelector('.cajon-pie').onclick = e => { const b = e.target.closest('[data-acc]'); if (!b) return;
        ({ ajustar: () => Ajuste.abrir({ prod: id }), estado: () => CambioEstado.abrir(id), transf: () => Transf.nueva({ prod: id }), etiqueta: () => Impresos.etiquetas([id]), editar: () => ProdForm.abrir(id) })[b.dataset.acc](); };
    } });
    this.h = h; this.id = id;
    const mp = h.el.querySelector('.ficha-cab .mini-prod'); if (p.foto && mp) { mp.classList.add('con-foto'); mp.setAttribute('role', 'button'); mp.setAttribute('tabindex', '0'); mp.setAttribute('aria-label', 'Ver la foto en grande'); mp.dataset.tip = 'Ver la foto en grande'; mp.onclick = () => Visor.abrir(Store.prod(id)); }
    this.pintar(tab);
    const quitar = Store.alCambiar(() => { if (this.h === h && h.el.isConnected) this.pintar(this.tab, true); else quitar(); });
  },
  pintar(tab, refresco) {
    const p = Store.prod(this.id); const h = this.h; this.tab = tab;
    const locs = Store.locales(); const est = Store.estadisticasProd().get(p.id);
    const tot = Store.stockTotal(p.id);
    const dsv = Store.diasSinVenta(p);
    const rot = est ? (est.u90 / 3) : 0;
    const maxLoc = Math.max(1, ...locs.map(l => Store.fisico(Store.saldo(p.id, l.id)) + Store.saldo(p.id, l.id).tra));
    const barra = (s) => { const t = maxLoc; return `<div class="barra" style="width:${Math.max(6, (Store.fisico(s) + s.tra) / t * 100)}%">${ESTADOS_ORDEN.map((e, i) => s[e] > 0 ? `<i style="width:${s[e] / Math.max(1, Store.fisico(s) + s.tra) * 100}%;background:${ESTADOS[e].color};--i:${i}" title="${ESTADOS[e].nombre}: ${s[e]}"></i>` : '').join('')}</div>`; };
    const contenido = `
      ${UI.tabs([{ id: 'resumen', txt: 'Resumen' }, { id: 'kardex', txt: 'Movimientos (kardex)', cuenta: Store.movsDe(p.id).length }, { id: 'ventas', txt: 'Últimas ventas' }, { id: 'datos', txt: 'Datos' }], tab, 'ficha-tabs')}

    h.cuerpo(contenido);
    const tb = h.el.querySelector('#ficha-tabs'); UI.indicador(tb);
    tb.onclick = e => { const b = e.target.closest('[data-tab]'); if (b) this.pintar(b.dataset.tab); };
    const sub = h.el.querySelector('#ficha-sub');
    if (tab === 'resumen') {
      sub.innerHTML = `
        <div class="stat-mini" style="margin-bottom:20px"><div><b>${Store.vendible(tot)}</b><span>para vender en total</span></div><div><b>${dsv ?? '—'}</b><span>días desde la última venta</span></div><div><b>${nf1.format(rot)}</b><span>unidades vendidas por mes</span></div></div>
        <div class="fila" style="margin-bottom:12px"><h3 class="esp">Stock por local y estado</h3><div class="leyenda">${ESTADOS_ORDEN.map(e => `<span><i style="background:${ESTADOS[e].color}"></i>${ESTADOS[e].corto}</span>`).join('')}</div></div>
        <div class="stock-locales">${locs.map((l, i) => { const s = Store.saldo(p.id, l.id); const min = Store.minimo(p, l.id); return `<div class="stock-loc entra" style="--i:${i}"><div><div class="fila g6 semi peq"><span class="loc-pt" style="background:${l.color}"></span>${esc(l.nombre)}</div><div class="mini mut">${min ? 'Mínimo ' + min : 'Sin mínimo'}${p.ultConteo?.[l.id] ? ' · contado ' + fmtF(p.ultConteo[l.id]) : ''}</div></div><div>${barra(s)}<div class="mini mut" style="margin-top:4px">${ESTADOS_ORDEN.filter(e => s[e]).map(e => `${s[e]} ${ESTADOS[e].corto.toLowerCase()}`).join(' · ') || 'Sin unidades'}</div></div>${chipStock(s, min)}</div>`; }).join('')}</div>
        ${p.notas || p.notaHist ? `<div class="caja" style="margin-top:20px">${p.notas ? `<div class="etq">Notas</div><p class="peq" style="margin-bottom:8px">${esc(p.notas)}</p>` : ''}${p.notaHist ? `<div class="etq">Historial de llegadas (de la planilla)</div><p class="peq mut">${esc(p.notaHist)}</p>` : ''}</div>` : ''}
        <h3 style="margin:22px 0 6px">Últimos movimientos</h3>${this.kardexHtml(p, 6)}
        <button class="btn ch fant" style="margin-top:8px" id="ver-kx">Ver todo el historial ${ico('arrowR', 's')}</button>`;
      sub.querySelector('#ver-kx').onclick = () => this.pintar('kardex');
    } else if (tab === 'kardex') {
      sub.innerHTML = `<div class="fila wrap" style="margin-bottom:10px"><select class="sel ch" id="kx-loc" style="width:auto"><option value="">Todos los locales</option>${locs.map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select><span class="esp"></span><span class="chip" style="background:#FFF1E0;color:#C2410C">${ico('sliders', 's')} Ajuste manual</span></div><div id="kx-lista">${this.kardexHtml(p, 400)}</div>`;
      sub.querySelector('#kx-loc').onchange = e => { sub.querySelector('#kx-lista').innerHTML = this.kardexHtml(p, 400, e.target.value); };
    } else if (tab === 'ventas') {
      const vs = Store.db.ventas.filter(v => v.lineas.some(l => l.prod === p.id) && Store.localesFinancieros().includes(v.loc)).slice(-25).reverse();
      sub.innerHTML = vs.length ? `<div class="card"><table class="tabla compacta"><thead><tr><th>Venta</th><th>Fecha</th><th>Local</th><th>Cliente</th><th class="n">Cant.</th><th class="n">Importe</th></tr></thead><tbody>${vs.map(v => { const l = v.lineas.find(x => x.prod === p.id); return `<tr class="clic" data-v="${v.id}"><td class="semi">${v.num}</td><td>${fmtF(v.ts)}<div class="mini mut">${hace(v.ts)}</div></td><td>${locChip(v.loc)}</td><td class="trunc" style="max-width:160px">${esc(Store.cliente(v.cli)?.nombre || 'Consumidor final')}</td><td class="n">${l.cant}</td><td class="n semi">${fmt$(Store.totalLinea(l))}</td></tr>`; }).join('')}</tbody></table></div>`
        : UI.vacio('cart', 'Todavía no se vendió', Store.esAdmin() ? '' : 'Solo se muestran las ventas de tu local.');
      $$('[data-v]', sub).forEach(r => r.onclick = () => Vistas.ventas.detalle(r.dataset.v));
    } else {
      const minimos = locs.map(l => `${l.corto}: ${Store.minimo(p, l.id)}`).join(' · ');
      sub.innerHTML = `<dl class="datos-lista">
        <dt>Código interno</dt><dd>${p.codigo}</dd><dt>Código proveedor</dt><dd>${esc(p.codProv || '—')}</dd><dt>Código de barras</dt><dd>${esc(p.barras || '—')}</dd>
        <dt>Modelo</dt><dd>${esc(p.modelo)}</dd><dt>Variante</dt><dd>${esc(p.variante || '—')}</dd><dt>Categoría</dt><dd>${esc(Store.categoria(p.cat).nombre)} › ${esc(p.sub)}</dd>
        <dt>Proveedor</dt><dd>${esc(Store.proveedor(p.prov)?.nombre || 'Sin proveedor')}</dd><dt>Stock mínimo</dt><dd>${minimos}</dd>
        <dt>Foto</dt><dd>${p.foto ? `<a class="enlace" href="${esc(urlFoto(p.foto))}" target="_blank" rel="noopener">Ver foto ${ico('link', 's')}</a>` : 'Sin foto · se muestra la ilustración'}</dd>
        <dt>Alta</dt><dd>${fmtF(p.creado)}</dd><dt>Estado</dt><dd>${p.activo ? 'Activo' : 'Discontinuado'}</dd></dl>`;
    }
    h.el.querySelectorAll('[data-ref-venta]').forEach(a => a.onclick = () => Vistas.ventas.detalle(a.dataset.refVenta));
  },
  kardexHtml(p, max = 50, soloLoc = '') {
    const verLocs = Store.localesVisibles();
    const ms = Store.movsDe(p.id).filter(m => verLocs.includes(m.loc) && (!soloLoc || m.loc === soloLoc));
    const saldoLoc = {}; const filas = [];
    for (const m of ms) { saldoLoc[m.loc] = (saldoLoc[m.loc] || 0) + (m.est === 'tra' ? 0 : m.cant); filas.push([m, saldoLoc[m.loc]]); }
    const vis = filas.slice(-max).reverse();
    if (!vis.length) return UI.vacio('activity', 'Sin movimientos');
    return `<div class="kardex">${vis.map(([m, s], i) => { const t = TIPOS_MOV[m.tipo] || { nombre: m.tipo, ico: 'box' }; const u = Store.usuario(m.user);
      const ref = m.ref?.tipo === 'venta' && m.ref.id ? `<a class="enlace" data-ref-venta="${m.ref.id}">${m.ref.num}</a>` : m.ref?.num ? esc(m.ref.num) : '';
      return `<div class="kx-it ${m.tipo} entra" style="--i:${Math.min(i, 10)}"><span class="kx-ico">${ico(t.ico, 's')}</span><div style="min-width:0"><div class="semi peq kx-tipo">${t.nombre}${m.est !== 'disp' ? ` <span class="chip" style="height:18px;font-size:10.5px;color:${ESTADOS[m.est].color};background:var(--fondo-3)">${ESTADOS[m.est].corto}</span>` : ''} ${ref ? '· ' + ref : ''}</div><div class="mini mut trunc"><span class="loc-pt" style="display:inline-block;width:6px;height:6px;background:${Store.local(m.loc).color};margin-right:5px;vertical-align:1px"></span>${esc(Store.local(m.loc).nombre)} · ${fmtFH(m.ts)} · ${esc(u.nombre)}${m.motivo ? ' · ' + esc(m.motivo) : ''}${m.nota ? ' · ' + esc(m.nota) : ''}</div></div><div><div class="kx-cant ${m.cant > 0 ? 'mas' : 'menos'}">${signo(m.cant)}</div><div class="mini mut der num">saldo ${s}</div></div></div>`; }).join('')}</div>`;
  },
};

/* ════════════════════════════════════════════════════════════════
   AJUSTE MANUAL DE STOCK (con confirmación y registro inmutable)
   ════════════════════════════════════════════════════════════════ */
const Ajuste = {
  abrir({ prod = null, ids = null, loc = null } = {}) {
    const editables = Store.localesEditables();
    if (!editables.length) return UI.toast('Tu usuario no puede ajustar stock.', 'alerta');
    const locIni = loc || (editables.includes(App.locUnico()) ? App.locUnico() : editables[0]);
    if (ids && ids.length > 1) return this.multiple(ids, locIni);
    const st = { prod: prod || (ids && ids[0]) || null, loc: locIni, est: 'disp', modo: 'fijar', valor: '', motivo: '', coment: '', foto: '' };
    const verCostos = Store.puede('verCostos');
    const motivos = Store.cfg().motivosAjuste;
    const m = UI.modal({ titulo: 'Ajustar stock', sub: 'Queda registrado con tu usuario, la fecha y la hora. No se puede editar ni borrar.', ico: 'sliders', ancho: 'ancho', cuerpo: `
      <div class="col" style="gap:16px">
        <div class="campo"><label>Producto</label><div id="aj-prod"></div></div>
        <div class="grilla g2">
          <div class="campo"><label for="aj-loc">Local</label><select class="sel" id="aj-loc">${Store.locales().filter(l => editables.includes(l.id)).map(l => `<option value="${l.id}" ${l.id === st.loc ? 'selected' : ''}>${esc(l.nombre)}</option>`).join('')}</select></div>
          <div class="campo"><label>Estado</label>${UI.seg([{ v: 'disp', txt: 'Disponible' }, { v: 'exh', txt: 'Exhibición' }, { v: 'dan', txt: 'Dañado' }], 'disp', { id: 'aj-est', cls: 'lleno' })}</div>
        </div>
        <div class="campo"><label>¿Cómo querés ajustar?</label>${UI.seg([{ v: 'fijar', txt: 'Fijar la cantidad real', ico: 'hash' }, { v: 'sumar', txt: 'Sumar o restar', ico: 'plus' }], 'fijar', { id: 'aj-modo', cls: 'lleno' })}</div>
        <div class="grilla g2" style="align-items:center">
          <div class="campo"><label for="aj-val" id="aj-val-lbl">Cantidad que hay realmente</label><div class="fila g6"><button class="btn ico-b" type="button" data-paso="-1" aria-label="Menos">${ico('minus')}</button><input class="inp num" id="aj-val" type="number" inputmode="numeric" style="text-align:center;font-size:20px;font-weight:700;height:46px"><button class="btn ico-b" type="button" data-paso="1" aria-label="Más">${ico('plus')}</button></div><div class="err oculto" id="aj-val-err"></div></div>
          <div class="aj-previa" id="aj-previa"></div>
        </div>
        <div class="grilla g2">
          <div class="campo"><label for="aj-mot">Motivo <span class="alerta-t">*</span></label><select class="sel" id="aj-mot"><option value="">Elegí un motivo…</option>${motivos.map(x => `<option>${esc(x)}</option>`).join('')}</select><div class="err oculto" id="aj-mot-err">${ico('alert', 's')} Elegí un motivo para poder guardar.</div></div>
          <div class="campo"><label for="aj-com">Comentario <span class="mut" id="aj-com-req">(opcional)</span></label><input class="inp" id="aj-com" placeholder="Ej.: se encontró en el fondo del depósito"><div class="err oculto" id="aj-com-err">${ico('alert', 's')} Con el motivo “Otro” contá brevemente qué pasó.</div></div>
        </div>
        <label class="foto-sub" id="aj-foto-l"><input type="file" accept="image/*" capture="environment" id="aj-foto" hidden>${ico('camera')}<span class="esp">Agregar foto (opcional) · ej. del mueble roto</span><span id="aj-foto-prev"></span></label>
        ${Store.cfg().reglas.ajustesRequierenAprobacion && !Store.esAdmin() ? `<div class="caja pend fila">${ico('clock')}<span>Este ajuste va a quedar <b>pendiente de aprobación</b>: el stock cambia cuando Administración lo apruebe.</span></div>` : ''}
      </div>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="aj-rev">Revisar ajuste ${ico('arrowR')}</button>` });
    const el = m.el;
    const pintarProd = () => {
      const c = el.querySelector('#aj-prod');
      if (st.prod) { const p = Store.prod(st.prod); c.innerHTML = `<div class="caja fila">${prodCelda(p)}<span class="esp"></span>${prod ? '' : `<button class="btn ch" id="aj-camb">Cambiar</button>`}</div>`; c.querySelector('#aj-camb')?.addEventListener('click', () => { st.prod = null; pintarProd(); }); }
      else c.innerHTML = buscadorProd('aj-bus', (id) => { st.prod = id; pintarProd(); previa(); el.querySelector('#aj-val').focus(); });
      if (!st.prod) activarBuscadorProd(el, 'aj-bus', (id) => { st.prod = id; pintarProd(); previa(); el.querySelector('#aj-val').focus(); });
    };
    let ultimoNuevo = null;
    const previa = () => {
      const pv = el.querySelector('#aj-previa');
      if (!st.prod) { pv.innerHTML = `<span class="mut peq">Elegí un producto para ver el cambio</span>`; return; }
      const v = el.querySelector('#aj-val').value;
      const r = Store.previaAjuste({ prod: st.prod, loc: st.loc, est: st.est, modo: st.modo, valor: v === '' ? (st.modo === 'fijar' ? Store.saldoEst(st.prod, st.loc, st.est) : 0) : v });
      const cls = r.dif > 0 ? 'mas' : r.dif < 0 ? 'menos' : 'cero';
      const nuevoCambia = ultimoNuevo !== r.despues; ultimoNuevo = r.despues;
      pv.innerHTML = `<div class="centro"><div class="mini mut">Ahora</div><div class="aj-num">${r.antes}</div></div>${ico('arrowR', 'l mut2')}<div class="centro"><div class="mini mut">Queda</div><div class="aj-num nuevo"><span class="${nuevoCambia ? 'rueda' : ''}">${r.despues}</span></div></div><div class="col" style="gap:6px;align-items:flex-start"><span class="aj-dif ${cls}">${signo(r.dif)}</span>${verCostos && r.dif ? `<span class="mini mut num">${fmt$(r.valor)} a costo</span>` : ''}${Store.esGrande(r.dif, r.valor) && r.dif ? `<span class="chip alerta">Ajuste grande</span>` : ''}</div>`;
      const err = el.querySelector('#aj-val-err');
      if (r.despues < 0) { err.innerHTML = ico('alert', 's') + ' El stock no puede quedar negativo (hay ' + r.antes + ').'; err.classList.remove('oculto'); } else err.classList.add('oculto');
    };
    pintarProd(); previa();
    el.querySelector('#aj-loc').onchange = e => { st.loc = e.target.value; previa(); };
    UI.activarSeg(el.querySelector('#aj-est'), v => { st.est = v; previa(); });

      st.coment = el.querySelector('#aj-com').value.trim(); st.valor = el.querySelector('#aj-val').value;
      let ok = true;

  /* Paso 2: confirmación clara antes de guardar */
  confirmar(m, lista) {

/* ── Buscador de productos reutilizable ──────────────────────── */
function buscadorProd(id, _cb, ph = 'Buscá por nombre, código o color…') {
  return `<div style="position:relative"><div class="inp-ico">${ico('search')}<input class="inp" id="${id}" placeholder="${ph}" autocomplete="off"><button class="btn fant ch ico-b" type="button" id="${id}-scan" aria-label="Leer código">${ico('scan')}</button></div><div class="menu oculto" id="${id}-res" style="position:absolute;left:0;right:0;top:46px;max-height:300px;overflow:auto;animation:none"></div></div>`;
}
function activarBuscadorProd(root, id, cb, filtro = () => true, extra = () => '') {
  const inp = root.querySelector('#' + id), res = root.querySelector('#' + id + '-res'); let act = 0, lista = [];
  const pintar = () => { res.classList.toggle('oculto', !lista.length); res.innerHTML = lista.map((p, i) => `<button type="button" data-id="${p.id}" class="${i === act ? 'act' : ''}">${miniProd(p, 32)}<span class="esp" style="min-width:0"><span class="trunc semi" style="display:block">${esc(p.nombre)}</span><span class="mini mut">${esc(p.variante)} · ${p.codigo}</span></span>${extra(p)}</button>`).join(''); };
  const buscar = () => { const q = norm(inp.value); const pal = q.split(' ').filter(Boolean); lista = q ? Store.productos().filter(p => p.activo && filtro(p) && pal.every(w => Store.textoBusqueda(p).includes(w))).slice(0, 8) : []; act = 0; pintar(); };
  inp.addEventListener('input', debounce(buscar, 80));
  inp.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { act = Math.min(lista.length - 1, act + 1); pintar(); e.preventDefault(); } else if (e.key === 'ArrowUp') { act = Math.max(0, act - 1); pintar(); e.preventDefault(); } else if (e.key === 'Enter' && lista[act]) { e.preventDefault(); elegir(lista[act].id); } });
  const elegir = (pid) => { lista = []; pintar(); inp.value = ''; cb(pid); };
  res.addEventListener('mousedown', e => { const b = e.target.closest('[data-id]'); if (b) { e.preventDefault(); elegir(b.dataset.id); } });
  inp.addEventListener('blur', () => setTimeout(() => { res.classList.add('oculto'); }, 150));
  root.querySelector('#' + id + '-scan')?.addEventListener('click', () => Escaner.abrir(cod => { const p = Store.productos().find(x => x.barras === cod || norm(x.codigo) === norm(cod) || norm(x.codProv) === norm(cod)); if (p) elegir(p.id); else { inp.value = cod; buscar(); } }));
}

      const ok = UI.hacer(() => a === 'baja' ? (de !== 'dan' ? (() => { throw new ErrorDato('Solo se dan de baja unidades marcadas como dañadas.'); })() : Store.bajaPorDanio({ prod: id, loc, cant, nota })) : Store.cambiarEstado({ prod: id, loc, de, a, cant, nota }), a === 'baja' ? 'Baja registrada' : 'Estado actualizado');
      if (ok) m.cerrar();

/* ════════════════════════════════════════════════════════════════
   LECTOR DE CÓDIGO DE BARRAS (BarcodeDetector + tipeo)
   ════════════════════════════════════════════════════════════════ */
const Escaner = {
  async abrir(cb) {
    let stream = null, activo = true;
    const soporta = 'BarcodeDetector' in window && navigator.mediaDevices?.getUserMedia;
    const m = UI.modal({ titulo: 'Leer código de barras', ico: 'scan', ancho: 'angosto', cuerpo: `${soporta ? `<div class="escaner"><video playsinline muted></video><div class="marco"></div><div class="laser"></div></div><p class="peq mut centro" style="margin:10px 0">Apuntá la cámara al código</p>` : `<div class="caja fila" style="margin-bottom:12px">${ico('info')}<span class="peq">Este navegador no lee códigos con la cámara. Tipealo o usá un lector USB.</span></div>`}
      <div class="campo"><label>O tipeá el código</label><div class="fila g6"><input class="inp" id="esc-cod" placeholder="779… / DL-00012 / código del proveedor"><button class="btn prim" id="esc-ok">Buscar</button></div></div>`,
      alCerrar: () => { activo = false; stream?.getTracks().forEach(t => t.stop()); } });
    const listo = (c) => { if (!c) return; m.cerrar(); cb(c.trim()); };
    m.el.querySelector('#esc-ok').onclick = () => listo(m.el.querySelector('#esc-cod').value);
    m.el.querySelector('#esc-cod').onkeydown = e => { if (e.key === 'Enter') listo(e.target.value); };
    if (!soporta) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = m.el.querySelector('video'); v.srcObject = stream; await v.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'qr_code'] });
      const loop = async () => { if (!activo) return; try { const r = await det.detect(v); if (r[0]) { navigator.vibrate?.(60); return listo(r[0].rawValue); } } catch (e) {} requestAnimationFrame(loop); };
      loop();
    } catch (e) { m.el.querySelector('.escaner')?.replaceWith(Object.assign(document.createElement('div'), { className: 'caja', innerHTML: `<span class="peq">No se pudo usar la cámara. Tipeá el código abajo.</span>` })); }
  },
};

    acc.innerHTML = `<button class="btn" id="mv-exp">${ico('download')} Exportar a Excel</button>`;

      <div class="inp-ico">${ico('search')}<input class="inp ch" id="mv-q" placeholder="Producto o referencia" value="${esc(f.q)}"></div>

      <select class="sel ch" id="mv-t" style="width:auto"><option value="">Todos los tipos</option>${Object.entries(TIPOS_MOV).map(([k, v]) => `<option value="${k}" ${f.tipo === k ? 'selected' : ''}>${v.nombre}</option>`).join('')}</select>
      <select class="sel ch" id="mv-l" style="width:auto"><option value="">Todos los locales</option>${Store.locales().map(l => `<option value="${l.id}" ${f.loc === l.id ? 'selected' : ''}>${esc(l.nombre)}</option>`).join('')}</select>
      <select class="sel ch" id="mv-u" style="width:auto"><option value="">Todos los usuarios</option>${Store.cfg().usuarios.map(u => `<option value="${u.id}" ${f.user === u.id ? 'selected' : ''}>${esc(u.nombre)}</option>`).join('')}</select></div><div class="card" id="mv-t-c"></div>`;
    let filas = [];
    const pintar = () => {
      Object.assign(f, { q: $('#mv-q').value, desde: $('#mv-d').value, hasta: $('#mv-h').value, tipo: $('#mv-t').value, loc: $('#mv-l').value, user: $('#mv-u').value }); UI.guardarRec('movs', f);
      const d = deIso(f.desde), h = deIso(f.hasta) + DIA; const q = norm(f.q); const vis = Store.localesVisibles();
      filas = [];
      const ms = Store.db.movs;
      for (let i = ms.length - 1; i >= 0 && filas.length < 5000; i--) { const m = ms[i]; if (m.ts < d || m.ts >= h || !vis.includes(m.loc)) continue; if (f.tipo && m.tipo !== f.tipo) continue; if (f.loc && m.loc !== f.loc) continue; if (f.user && m.user !== f.user) continue;

        { k: 'tipo', t: 'Tipo', html: m => `<span class="fila g6 ${m.tipo === 'ajuste' ? '' : ''}" style="${m.tipo === 'ajuste' ? 'color:#C2410C;font-weight:650' : ''}">${ico(TIPOS_MOV[m.tipo]?.ico || 'box', 's')}${TIPOS_MOV[m.tipo]?.nombre || m.tipo}</span>`, v: m => m.tipo },

        { k: 'loc', t: 'Local', html: m => locChip(m.loc), v: m => m.loc },
        { k: 'est', t: 'Estado', html: m => `<span class="chip" style="color:${ESTADOS[m.est].color}">${ESTADOS[m.est].corto}</span>`, v: m => m.est },
        { k: 'cant', t: 'Cant.', n: true, html: m => `<b class="${m.cant > 0 ? 'ok-t' : 'alerta-t'}">${signo(m.cant)}</b>`, v: m => m.cant },
        { k: 'ref', t: 'Referencia', html: m => `${esc(m.ref?.num || '')}${m.motivo ? `<div class="mini mut">${esc(m.motivo)}</div>` : ''}`, ord: false },
        { k: 'user', t: 'Usuario', html: m => esc(Store.usuario(m.user).nombre), v: m => m.user },
      ] });
    };
    $$('#mv-d, #mv-h, #mv-t, #mv-l, #mv-u', c).forEach(x => x.onchange = pintar); $('#mv-q').oninput = debounce(pintar, 150);
    $('#mv-exp').onclick = () => Exportar.excel('movimientos', filas.map(m => { const p = Store.prod(m.prod); return { Fecha: fmtFH(m.ts), Tipo: TIPOS_MOV[m.tipo]?.nombre, Código: p?.codigo, Producto: Store.nombreProd(p), Local: Store.local(m.loc).nombre, Estado: ESTADOS[m.est].nombre, Cantidad: m.cant, Referencia: m.ref?.num || '', Motivo: m.motivo || '', Nota: m.nota || '', Usuario: Store.usuario(m.user).nombre }; }));

  },
};

function estadoAjChip(a) {
  const e = a._st.estado;
  if (e === 'reversion') return '<span class="chip res">Reversión</span>';
  if (e === 'revertido') return '<span class="chip res">Revertido</span>';
  if (e === 'pendiente') return '<span class="chip pend"><span class="pt"></span>Pendiente</span>';
  if (e === 'rechazado') return '<span class="chip alerta">Rechazado</span>';
  if (a.grande && !a._st.revisado) return '<span class="chip alerta"><span class="pt"></span>Grande · sin revisar</span>';
  return `<span class="chip ok">${a.grande ? 'Revisado' : 'Aplicado'}</span>`;
}
function accionesAjuste(a, grande = false) {
  if (!Store.esAdmin()) return '';
  const e = a._st.estado; const b = (acc, txt, cls = '') => `<button class="btn ${grande ? '' : 'ch'} ${cls}" data-aj="${acc}" data-id="${a.id}">${txt}</button>`;
  if (e === 'pendiente') return `<span class="fila g4">${b('rechazar', 'Rechazar', 'peligro')}${b('aprobar', 'Aprobar', 'prim')}</span>`;
  let h = '';
  if (e === 'aplicado' && a.grande && !a._st.revisado) h += b('revisar', 'Marcar revisado');
  if (e === 'aplicado' && a.tipo !== 'reversion') h += b('revertir', grande ? ico('rotate') + ' Revertir' : 'Revertir', 'fant');
  return `<span class="fila g4" style="justify-content:flex-end">${h}</span>`;
}

const ESTADO_TR = { solicitada: ['pend', 'Solicitada'], enviada: ['tra', 'En tránsito'], recibida: ['ok', 'Recibida'], cancelada: ['', 'Cancelada'] };
const Transf = {

  tarjeta(t, i) {
    const [cls, txt] = ESTADO_TR[t.estado]; const dem = t.estado === 'enviada' && diasDesde(t.tsEnv) > Store.cfg().reglas.diasTransferenciaDemorada;
    const uds = sum(t.lineas, l => l.cant);

    const acc = t.estado === 'solicitada' && Store.puede('enviarTransf', t.origen) ? `<button class="btn ch prim" data-tracc="enviar">${ico('send', 's')} Despachar</button>` : t.estado === 'enviada' && Store.puede('recibirTransf', t.destino) ? `<button class="btn ch prim" data-tracc="recibir">${ico('inbox', 's')} Recibir</button>` : '';

      ${t.venta ? `<div class="caja fila peq" style="padding:8px 10px">${ico('cart', 's')} Para la venta ${Store.venta(t.venta)?.num}</div>` : ''}
      <div class="pasos">${['Solicitada', 'Enviada', 'Recibida'].map((p, k) => `<div class="paso ${k + 1 < paso || paso === 3 ? 'hecho' : k + 1 === paso ? 'actual' : ''}"><span class="p-c">${k + 1 < paso || paso === 3 ? ico('check', 's') : k + 1}</span>${p}</div>${k < 2 ? `<div class="paso-l ${k + 1 < paso ? 'hecho' : ''}"></div>` : ''}`).join('')}</div>
      ${acc ? `<div class="fila" style="justify-content:flex-end">${acc}</div>` : ''}</div></div>`;
  },
  accion(acc, id) {
    const t = Store.transferencia(id);
    if (acc === 'enviar') UI.confirmar({ titulo: 'Despachar ' + t.num, texto: `Sale el stock de ${esc(Store.local(t.origen).nombre)} y queda <b>en tránsito</b> hasta que ${esc(Store.local(t.destino).nombre)} confirme que llegó.`, ok: 'Despachar', ico: 'send' }).then(ok => { if (ok && UI.hacer(() => Store.enviarTransferencia(id), t.num + ' despachada · en tránsito')) { UI.toast('¿Imprimís el remito?', 'info', { accion: { txt: 'Imprimir', fn: () => Impresos.remito(id) } }); } });
    if (acc === 'recibir') this.recibir(id);
    if (acc === 'cancelar') UI.pedirTexto({ titulo: 'Cancelar ' + t.num, etiqueta: 'Motivo', requerido: false, ok: 'Cancelar transferencia', peligro: true }).then(m => m !== null && UI.hacer(() => Store.cancelarTransferencia(id, m), 'Transferencia cancelada'));
  },
  recibir(id) {
    const t = Store.transferencia(id);
    const m = UI.modal({ titulo: 'Recibir ' + t.num, sub: `Desde ${Store.local(t.origen).nombre} · contá lo que llegó`, ico: 'inbox', ancho: 'ancho', cuerpo: `
      <div class="card">${t.lineas.map((l, i) => { const p = Store.prod(l.prod); return `<div class="conteo-it" style="grid-template-columns:44px minmax(0,1fr) auto auto">${miniProd(p, 40)}<div style="min-width:0"><div class="semi trunc peq">${esc(Store.nombreProd(p))}</div><div class="mini mut">Enviadas: <b>${l.cant}</b></div></div><div class="campo" style="gap:2px"><span class="mini mut">Llegaron bien</span><input class="inp num" type="number" min="0" data-ok="${i}" value="${l.cant}"></div><div class="campo" style="gap:2px"><span class="mini mut">Dañadas</span><input class="inp num" type="number" min="0" data-dn="${i}" value="0"></div></div>`; }).join('')}</div>
      <div id="rc-dif" style="margin-top:12px"></div><div class="campo" style="margin-top:12px"><label>Nota de recepción</label><input class="inp" id="rc-nota" placeholder="Ej.: una caja llegó abierta"></div>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="rc-ok">${ico('check')} Confirmar recepción</button>` });
    const dif = () => { const ds = t.lineas.map((l, i) => { const ok = +m.el.querySelector(`[data-ok="${i}"]`).value || 0, dn = +m.el.querySelector(`[data-dn="${i}"]`).value || 0; return { l, ok, dn, falta: l.cant - ok - dn }; }).filter(x => x.falta || x.dn);
      m.el.querySelector('#rc-dif').innerHTML = ds.length ? `<div class="caja pend"><b>Va a quedar registrada la diferencia:</b><ul style="margin:6px 0 0;padding-left:18px">${ds.map(x => `<li class="peq">${esc(Store.nombreProd(Store.prod(x.l.prod)))}: ${x.falta > 0 ? `faltan ${x.falta}` : x.falta < 0 ? `<span class="alerta-t">llegaron ${-x.falta} de más</span>` : ''}${x.dn ? ` · ${x.dn} dañada${x.dn > 1 ? 's' : ''}` : ''}</li>`).join('')}</ul></div>` : `<div class="caja ok fila">${ico('check')} Llegó todo bien</div>`; };
    $$('input[type=number]', m.el).forEach(i => i.oninput = dif); dif();
    m.el.querySelector('#rc-ok').onclick = () => { const rec = t.lineas.map((l, i) => ({ recibido: +m.el.querySelector(`[data-ok="${i}"]`).value || 0, danado: +m.el.querySelector(`[data-dn="${i}"]`).value || 0 }));
      try { Store.recibirTransferencia(id, rec, m.el.querySelector('#rc-nota').value); m.cerrar(); const tt = Store.transferencia(id); UI.exito({ titulo: 'Transferencia recibida', texto: tt.diferencias.length ? 'Quedó registrada con diferencias.' : 'Entró al stock de ' + Store.local(t.destino).nombre + '.' }); } catch (e) { UI.err(e); } };
  },
  detalle(id) {
    const t = Store.transferencia(id); const [cls, txt] = ESTADO_TR[t.estado];
    const m = UI.modal({ titulo: `Transferencia ${t.num}`, sub: `${Store.local(t.origen).nombre} → ${Store.local(t.destino).nombre}`, ico: 'swap', ancho: 'ancho', cuerpo: `
      <div class="fila" style="margin-bottom:14px"><span class="chip ${cls} gr"><span class="pt"></span>${txt}</span>${t.nota ? `<span class="peq mut">${esc(t.nota)}</span>` : ''}</div>
      <div class="card" style="margin-bottom:16px"><table class="tabla compacta"><thead><tr><th>Producto</th><th class="n">Enviado</th><th class="n">Recibido</th><th class="n">Dañado</th></tr></thead><tbody>${t.lineas.map(l => `<tr><td>${prodCelda(Store.prod(l.prod))}</td><td class="n">${l.cant}</td><td class="n">${l.recibido ?? '—'}</td><td class="n">${l.danado || (l.recibido == null ? '—' : 0)}</td></tr>`).join('')}</tbody></table></div>
      ${t.diferencias?.length ? `<div class="caja pend" style="margin-bottom:16px"><b>Diferencias al recibir</b><ul style="margin:6px 0 0;padding-left:18px">${t.diferencias.map(d => `<li class="peq">${esc(d)}</li>`).join('')}</ul>${t.notaRec ? `<p class="peq mut" style="margin-top:6px">${esc(t.notaRec)}</p>` : ''}</div>` : ''}
      <h3 style="margin-bottom:10px">Historial</h3><div class="linea-tiempo">${t.timeline.map(x => `<div class="lt-it"><div class="semi peq">${esc(x.txt)}</div><div class="mini mut">${fmtFH(x.ts)} · ${esc(Store.usuario(x.user).nombre)}</div></div>`).join('')}</div>`,
      pie: `<button class="btn" id="tr-rem">${ico('printer')} Remito</button>${t.estado === 'solicitada' ? `<button class="btn peligro" id="tr-canc">Cancelar</button>` : ''}<span class="esp"></span>${t.estado === 'solicitada' && Store.puede('enviarTransf', t.origen) ? `<button class="btn prim" id="tr-env">${ico('send')} Despachar</button>` : ''}${t.estado === 'enviada' && Store.puede('recibirTransf', t.destino) ? `<button class="btn prim" id="tr-rec">${ico('inbox')} Recibir</button>` : ''}` });
    m.el.querySelector('#tr-rem').onclick = () => Impresos.remito(id);
    m.el.querySelector('#tr-canc')?.addEventListener('click', () => { m.cerrar(); this.accion('cancelar', id); });
    m.el.querySelector('#tr-env')?.addEventListener('click', () => { m.cerrar(); this.accion('enviar', id); });
    m.el.querySelector('#tr-rec')?.addEventListener('click', () => { m.cerrar(); this.recibir(id); });
  },
  /* Nueva transferencia (Administración la crea y despacha; una tienda la pide) */
  nueva({ prod = null, origen = null, destino = null, cant = 1 }) {
    const admin = Store.esAdmin(); const yo = Store.yo();
    const locs = Store.locales();
    const st = { origen: origen || (admin ? 'dep' : (prod ? (locs.find(l => l.id !== yo.localId && Store.vendible(Store.saldo(prod, l.id)) > 0)?.id || 'dep') : 'dep')), destino: destino || (admin ? 't1' : yo.localId), lineas: prod ? [{ prod, cant }] : [] };
    if (!admin && yo.rol === 'deposito') { st.origen = 'dep'; st.destino = destino || 't1'; }
    const puedeDespachar = () => Store.puede('enviarTransf', st.origen);
    const m = UI.modal({ titulo: admin ? 'Nueva transferencia' : 'Transferencia', sub: 'Mové mercadería entre locales. El stock queda "en tránsito" hasta que se confirme la llegada.', ico: 'swap', ancho: 'ancho', cuerpo: `
      <div class="grilla g2" style="margin-bottom:14px;align-items:end"><div class="campo"><label>Desde</label><select class="sel" id="tn-o">${locs.map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select></div><div class="campo"><label>Hacia</label><select class="sel" id="tn-d">${locs.map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select></div></div>
      <div class="campo" style="margin-bottom:12px"><label>Agregar productos</label>${buscadorProd('tn-bus')}</div>
      <div class="card" id="tn-lineas"></div><div class="campo" style="margin-top:12px"><label>Nota</label><input class="inp" id="tn-nota" placeholder="Ej.: para la promo del fin de semana"></div>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button><span class="esp"></span><button class="btn" id="tn-sol">${ico('send')} Solicitar</button><button class="btn prim" id="tn-env">${ico('truck')} Crear y despachar</button>` });
    const el = m.el; el.querySelector('#tn-o').value = st.origen; el.querySelector('#tn-d').value = st.destino;
    if (!admin) { if (yo.rol === 'tienda') el.querySelector('#tn-d').disabled = true; }
    const pintar = () => {
      el.querySelector('#tn-lineas').innerHTML = st.lineas.length ? st.lineas.map((l, i) => { const p = Store.prod(l.prod); const hay = Store.saldoEst(l.prod, st.origen, 'disp'); return `<div class="conteo-it">${miniProd(p, 40)}<div style="min-width:0"><div class="semi trunc peq">${esc(Store.nombreProd(p))}</div><div class="mini ${hay < l.cant ? 'alerta-t' : 'mut'}">Disponible en ${esc(Store.local(st.origen).corto)}: ${hay}</div></div><div class="fila g6"><input class="inp num" type="number" min="1" value="${l.cant}" data-c="${i}" style="width:70px;height:38px"><button class="btn fant ch ico-b" data-x="${i}" aria-label="Quitar">${ico('x', 's')}</button></div></div>`; }).join('') : UI.vacio('route', 'Agregá los productos a transferir');
      $$('[data-c]', el).forEach(x => x.oninput = () => { st.lineas[+x.dataset.c].cant = +x.value; });
      $$('[data-x]', el).forEach(x => x.onclick = () => { st.lineas.splice(+x.dataset.x, 1); pintar(); });
      el.querySelector('#tn-env').classList.toggle('oculto', !puedeDespachar());
    };
    activarBuscadorProd(el, 'tn-bus', id => { const l = st.lineas.find(x => x.prod === id); l ? l.cant++ : st.lineas.push({ prod: id, cant: 1 }); pintar(); }, () => true, p => `<span class="mini mut">${Store.local(st.origen).corto}: ${Store.saldoEst(p.id, st.origen, 'disp')}</span>`);
    el.querySelector('#tn-o').onchange = e => { st.origen = e.target.value; pintar(); };
    el.querySelector('#tn-d').onchange = e => { st.destino = e.target.value; };
    const datos = () => ({ origen: st.origen, destino: st.destino, lineas: st.lineas.filter(l => l.cant > 0), nota: el.querySelector('#tn-nota').value });
    el.querySelector('#tn-sol').onclick = () => { try { const d = datos(); if (!admin && yo.rol === 'tienda' && d.destino !== yo.localId) throw new ErrorPermiso('Solo podés pedir mercadería para tu local.'); const t = Store.solicitarTransferencia(d); m.cerrar(); UI.toast(`${t.num} solicitada a ${Store.local(t.origen).nombre}`, 'ok', { accion: { txt: 'Deshacer', fn: () => UI.hacer(() => Store.cancelarTransferencia(t.id, 'Deshecha'), 'Solicitud cancelada') } }); } catch (e) { UI.err(e); } };
    el.querySelector('#tn-env').onclick = () => { try { const t = Store.crearYEnviar(datos()); m.cerrar(); UI.exito({ titulo: `${t.num} en camino`, texto: `${sum(t.lineas, l => l.cant)} u. salieron de ${Store.local(t.origen).nombre} hacia ${Store.local(t.destino).nombre}.`, botones: `<button class="btn" data-cerrar onclick="Impresos.remito('${t.id}')">${ico('printer')} Remito</button><button class="btn prim" data-cerrar>Listo</button>` }); } catch (e) { UI.err(e); } };
    pintar();
  },
};

/* ════════════════════════════════════════════════════════════════
